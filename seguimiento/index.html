<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/favicon.png"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"><link rel="manifest" href="/site.webmanifest"><meta name="theme-color" content="#002E5B"><meta name="application-name" content="Caleva Suite">
<style>
/* Fuentes incrustadas mas abajo: sin peticiones externas. */
body,button,input,select,textarea,table,th,td,h1,h2,h3,h4{font-family:Barlow,"Segoe UI",system-ui,-apple-system,sans-serif!important}</style>
<style>
:root{--navy:#002E5B;--navy2:#0F4676;--blue:#1E5AA8;--green:#28ad7c;--red:#C0201E;--orange:#e68e22;--purple:#44729c;--cyan:#3585d0;--bg:#F0F2F4;--bd:#BCCBD8;--ink:#10171E;--mut:#5B6B7A}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Barlow,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:13px}
.top-header{background:linear-gradient(135deg,var(--navy),#0F4676);padding:16px 30px;color:#fff;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;box-shadow:0 2px 12px rgba(26,47,67,.25)}
.top-header h1{font-size:19px;font-weight:700}
.top-header p{font-size:11px;opacity:.82;margin-top:3px}
.brandbox{display:flex;align-items:center;gap:14px}
.brand-logo{height:46px;background:#fff;padding:5px 10px;border-radius:8px;display:block}
.header-badges{display:flex;gap:9px;flex-wrap:wrap}
.header-badge{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);border-radius:10px;padding:8px 15px;text-align:center;white-space:nowrap}
.header-badge .val{font-size:17px;font-weight:700}
.header-badge .lbl{font-size:9px;opacity:.85;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.header-badge.rojo{background:rgba(182,43,41,.28);border-color:rgba(182,43,41,.5)}
.header-badge.verde{background:rgba(40,173,124,.25);border-color:rgba(40,173,124,.5)}
.tabs{display:flex;background:var(--navy);padding:0 30px;gap:2px;overflow-x:auto;position:sticky;top:0;z-index:50}
.tab{padding:12px 20px;cursor:pointer;color:#9FB6C7;font-size:12px;font-weight:600;border-bottom:3px solid transparent;transition:.18s;user-select:none;white-space:nowrap}
.tab:hover{color:#fff;background:rgba(255,255,255,.05)}
.tab.active{color:#fff;border-bottom-color:var(--cyan)}
.tab.soon{opacity:.5;cursor:default}
.tab.soon:hover{background:none;color:#9FB6C7}
.wrap{padding:20px 30px;max-width:1500px;margin:0 auto}
.panel{display:none}.panel.active{display:block}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar select,.toolbar input{padding:7px 11px;border:1px solid var(--bd);border-radius:7px;font-size:12px;background:#fff}
.btn{padding:7px 14px;border:none;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;color:#fff;background:var(--blue)}
.btn:hover{filter:brightness(1.08)}
.btn.g{background:var(--green)}.btn.o{background:var(--orange)}.btn.gr{background:#5B6B7A}.btn.r{background:var(--red)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:#fff;border-radius:10px;padding:14px 16px;border-left:4px solid var(--navy);box-shadow:0 1px 5px rgba(26,47,67,.08)}
.kpi.red{border-left-color:var(--red)}.kpi.green{border-left-color:var(--green)}.kpi.orange{border-left-color:var(--orange)}.kpi.navy{border-left-color:var(--navy)}.kpi.purple{border-left-color:var(--purple)}.kpi.blue{border-left-color:var(--blue)}
.kpi-lbl{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.kpi-val{font-size:22px;font-weight:700;margin-top:5px}
.kpi-sub{font-size:10.5px;color:var(--mut);margin-top:3px}
.card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 6px rgba(26,47,67,.08);margin-bottom:20px}
.section-hdr{background:var(--navy);color:#fff;padding:11px 16px;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.section-hdr-right{font-size:11px;opacity:.78;font-weight:400}
.section-body{padding:14px 16px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#E8EEF5;color:var(--navy2);font-size:10px;font-weight:700;padding:8px 9px;text-align:left;text-transform:uppercase;border-bottom:2px solid var(--bd);white-space:nowrap;cursor:pointer}
th:hover{background:#dfe9f2}
td{padding:7px 9px;border-bottom:1px solid var(--bg)}
tr:hover td{background:#f7fafc}
.mono{font-family:Consolas,monospace;font-size:11px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.center{text-align:center}
.tfoot-row td{background:#E8EEF5;font-weight:700;color:var(--navy);border-top:2px solid var(--bd)}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700}
.pill.ok{background:#eafaf4;color:var(--green)}
.pill.pend{background:#fef1e3;color:var(--orange)}
.pill.venc{background:#FBEBEA;color:var(--red)}
.bars{display:flex;align-items:flex-end;gap:6px;height:170px;padding:10px 4px 0}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.bar-stack{width:100%;max-width:46px;display:flex;flex-direction:column;justify-content:flex-end;flex:1}
.bar-seg{width:100%}
.bar-lbl{font-size:9.5px;color:var(--mut);white-space:nowrap}
.bar-val{font-size:9px;color:var(--navy2);font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:10.5px;color:var(--navy2);margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.foot{text-align:center;color:var(--mut);font-size:10.5px;padding:16px}
.empty{padding:26px;text-align:center;color:var(--mut);font-style:italic}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.tab.proc{color:#f9ca90}.tab.proc.active{color:#fff;border-bottom-color:#f18b0f}
.tabsep{width:1px;background:rgba(255,255,255,.18);margin:8px 6px}
.form{background:#fff;border-radius:10px;padding:18px;box-shadow:0 1px 6px rgba(26,47,67,.08);margin-bottom:20px}
.form h3{font-size:14px;color:var(--navy);margin-bottom:14px}
.frow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:10px;color:var(--mut);text-transform:uppercase;font-weight:600;letter-spacing:.3px}
.fld input,.fld select{padding:8px 11px;border:1px solid var(--bd);border-radius:7px;font-size:13px;background:#fff;min-width:130px}
.fld input:focus,.fld select:focus{outline:2px solid var(--cyan);border-color:var(--cyan)}
.fld .wide{min-width:280px}
.itemtbl{width:100%;border-collapse:collapse;margin:8px 0 4px}
.itemtbl th{background:#E8EEF5;font-size:9.5px;padding:6px 8px}
.itemtbl td{padding:4px 6px;border-bottom:1px solid var(--bg)}
.itemtbl input{width:100%;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;font-size:12px}
.chk{width:17px;height:17px;cursor:pointer;accent-color:var(--green)}
.hint{font-size:11px;color:var(--mut);margin-top:4px}
.badge2{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700}
.badge2.b1{background:#FBEBEA;color:var(--red)}.badge2.b2{background:#fef1e3;color:var(--orange)}.badge2.b3{background:#eafaf4;color:var(--green)}
.info-pedido{background:#E8EEF5;border-radius:8px;padding:10px 14px;font-size:12px;color:var(--navy2);display:flex;gap:22px;flex-wrap:wrap;margin-bottom:12px}
.info-pedido b{color:var(--navy)}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(26,47,67,.55);z-index:200;align-items:flex-start;justify-content:center;overflow-y:auto;padding:18px 0}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:12px;width:min(520px,94vw);box-shadow:0 10px 40px rgba(0,0,0,.3);overflow:hidden;max-height:92vh;display:flex;flex-direction:column;margin:auto}
.modal .mh{background:var(--navy);color:#fff;padding:13px 18px;font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;flex:0 0 auto}
.modal .mh .x{cursor:pointer;opacity:.8}.modal .mh .x:hover{opacity:1}
.modal .mb{padding:18px;overflow-y:auto;flex:1 1 auto}
.pay-btn{padding:4px 10px;border:none;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;background:var(--green);color:#fff}
.flink{cursor:pointer;color:var(--blue);font-weight:700;text-decoration:underline}
.flink:hover{color:var(--navy)}
.mtx{border-collapse:collapse;font-size:11px}

:root{

/* Con «body» delante estas reglas ganan a la hoja base (0,0,2 > 0,0,1) SIN

body th{background:none;color:var(--mut3);box-shadow:none;

.itemtbl td.center,.itemtbl th.center{text-align:center;white-space:nowrap;width:1%}
/* la descripción es lo único que puede envolverse, y sólo si hace falta */
.itemtbl td:nth-child(4){white-space:normal;min-width:220px;line-height:1.45}
.modal .frow{gap:8px;flex-wrap:wrap;padding-top:4px}
.modal .frow .btn{flex:0 0 auto}
/* el pie del modal distingue por rol: acción secundaria en azul suave,
   confirmación en verde, destructiva en rojo, cierre en neutro */
.modal .frow .btn.o{background:#E8EEF5!important;color:var(--blue)!important;
  border:1px solid #d0deec!important}
.modal .frow .btn.o:hover{background:#ebf1f7!important}
.modal .frow .btn.g{background:var(--green)!important;color:#fff!important;border:none!important}
.modal .frow .btn.r{background:var(--red)!important;color:#fff!important;border:none!important}
.modal .frow .btn.gr{background:#fff!important;color:var(--mut)!important;
  border:1px solid var(--rule)!important}

/* ══ ALINEACIÓN DE CABECERAS ══════════════════════════════════════════
   El ayudante th() no marcaba las columnas numéricas, así que el título
   quedaba a la izquierda y su cifra a la derecha. Ahora emite class="num"
   y .num ya alinea a la derecha: se corrige en TODAS las tablas a la vez. */
th.num{text-align:right}
th.center{text-align:center}

/* ── columna Cobranza del resumen por año ── */
.cbz{display:inline-block;width:54px;height:6px;background:var(--hair);
  vertical-align:middle;margin-right:8px}
.cbz i{display:block;height:100%;font-style:normal}
.cbz-n{font-size:11.5px;font-weight:600;color:var(--mut)}

/* ══ DASHBOARD ════════════════════════════════════════════════════════
   Diez KPI en dos filas de cinco, y los gráficos en dos columnas: la
   tendencia mensual sola a lo ancho quedaba desparramada.              */
@media(min-width:1200px){
  .kpis{grid-template-columns:repeat(5,minmax(0,1fr))}
  .kpi:nth-child(5n){border-right:none!important}
  .kpi:nth-child(n+6){border-top:1px solid var(--rule)!important}
}
.dash-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);
  gap:0;align-items:start;margin-top:18px}
.dash-grid > .card:first-child{padding-right:28px;border-right:1px solid var(--rule)}
.dash-side{padding-left:28px;min-width:0}
.dash-side > .card:first-child{border-top:1px solid var(--rule)!important}
.bars{gap:6px;max-width:100%}
.bar-col{max-width:60px}

/* antigüedad de la cartera */
.ag-bar{display:flex;height:20px;margin-bottom:14px;background:var(--hair)}
.ag-bar i{display:block;height:100%;font-style:normal}
.ag-row{display:flex;align-items:center;gap:10px;padding:6px 0;
  border-bottom:1px solid var(--hair);font-size:12.5px}
.ag-row:last-child{border-bottom:none}
.ag-k{flex:1;display:flex;align-items:center;gap:8px;color:var(--mut)}
.ag-k i{width:9px;height:9px;flex:0 0 auto;font-style:normal}
.ag-row b{font-weight:600;color:var(--navy)}
.ag-p{width:42px;text-align:right;color:var(--mut3);font-size:11.5px}

/* concentración por cobrar */
.tp-row{display:flex;align-items:center;gap:10px;padding:6px 0;
  border-bottom:1px solid var(--hair);font-size:12.5px}
.tp-row:last-child{border-bottom:none}
.tp-k{width:104px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-bar{flex:1;height:8px;background:var(--hair);min-width:36px}
.tp-bar i{display:block;height:100%;background:var(--blue);font-style:normal}
.tp-row b{width:92px;text-align:right;font-weight:600;color:var(--navy)}

@media(max-width:1100px){
  .dash-grid{grid-template-columns:1fr}
  .dash-grid > .card:first-child{padding-right:0;border-right:none}
  .dash-side{padding-left:0}
}

/* ══ VENTANAS DE CONSULTA ═════════════════════════════════════════════
   Todas se pueden mover (arrastrando la cabecera) y redimensionar (tirador
   en la esquina inferior derecha). El comportamiento lo instala ventanas.js;
   aquí solo van las señales visuales.                                    */
.vent{resize:both;overflow:auto}
.vent-cab{cursor:move;user-select:none;-webkit-user-select:none;touch-action:none}
.vent-cab:active{cursor:grabbing}
/* mientras se arrastra, nada de selección ni de textos resaltados por error */
body.vent-moviendo{user-select:none;-webkit-user-select:none;cursor:move}
/* tirador visible: por defecto el del navegador casi no se ve sobre blanco */
.vent::-webkit-resizer{background:linear-gradient(135deg,transparent 48%,var(--rule) 48%,var(--rule) 62%,transparent 62%,transparent 72%,var(--rule) 72%,var(--rule) 86%,transparent 86%)}
.modal.vent,.fac-editor.vent{max-height:none}

/* ══ LISTADOS · total y selección ══════════════════════════════════════
   La casilla y la fila TOTAL las inyecta seleccion.js; aquí sólo su aspecto. */
th.sel-col,td.sel-col{width:1%;padding-right:10px!important;text-align:center;
  white-space:nowrap;cursor:pointer}
th.sel-col input,td.sel-col input{width:14px;height:14px;accent-color:var(--blue);
  cursor:pointer;vertical-align:middle}
tbody tr.sel-on td{background:#E8EEF5!important}
tbody tr.sel-on td.sel-col{box-shadow:inset 2px 0 0 var(--blue)}
tr.sel-total td{border-top:2px solid var(--navy)!important;border-bottom:none!important;
  font-weight:600;color:var(--navy);padding-top:9px!important;background:none!important}
td.sel-total-lbl{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--mut3);font-weight:600}

/* barra de selección · abajo a la IZQUIERDA, para no chocar con
   los botones flotantes de Indicadores y Auditoría */
#selBarra{position:fixed;left:22px;bottom:16px;z-index:420;display:none;
  align-items:center;gap:0;background:var(--navy);color:#fff;border-radius:5px;
  padding:0 4px 0 14px;box-shadow:0 6px 22px rgba(21,43,64,.34);
  font-family:Barlow,-apple-system,"Segoe UI",sans-serif;max-width:calc(100vw - 300px);
  overflow-x:auto}
#selBarra.on{display:flex}
#selBarra .sb-n{font-size:11px;letter-spacing:.6px;color:#BCCBD8;white-space:nowrap;
  padding:10px 16px 10px 0;border-right:1px solid rgba(255,255,255,.18)}
#selBarra .sb-i{display:flex;flex-direction:column;gap:1px;padding:8px 16px;
  border-right:1px solid rgba(255,255,255,.18);white-space:nowrap}
#selBarra .sb-i b{font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
#selBarra .sb-i i{font-style:normal;font-size:8.5px;letter-spacing:1.2px;
  text-transform:uppercase;color:#BCCBD8}
#selBarra .sb-x{background:none;border:none;color:#f9c78a;cursor:pointer;
  font-family:inherit;font-size:11px;font-weight:600;padding:10px 14px;letter-spacing:.4px}
#selBarra .sb-x:hover{color:#fff}
@media print{ #selBarra{display:none!important} th.sel-col,td.sel-col{display:none} }

/* ── módulo Configuración ── */
/* el filtro de año y la búsqueda no aplican aquí: sólo serían ruido */
.wrap:has(#tab-config.active) > .toolbar{display:none}
.cfg-sec{padding:2px 0 4px;max-width:720px}
.cfg-txt{font-size:13px;color:var(--mut);line-height:1.65;margin:0 0 14px;max-width:620px}
.cfg-txt b{color:var(--ink);font-weight:600}

/* ── holgura para la barra flotante de utilidades ──
   Indicadores y Auditoría son botones position:fixed inyectados por el JS con
   estilos en línea: tapaban las últimas filas de las tablas largas. */
.wrap{padding-bottom:64px}
/* apuntados por id: style.cssText se serializa con espacios
   («position: fixed»), asi que un selector de atributo sin ellos
   no coincidia nunca. */
#segAuditBtn,#segIndBtn{border-radius:4px!important;
  box-shadow:0 4px 14px rgba(21,43,64,.22)!important}

@media print{ #bcvBadge{border-right:none!important} .wrap{padding-bottom:0} }
@media(max-width:900px){
  .top-header{padding:10px 14px;gap:10px}
  .hdr-right{gap:6px}
  .hdr-user b{max-width:120px}
}

/* ============ TASA BCV DEL DÍA ============ */
var BCV={tasa:0,fecha:'',
  hoy:function(){return new Date().toISOString().slice(0,10);},
  manual:false,
  cargar:function(){
    var self=this;
    var c=null;try{c=JSON.parse(localStorage.getItem('bcv_hoy'));}catch(e){}
    if(c&&c.tasa){this.tasa=c.tasa;this.fecha=c.fecha||'';this.manual=!!c.manual;this.mostrar();}
    // si la fijaste a mano hoy, respétala (no la pises con la API)
    if(this.manual&&this.fecha===this.hoy())return;
    try{
      fetch('https://ve.dolarapi.com/v1/dolares/oficial').then(function(r){return r.json();}).then(function(d){
        var t=+((d&&(d.promedio||d.precio))||0);
        var fe=(d&&d.fechaActualizacion)?String(d.fechaActualizacion).slice(0,10):self.hoy();
        if(t>0){self.tasa=t;self.fecha=fe;self.manual=false;try{localStorage.setItem('bcv_hoy',JSON.stringify({fecha:fe,tasa:t,manual:false}));}catch(e){}self.mostrar();}
      }).catch(function(){self.mostrar();});
    }catch(e){self.mostrar();}
  },
  mostrar:function(){
    var b=document.getElementById('bcvVal');if(!b)return;
    b.textContent=this.tasa?ve(this.tasa,4):'fijar';
    var esHoy=(this.fecha===this.hoy());
    var lbl=document.querySelector('#bcvBadge .lbl');
    if(lbl)lbl.innerHTML='Tasa BCV '+(this.manual?'(manual) ':'')+(this.fecha?(esHoy?'hoy':this.fecha.split('-').reverse().join('/')):'');
    var bad=document.getElementById('bcvBadge');
    if(bad){
      /* la presentación la decide la hoja de estilos; aquí sólo el estado */
      bad.className='header-badge '+(!this.tasa?'bcv-nulo':(esHoy?'bcv-hoy':'bcv-viejo'));
    }
  },
  set:function(){
    var v=prompt('Tasa BCV de HOY (Bs/USD). Use punto o coma decimal:',this.tasa?String(this.tasa):'');
    if(v===null)return;
    v=String(v).trim().replace(/\s/g,'');
    if(v.indexOf(',')>=0 && v.indexOf('.')>=0){v=v.replace(/\./g,'').replace(',','.');}else{v=v.replace(',','.');}
    var t=+v;if(!(t>0)){toast('Tasa inválida');return;}
    this.tasa=t;this.fecha=this.hoy();this.manual=true;try{localStorage.setItem('bcv_hoy',JSON.stringify({fecha:this.fecha,tasa:t,manual:true}));}catch(e){}
    this.mostrar();toast('Tasa BCV fijada: '+ve(t,4));
  }
};

/* ============ CAPA DE DATOS + PERSISTENCIA ============

/* ============ UTILIDADES ============ */
/* Cada 'factura' agrupa sus lineas HES (una factura = un No.Factura).
   Clasificacion validada contra DATOS por la columna STATUS (igual que la hoja ANALISIS). */
function esCobrada(f){return f.status==='Pagada';}
function esPorCobrar(f){return f.status!=='Pagada';}
function esParcial(f){return esPorCobrar(f) && (+f.pagos||0)>0.01;}
/* Copia SIN los campos transitorios (_m, _mora...). No son datos: los
   recalcula diasEntre() contra la fecha de hoy. Fuera del guardado para no
   engordar cada escritura a la nube ni ensuciar respaldos. No muta el
   original: en memoria se siguen necesitando para pintar la mora. */
function sinTransitorios(o){
  if(Array.isArray(o))return o.map(sinTransitorios);
  if(o&&typeof o==='object'){var r={};for(var k in o){
    if(!Object.prototype.hasOwnProperty.call(o,k))continue;
    if(k.charAt(0)==='_')continue;
    r[k]=sinTransitorios(o[k]);} return r;}
  return o;
}
/* Cobrado real = efectivo recibido + amortizacion del anticipo.
   Para amortizarse, ese dinero tuvo que entrar antes como anticipo.
   Con esto se cumple la identidad: base = cobrado + porCobrar. */
function cobradoDe(f){return (+f.pagos||0)+(+f.amortizado||0);}
function money(n){n=+n||0;return '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function money0(n){n=+n||0;return '$'+n.toLocaleString('en-US',{maximumFractionDigits:0});}
function pct(n){return (Math.round((+n||0)*1000)/10)+'%';}
function fdate(s){if(!s)return '';var p=s.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s;}
function hoy(){return new Date();}
function diasEntre(iso){if(!iso)return null;var d=new Date(iso+'T00:00:00');return Math.floor((hoy()-d)/86400000);}
var MESES=['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

    // resumen por año

    var ys=Object.keys(byY).sort();
    var rowsY=ys.map(y=>{var o=byY[y];/* criterio unico de la casa: todo porcentaje se calcula sobre la BASE

    var tblY='<div class="card"><div class="section-hdr">Resumen por año<span class="section-hdr-right">'+n+' facturas</span></div><div class="section-body"><table id="tY"><thead><tr>'+
      th('Año','tY',0)+th('Facturas','tY',1,1)+th('Base','tY',2,1)+th('IVA','tY',3,1)+th('Total','tY',4,1)+th('Cobrado','tY',5,1)+th('Por cobrar','tY',6,1)+'<th class="center" title="Cobrado sobre base imponible">Cobranza</th></tr></thead><tbody>'+
      (rowsY||'<tr><td colspan="8" class="empty">Sin datos</td></tr>')+'</tbody></table></div></div>';
    // tendencia mensual (del año seleccionado, o el más reciente si "todos")

    // alerta: vencidas y próximas a vencer (<=7 días)

    var venc=P.filter(f=>f._m!=null&&f._m>0), prox=P.filter(f=>f._m!=null&&f._m<=0&&f._m>=-7);
    var mV=venc.reduce((a,f)=>a+f.porCobrar,0), mP=prox.reduce((a,f)=>a+f.porCobrar,0);
    var alerta='';
    if(venc.length||prox.length){
      alerta='<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px">';

      if(prox.length)alerta+='<div onclick="UI.setFacFiltro(\'porcobrar\');UI.tab(\'facturas\',document.querySelector(\'.tab[data-tab=facturas]\'))" style="cursor:pointer;flex:1;min-width:240px;background:#fef1e3;border-left:4px solid var(--orange);border-radius:9px;padding:12px 16px"><div style="font-weight:700;color:var(--orange);font-size:13px">⏰ '+prox.length+' factura(s) vencen en ≤7 días</div><div style="font-size:12px;color:var(--navy2);margin-top:3px">'+money0(mP)+' por cobrar · clic para ver</div></div>';

      '<div class="dash-grid">'+chart+'<div class="dash-side">'+this.antiguedad(F)+this.topPedidos(F)+'</div></div>';
  },
  /* Antigüedad de la cartera: el gráfico que le faltaba a un producto cuyo
     problema no es facturar, sino cobrar. */
  antiguedad:function(F){
    var b={pv:0,d30:0,d60:0,d61:0};
    F.filter(esPorCobrar).forEach(function(f){
      var d=diasEntre(f.fVenc);
      if(d==null||d<=0)b.pv+=f.porCobrar;
      else if(d<=30)b.d30+=f.porCobrar;
      else if(d<=60)b.d60+=f.porCobrar;
      else b.d61+=f.porCobrar;
    });
    var tot=b.pv+b.d30+b.d60+b.d61;
    var seg=[['Por vencer',b.pv,'var(--blue)'],['1–30 d',b.d30,'var(--green)'],
             ['31–60 d',b.d60,'var(--orange)'],['+60 d',b.d61,'var(--red)']];
    var barra='',filas='';
    seg.forEach(function(s){
      var p=tot>0?(s[1]/tot*100):0;
      if(p>0)barra+='<i style="width:'+p.toFixed(2)+'%;background:'+s[2]+'"></i>';
      filas+='<div class="ag-row"><span class="ag-k"><i style="background:'+s[2]+'"></i>'+s[0]+'</span>'+
             '<b>'+money0(s[1])+'</b><span class="ag-p">'+(tot>0?Math.round(p)+'%':'—')+'</span></div>';
    });
    return '<div class="card"><div class="section-hdr">Antigüedad de la cartera'+
      '<span class="section-hdr-right">'+money0(tot)+' por cobrar</span></div>'+
      '<div class="section-body"><div class="ag-bar">'+
      (barra||'<i style="width:100%;background:var(--hair)"></i>')+'</div>'+filas+'</div></div>';
  },
  /* Dónde está concentrado el dinero por cobrar: a quién llamar primero. */
  topPedidos:function(F){
    var by={};
    F.filter(esPorCobrar).forEach(function(f){var k=f.pedido||'—';by[k]=(by[k]||0)+f.porCobrar;});
    var arr=Object.keys(by).map(function(k){return [k,by[k]];})
      .sort(function(a,b){return b[1]-a[1];}).slice(0,6);
    var max=arr.length?arr[0][1]:1;
    var filas=arr.map(function(o){
      return '<div class="tp-row"><span class="tp-k" title="'+o[0]+'">'+o[0]+'</span>'+
        '<span class="tp-bar"><i style="width:'+(o[1]/max*100).toFixed(1)+'%"></i></span>'+
        '<b>'+money0(o[1])+'</b></div>';
    }).join('')||'<div class="empty">Nada por cobrar.</div>';
    return '<div class="card" style="margin-top:20px"><div class="section-hdr">Concentración por cobrar'+
      '<span class="section-hdr-right">'+arr.length+' pedidos con saldo</span></div>'+
      '<div class="section-body">'+filas+'</div></div>';
  },
  tendencia:function(F){
    var yr=this.anio|| String(Math.max.apply(null,F.map(f=>f.anio).concat([0])));
    var G=F.filter(f=>String(f.anio)===String(yr));
    var m={};for(var i=1;i<=12;i++)m[i]={base:0,cob:0};
    G.forEach(f=>{if(f.mes>=1&&f.mes<=12){m[f.mes].base+=f.base;m[f.mes].cob+=cobradoDe(f);}});
    var max=Math.max(1,...Object.values(m).map(o=>Math.max(o.base,o.cob)));
    var cols='';for(var i=1;i<=12;i++){var o=m[i];var hB=Math.round(o.base/max*112),hC=Math.round(o.cob/max*112);
      cols+='<div class="bar-col"><div style="display:flex;gap:2px;align-items:flex-end;height:120px;width:100%;justify-content:center">'+
        '<div class="bar-seg" style="width:14px;background:var(--blue);height:'+hB+'px" title="Base '+money0(o.base)+'"></div>'+
        '<div class="bar-seg" style="width:14px;background:var(--green);height:'+hC+'px" title="Cobrado '+money0(o.cob)+'"></div>'+
        '</div><div class="bar-lbl">'+MESES[i]+'</div></div>';}
    return '<div class="card"><div class="section-hdr">Tendencia mensual '+yr+'<span class="section-hdr-right">base vs cobrado</span></div><div class="section-body">'+
      '<div class="bars">'+cols+'</div><div class="legend"><span><i style="background:var(--blue)"></i>Base facturada</span><span><i style="background:var(--green)"></i>Cobrado</span></div></div></div>';
  },
  facturas:function(F){
    var self=this;
    var filt=this.facFiltro||'todas';
    var porc=F.filter(esPorCobrar), cob=F.filter(esCobrada);
    var mPC=porc.reduce(function(a,f){return a+f.porCobrar;},0), mCob=F.reduce(function(a,f){return a+cobradoDe(f);},0);
    // filtro segmentado (incluye Análisis)
    function fb(v,txt){return '<button class="btn '+(filt===v?'g':'gr')+'" onclick="UI.setFacFiltro(\''+v+'\')">'+txt+'</button>';}
    var seg='<div class="toolbar" style="margin-bottom:12px">'+fb('todas','Todas ('+F.length+')')+fb('porcobrar','Por cobrar ('+porc.length+')')+fb('cobradas','Cobradas ('+cob.length+')')+fb('analisis','📊 Análisis')+
      '<span style="flex:1"></span>'+

/* ============ GENERADOR XLSX (JS puro, sin librerías, offline) ============ */
var Xlsx=(function(){
  var crcT=(function(){var t=[];for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
  function crc32(b){var c=0xFFFFFFFF;for(var i=0;i<b.length;i++)c=crcT[(c^b[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
  function bytes(s){return new TextEncoder().encode(s);}
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function col(n){var s='';n++;while(n>0){var m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26);}return s;}
  function sheetXml(headers,rows){
    var o='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
    var all=[headers].concat(rows);
    for(var r=0;r<all.length;r++){o+='<row r="'+(r+1)+'">';var row=all[r];
      for(var c=0;c<row.length;c++){var v=row[c];var ref=col(c)+(r+1);
        if(r>0&&typeof v==='number'&&isFinite(v))o+='<c r="'+ref+'"><v>'+v+'</v></c>';
        else o+='<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+esc(v)+'</t></is></c>';}
      o+='</row>';}
    return o+'</sheetData></worksheet>';
  }
  function zip(files){
    var chunks=[],central=[],off=0;
    function u16(n){return [n&255,(n>>8)&255];}function u32(n){return [n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];}
    files.forEach(function(f){
      var d=bytes(f.data),nm=bytes(f.name),crc=crc32(d);
      var loc=[].concat(u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(d.length),u32(d.length),u16(nm.length),u16(0));
      var h=new Uint8Array(loc.length+nm.length);h.set(loc,0);h.set(nm,loc.length);
      chunks.push(h,d);
      var cen=[].concat(u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(d.length),u32(d.length),u16(nm.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(off));
      var cb=new Uint8Array(cen.length+nm.length);cb.set(cen,0);cb.set(nm,cen.length);central.push(cb);
      off+=h.length+d.length;});
    var cs=central.reduce(function(a,c){return a+c.length;},0);
    var end=new Uint8Array([].concat(u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(cs),u32(off),u16(0)));
    var parts=chunks.concat(central,[end]);var tot=parts.reduce(function(a,p){return a+p.length;},0);
    var out=new Uint8Array(tot),pos=0;parts.forEach(function(p){out.set(p,pos);pos+=p.length;});return out;
  }
  function build(sheets){
    var f=[];
    f.push({name:'[Content_Types].xml',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+sheets.map(function(s,i){return '<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';}).join('')+'</Types>'});
    f.push({name:'_rels/.rels',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'});
    f.push({name:'xl/workbook.xml',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+sheets.map(function(s,i){return '<sheet name="'+esc(s.name)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>';}).join('')+'</sheets></workbook>'});
    f.push({name:'xl/_rels/workbook.xml.rels',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map(function(s,i){return '<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>';}).join('')+'</Relationships>'});
    sheets.forEach(function(s,i){f.push({name:'xl/worksheets/sheet'+(i+1)+'.xml',data:sheetXml(s.headers,s.rows)});});
    return zip(f);
  }
  return {build:build};
})();

/* ============ PROCESO: crear val, HES, facturar, pago ============ */
function pedNum(x){var s=String(x||'').trim();var p=s.indexOf('|');return p>0?s.slice(0,p).trim():s;}
function sid(s){return String(s==null?'':s).replace(/[^\w.\-]/g,'');}
function pedidosReales(){return (Store.data.pedidos||[]).filter(p=>/^\d+$/.test(pedNum(p.pedido)));}
function pedAvance(p){return p?(+p.avance||(p.monto>0?p.facturado/p.monto:0)):0;}
function pedCulminado(p){return !!(p&&(p.cerrado||pedAvance(p)>=0.9995));}
function hesSet(){var s={};Store.data.facturas.forEach(f=>(f.lineas||[]).forEach(l=>{var h=String(l.hes||'').trim();if(h)s[h]=f.factura;}));return s;}
function estadoVal(v,hs){var h=String(v.hes||'').trim();if(!h)return 'Pendiente HES';return (String(v.fact||'').trim()||hs[h])?'Facturada':'Por facturar';}
function pedidoPorNum(num){return Store.data.pedidos.find(p=>pedNum(p.pedido)===pedNum(num));}
/* anticipo: cuánto se ha amortizado y cuánto queda por amortizar en un pedido */
function anticipoAmortizado(ped){var n=pedNum(ped);return Math.round(Store.data.facturas.reduce(function(a,f){return a+(pedNum(f.pedido)===n?(+f.amortizado||0):0);},0)*100)/100;}
function saldoAnticipo(p){if(!p)return 0;return Math.round(((+p.anticipo||0)-anticipoAmortizado(p.pedido))*100)/100;}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2600);}
function saveFile(name,data,mime){
  if(window.showSaveFilePicker){
    var ext=name.slice(name.lastIndexOf('.'));var acc={};acc[mime]=[ext];
    return window.showSaveFilePicker({suggestedName:name,types:[{description:name,accept:acc}]})
      .then(h=>h.createWritable()).then(w=>w.write(data).then(()=>w.close()).then(()=>true))
      .catch(e=>{if(e&&e.name==='AbortError')return false;dl();return true;});
  }
  return Promise.resolve(dl());
  function dl(){var blob=new Blob([data],{type:mime});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();return true;}
}

var Proc={
  siguienteVal:function(pedido){var mx=0;Store.data.valuaciones.forEach(v=>{if(pedNum(v.pedido)===pedNum(pedido)){var m=String(v.val||'').toUpperCase().replace(/[^0-9]/g,'');if(m&&+m>mx)mx=+m;}});return 'V-'+(mx+1);},
  crearValuacion:function(pedido,valNum,fecha,items){
    if(!Auth.puedeValuar()){toast('Sin permiso para crear valuaciones');return 0;}
    var proy=pedidoPorNum(pedido);var pd=proy?proy.desc:'';
    var n=0;
    items.forEach(it=>{if(!it.estacion.trim())return;
      Store.data.valuaciones.push({fecha:fecha,estacion:it.estacion.trim(),pedido:pedNum(pedido),val:valNum,
        montoUSD:+it.montoUSD||0,hes:'',estado:'Pendiente HES',desc:(it.desc||pd),fechaHes:'',etapa:'2. Valuada sin HES',origen:'app'});
      n++;});

  },
  guardarHES:function(rows){
    if(!Auth.puedeEditar('hes'))return {err:'Sin permiso para asignar HES'};
    var hs=hesSet();var todos={};Store.data.valuaciones.forEach(v=>{var h=String(v.hes||'').trim();if(h)todos[h]=1;});
    var mala=null;rows.forEach(r=>{if(r.hes&&!/^[\w.\-]{1,30}$/.test(String(r.hes)))mala=r.hes;});
    if(mala)return {err:'HES inválida ('+esc(mala)+'): use solo letras, números, punto o guion.'};
    var dup=null;var vistos={};
    rows.forEach(r=>{if(r.hes){if(vistos[r.hes]||todos[r.hes])dup=r.hes;vistos[r.hes]=1;}});
    if(dup)return {err:'La HES '+esc(dup)+' ya existe o está repetida.'};
    var n=0;rows.forEach(r=>{if(r.hes){var v=Store.data.valuaciones[r.idx];v.hes=r.hes;if(r.fechaHes)v.fechaHes=r.fechaHes;if(r.desc)v.desc=r.desc;v.estado='3. Con HES';n++;}});
    Store.save();return {n:n};
  },
  facturar:function(pedido,idxs,facturaNum,fecha,tasa){
    if(!Auth.puedeEditar('fact'))return {err:'Sin permiso para facturar'};
    facturaNum=String(facturaNum||'').trim();
    if(!/^[\w.\-]{1,20}$/.test(facturaNum))return {err:'N° de factura inválido: use solo letras, números, punto o guion (máx. 20).'};
    if(fecha&&!/^\d{4}-\d{2}-\d{2}$/.test(fecha))return {err:'Fecha inválida.'};
    var ped=pedidoPorNum(pedido);if(!ped)return {err:'Pedido no encontrado.'};
    if(idxs.length===0)return {err:'No hay ítems seleccionados.'};
    if(idxs.length>13)return {err:'Máximo 13 HES por factura (límite de impresión).'};
    if(Store.data.facturas.some(f=>String(f.factura)===String(facturaNum)))return {err:'La factura '+esc(facturaNum)+' ya existe.'};
    var d=new Date(fecha+'T00:00:00');
    var venc=new Date(d.getTime()+ (ped.plazo||0)*86400000);
    var lineas=[],base=0,iva=0,total=0,islr=0,bi=0;
    idxs.forEach(i=>{var v=Store.data.valuaciones[i];var b=+v.montoUSD||0;var ii=Math.round(b*0.16*100)/100,is=Math.round(b*0.02*100)/100;
      base+=b;iva+=ii;total+=b+ii;islr+=is;bi+=b-is;
      lineas.push({hes:v.hes,desc:v.desc||ped.desc,base:Math.round(b*100)/100,estacion:v.estacion,val:v.val});});
    var r2=n=>Math.round(n*100)/100;
    var fobj={factura:String(facturaNum),fecha:fecha,anio:d.getFullYear(),mes:d.getMonth()+1,cliente:'Telefónica Venezolana C.A.',
      pedido:pedNum(pedido),descPedido:ped.desc,moneda:ped.moneda,tasa:+tasa||0,status:'Pendiente',
      fVenc:venc.toISOString().slice(0,10),fPago:'',base:r2(base),iva:r2(iva),total:r2(total),islr:r2(islr),baseIslr:r2(bi),
      pagos:0,porCobrar:r2(base),lineas:lineas,nHes:lineas.length,origen:'app'};
    Store.data.facturas.push(fobj);
    idxs.forEach(i=>{Store.data.valuaciones[i].estado='4. Facturada';});
    // actualizar pedido: facturado + / disponible -
    ped.facturado=r2((+ped.facturado||0)+base);ped.disponible=r2((+ped.disponible||0)-base);if(ped.monto>0)ped.avance=r2(ped.facturado/ped.monto);
    Store.save();return {ok:fobj};
  },
  registrarPago:function(facturaNum,fecha,monto,amort){
    if(!Auth.puedeEditar('facturas'))return {err:'Sin permiso para registrar pagos'};
    var f=Store.data.facturas.find(x=>String(x.factura)===String(facturaNum));if(!f)return {err:'Factura no encontrada.'};
    var r2=n=>Math.round(n*100)/100;
    var efe=+monto||0, am=+amort||0;
    if(efe<0||am<0)return {err:'Los montos no pueden ser negativos.'};
    if(am>0){var p=pedidoPorNum(f.pedido);var saldo=saldoAnticipo(p);
      if(am>saldo+0.01)return {err:'La amortización ('+money(am)+') supera el saldo de anticipo disponible ('+money(saldo)+') del pedido '+pedNum(f.pedido)+'.'};}
    f.pagos=r2((+f.pagos||0)+efe);
    f.amortizado=r2((+f.amortizado||0)+am);
    f.porCobrar=r2((+f.base||0)-f.pagos-f.amortizado);
    if(fecha)f.fPago=fecha;
    if(f.porCobrar<=0.01){f.status='Pagada';f.porCobrar=0;}
    Store.save();return {ok:f};
  },
  editarFechaPago:function(facturaNum,fecha){
    if(!Auth.puedeEditar('facturas'))return {err:'Sin permiso para editar la fecha de pago'};
    var f=Store.data.facturas.find(x=>String(x.factura)===String(facturaNum));if(!f)return {err:'Factura no encontrada.'};
    if(fecha&&!/^\d{4}-\d{2}-\d{2}$/.test(fecha))return {err:'Fecha inválida.'};
    f.fPago=fecha||'';Store.save();return {ok:f};
  },
  ajustarAmortizacion:function(facturaNum,amort){
    if(!Auth.puedeEditar('facturas'))return {err:'Sin permiso para ajustar amortización'};
    var f=Store.data.facturas.find(x=>String(x.factura)===String(facturaNum));if(!f)return {err:'Factura no encontrada.'};
    var p=pedidoPorNum(f.pedido);if(!p||!((+p.anticipo||0)>0))return {err:'El pedido de esta factura no tiene anticipo.'};
    var r2=function(n){return Math.round(n*100)/100;};
    var base=+f.base||0, am=+amort||0;
    if(am<0)return {err:'El monto no puede ser negativo.'};
    if(am>base+0.01)return {err:'La amortización no puede superar la base de la factura ('+money(base)+').'};
    var disp=r2(saldoAnticipo(p)+(+f.amortizado||0));
    if(am>disp+0.01)return {err:'La amortización ('+money(am)+') supera el anticipo disponible ('+money(disp)+').'};
    f.amortizado=r2(am);
    f.pagos=r2(base-am);
    f.porCobrar=r2(base-f.pagos-f.amortizado);
    if(f.porCobrar<=0.01){f.porCobrar=0;if(f.pagos+f.amortizado>=base-0.01)f.status='Pagada';}
    Store.save();return {ok:f};
  },
  normalizarBase:function(){
    /* cobranza referida al monto BASE (base-ISLR queda solo como referencia de banco) */
    var r2=function(n){return Math.round(n*100)/100;};var n=0;
    Store.data.facturas.forEach(function(f){
      var base=+f.base||0, am=+f.amortizado||0;
      if(f.status==='Pagada'){f.pagos=r2(base-am);f.porCobrar=0;}
      else{f.porCobrar=r2(base-(+f.pagos||0)-am);if(f.porCobrar<0)f.porCobrar=0;}
      n++;
    });
    return n;
  },
  eliminarFactura:function(fac){
    if(!Auth.puedeBorrar())return {err:'Solo el administrador puede eliminar facturas'};
    var i=Store.data.facturas.findIndex(x=>String(x.factura)===String(fac));if(i<0)return {err:'Factura no encontrada.'};
    var f=Store.data.facturas[i];var r2=n=>Math.round(n*100)/100;
    var ped=pedidoPorNum(f.pedido);
    if(ped){ped.facturado=r2((+ped.facturado||0)-f.base);ped.disponible=r2((+ped.disponible||0)+f.base);if(ped.monto>0)ped.avance=r2(ped.facturado/ped.monto);}
    var hesF={};(f.lineas||[]).forEach(l=>{var h=String(l.hes||'').trim();if(h)hesF[h]=1;});
    Store.data.valuaciones.forEach(v=>{var h=String(v.hes||'').trim();if(h&&hesF[h]){v.fact='';v.estado='3. Con HES';}});
    Store.data.facturas.splice(i,1);Store.save();return {ok:1};
  },
  editarValuacion:function(idx,c){
    if(!Auth.puedeValuar())return {err:'Sin permiso para editar valuaciones'};
    var v=Store.data.valuaciones[idx];if(!v)return {err:'No encontrada.'};
    if(c.estacion!==undefined)v.estacion=c.estacion.trim();
    if(c.montoUSD!==undefined)v.montoUSD=+c.montoUSD||0;
    if(c.desc!==undefined)v.desc=c.desc;
    if(c.val!==undefined)v.val=c.val.trim();
    if(c.hes!==undefined)v.hes=c.hes.trim();
    if(c.fechaHes!==undefined)v.fechaHes=c.fechaHes;
    Store.save();return {ok:1};
  },
  eliminarValuacion:function(idx){
    if(!Auth.puedeBorrar())return {err:'Solo el administrador puede borrar valuaciones'};
    var v=Store.data.valuaciones[idx];if(!v)return {err:'No encontrada.'};
    var hs=hesSet();var h=String(v.hes||'').trim();
    if(h&&(String(v.fact||'').trim()||hs[h]))return {err:'No se puede borrar: esta valuación ya está facturada. Elimine primero la factura '+(v.fact||hs[h])+'.'};
    Store.data.valuaciones.splice(idx,1);Store.save();return {ok:1};
  },
  crearPedido:function(o){
    if(!Auth.puedeEditar('pedidos'))return {err:'Sin permiso para crear pedidos'};
    if(!/^\d+$/.test(String(o.pedido)))return {err:'El N° de pedido debe ser numérico.'};
    if(Store.data.pedidos.some(p=>pedNum(p.pedido)===String(o.pedido)))return {err:'El pedido '+o.pedido+' ya existe.'};
    var r2=function(n){return Math.round((+n||0)*100)/100;};
    Store.data.pedidos.push({pedido:String(o.pedido),desc:o.desc||'',monto:r2(o.monto),moneda:o.moneda||'USD',plazo:+o.plazo||0,anticipo:r2(o.anticipo),amortPct:Math.max(0,Math.min(100,+o.amortPct||0)),facturado:0,disponible:r2(o.monto),avance:0,origen:'app'});
    Store.save();return {ok:1};
  },
  editarPedido:function(orig,c){
    if(!Auth.esAdmin())return {err:'Solo el administrador puede editar pedidos'};
    var p=pedidoPorNum(orig);if(!p)return {err:'Pedido no encontrado.'};
    var r2=function(n){return Math.round((+n||0)*100)/100;};
    // cambio de número (opcional): valida y actualiza referencias en valuaciones y facturas
    if(c.pedido!==undefined){
      var nuevo=String(c.pedido).trim();
      if(!/^\d+$/.test(nuevo))return {err:'El N° de pedido debe ser numérico.'};
      var old=pedNum(orig);
      if(pedNum(nuevo)!==old){
        if(Store.data.pedidos.some(x=>pedNum(x.pedido)===pedNum(nuevo)))return {err:'Ya existe un pedido '+nuevo+'.'};
        Store.data.facturas.forEach(function(f){if(pedNum(f.pedido)===old)f.pedido=pedNum(nuevo);});
        Store.data.valuaciones.forEach(function(v){if(pedNum(v.pedido)===old)v.pedido=pedNum(nuevo);});
        p.pedido=String(nuevo);
      }
    }
    if(c.desc!==undefined)p.desc=c.desc;
    if(c.moneda!==undefined)p.moneda=c.moneda;
    if(c.plazo!==undefined)p.plazo=+c.plazo||0;
    if(c.anticipo!==undefined)p.anticipo=r2(c.anticipo);
    if(c.amortPct!==undefined)p.amortPct=Math.max(0,Math.min(100,+c.amortPct||0));
    if(c.monto!==undefined){p.monto=r2(c.monto);p.disponible=r2(p.monto-(+p.facturado||0));p.avance=p.monto>0?r2((+p.facturado||0)/p.monto):0;}
    Store.save();return {ok:1};
  }
};

    // 33-35) TOTALES
    function totRow(lbl,val,bottom){var bb=bottom?';border-bottom:'+bT:'';

        '<td colspan="4" class="fx-r fx-b fx-big" style="border-left:'+bT+';border-right:'+bT+bb+'">'+lbl+'</td>'+
        '<td class="fx-r fx-b fx-big" style="border-right:'+bT+bb+'">'+val+'</td></tr>';}
    H.push(totRow('TOTAL NETO '+d.mon+' ..........',ve(d.neto,2),false));
    H.push(totRow('IVA 16% '+d.mon+' ..........',ve(d.iva,2),false));
    H.push(totRow('TOTAL '+d.mon+' ..........',ve(d.tot,2),true));
    // 36) espacio firmas + firmas
    H.push('<tr style="height:0.9cm"><td colspan="6" style="border-left:'+bM+';border-right:'+bM+'"></td></tr>');
    H.push('<tr style="height:0.5cm"><td colspan="3" class="fx-l" style="border-left:'+bM+';border-bottom:'+bM+';padding-left:1.5cm">COMPRADOR</td><td colspan="3" class="fx-r" style="border-right:'+bM+';border-bottom:'+bM+';padding-right:0.8cm">VENDEDOR</td></tr>');
    return '<table>'+col+H.join('')+'</table>';
  }
};

/* ---------- VISTA: MATRIZ DE VALUACIONES ---------- */
var Matriz={
  baseVal:function(v){return String(v||'').replace('*','').trim();},
  estadoNum:function(e){return e==='Facturada'?3:e==='Por facturar'?2:1;},
  render:function(){
    var hs=hesSet();var V=Store.data.valuaciones;
    var q=(document.getElementById('mxBuscar')?document.getElementById('mxBuscar').value:'').toLowerCase();
    // agregacion en una pasada
    var dE={},dV={},mState={},mTot={},sin=0,por=0,fac=0,uSin=0,uPor=0,uFac=0,uTot=0;
    V.forEach(v=>{
      var est=String(v.estacion||'').trim();if(!est)return;
      if(q && est.toLowerCase().indexOf(q)<0)return;
      var e=estadoVal(v,hs);var st=this.estadoNum(e);var mo=+v.montoUSD||0;
      var bv=this.baseVal(v.val);
      dE[est]=1;
      if(bv){ dV[bv]=bv; }
      uTot+=mo;
      if(st===3){fac++;uFac+=mo;}else if(st===2){por++;uPor+=mo;}else{sin++;uSin+=mo;}
      if(bv){var k=est+'|'+bv; if(st>(mState[k]||0))mState[k]=st;}
      mTot[est]=(mTot[est]||0)+mo;
    });
    var ests=Object.keys(dE).sort();
    var bases=Object.keys(dV).sort(function(a,b){var na=parseInt(String(a).replace(/[^0-9]/g,''))||0,nb=parseInt(String(b).replace(/[^0-9]/g,''))||0;return na-nb;});
    var kp='<div class="kpis">'+
      kpi('navy','Total ítems',(sin+por+fac),money0(uTot)+' USD')+
      kpi('red','Sin HES',sin,money0(uSin))+
      kpi('orange','Por facturar',por,money0(uPor))+
      kpi('green','Facturadas',fac,money0(uFac))+'</div>';
    // tabla matriz
    var head='<tr><th style="text-align:left">ESTACIÓN</th>'+bases.map(b=>'<th>'+dV[b]+'</th>').join('')+'<th>TOTAL USD</th></tr>';
    var body=ests.map(e=>{
      var tds=bases.map(b=>{var st=mState[e+'|'+b]||0;
        if(st===0)return '<td class="mcell m0">·</td>';
        var cls=st===3?'m3':st===2?'m2':'m1';
        return '<td class="mcell '+cls+'" style="cursor:pointer" title="Ver valuación" onclick="Matriz.verVal(\''+encodeURIComponent(e)+'\',\''+encodeURIComponent(b)+'\')">'+dV[b]+'</td>';}).join('');
      return '<tr><td class="est">'+e+'</td>'+tds+'<td class="num" style="font-weight:700">'+money(mTot[e]||0)+'</td></tr>';
    }).join('');
    var mtx='<div class="card"><div class="section-hdr">Matriz por estación<span class="section-hdr-right">'+ests.length+' estaciones · '+bases.length+' valuaciones</span></div><div class="section-body">'+
      '<div class="toolbar"><input id="mxBuscar" placeholder="Filtrar estación..." style="min-width:220px" oninput="Matriz.render()"></div>'+
      '<div class="mleg"><span><i style="background:var(--green)"></i>Facturada</span><span><i style="background:var(--orange)"></i>Con HES por facturar</span><span><i style="background:var(--red)"></i>Sin HES (esperando)</span></div>'+
      '<div style="overflow:auto;max-height:70vh"><table class="mtx">'+head+body+'</table></div></div></div>';
    // pendientes por facturar (no facturadas), ordenados por antiguedad
    var pend=V.map((v,i)=>({v:v,i:i,e:estadoVal(v,hs)})).filter(o=>o.e!=='Facturada'&&String(o.v.estacion||'').trim());
    pend.forEach(o=>o.d=diasEntre(o.v.fecha));
    pend.sort((a,b)=>(b.d||-1)-(a.d||-1));
    var prows=pend.map(o=>{var sit=o.e==='Por facturar'?'<span class="badge2 b2">Con HES - lista para facturar</span>':'<span class="badge2 b1">Esperando HES del cliente</span>';
      var dd=o.d==null?'—':(o.d>60?'<b style="color:var(--red)">'+o.d+'</b>':o.d);
      return '<tr><td>'+esc(o.v.estacion)+'</td><td class="center">'+o.v.val+'</td><td class="mono">'+pedNum(o.v.pedido)+'</td><td class="num">'+money(o.v.montoUSD)+'</td><td class="mono">'+(o.v.hes||'—')+'</td><td class="center">'+fdate(o.v.fecha)+'</td><td class="center">'+dd+'</td><td>'+sit+'</td></tr>';}).join('');
    var tpen='<div class="card"><div class="section-hdr">Pendientes por facturar<span class="section-hdr-right">ordenados por antigüedad · '+pend.length+' ítems</span></div><div class="section-body"><table id="tPen"><thead><tr>'+
      '<th>Estación</th><th class="center">Val</th><th>Pedido</th>'+th('Monto','tPen',3,1)+'<th>HES</th><th class="center">Fecha val</th>'+th('Días','tPen',6,1)+'<th>Situación</th></tr></thead><tbody>'+
      (prows||'<tr><td colspan="8" class="empty">No hay valuaciones pendientes por facturar. ¡Todo facturado!</td></tr>')+'</tbody></table></div></div>';
    document.getElementById('tab-matriz').innerHTML=kp+mtx+tpen;
    var mb=document.getElementById('mxBuscar');if(mb)mb.value=q;
  },
  verVal:function(estEnc,baseEnc){
    var est=decodeURIComponent(estEnc),base=decodeURIComponent(baseEnc);var hs=hesSet();
    var items=Store.data.valuaciones.filter(v=>String(v.estacion||'').trim()===est && this.baseVal(v.val)===base);
    if(!items.length)return;
    var cont=items.map(v=>{
      var e=estadoVal(v,hs);var bcl=e==='Facturada'?'b3':e==='Por facturar'?'b2':'b1';
      var facNum=String(v.fact||'').trim()||hs[String(v.hes||'').trim()]||'';
      var f=facNum?Store.data.facturas.find(x=>String(x.factura)===String(facNum)):null;
      var fbloc=f?('<div class="info-pedido" style="margin-top:8px"><span>Factura <b class="flink" onclick="UI.cerrarModal();UI.verFactura(\''+sid(f.factura)+'\')">'+f.factura+'</b></span><span>Estado <b>'+f.status+'</b></span><span>Fecha <b>'+fdate(f.fecha)+'</b></span><span>Vence <b>'+fdate(f.fVenc)+'</b></span>'+(f.fPago?'<span>Pago <b>'+fdate(f.fPago)+'</b></span>':'')+'<span>Saldo <b style="color:'+(f.porCobrar>0.01?'var(--red)':'var(--green)')+'">'+money(f.porCobrar)+'</b></span></div>'):(facNum?('<div class="hint">Factura '+facNum+' no está en el periodo activo cargado.</div>'):'');
      return '<div style="border:1px solid var(--bd);border-radius:9px;padding:12px 14px;margin-bottom:10px">'+
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><b style="font-size:13px">'+v.val+' · '+est+'</b><span class="badge2 '+bcl+'">'+e+'</span></div>'+
        '<div class="info-pedido" style="margin:0"><span>Pedido <b>'+pedNum(v.pedido)+'</b></span><span>Monto <b>'+money(v.montoUSD)+'</b></span><span>Fecha val <b>'+fdate(v.fecha)+'</b></span><span>HES <b>'+(v.hes||'—')+'</b></span>'+(v.fechaHes?'<span>Fecha HES <b>'+fdate(v.fechaHes)+'</b></span>':'')+'</div>'+
        (v.desc?'<div class="hint" style="margin-top:6px">'+esc(v.desc)+'</div>':'')+fbloc+'</div>';
    }).join('');
    document.getElementById('modalTit').textContent='Valuación '+base+' · '+est;
    document.getElementById('modalBody').innerHTML=cont+'<div class="frow" style="margin-top:4px"><button class="btn gr" onclick="UI.cerrarModal()">Cerrar</button></div>';
    document.getElementById('modalBg').classList.add('on');
  }
};

      .then(function(rows){ rows=rows||[]; var AL={cierre_proyecto:'Cierre de proyecto',facturar:'Facturación',pago:'Registro de pago',eliminar_factura:'Eliminar factura',eliminar_valuacion:'Eliminar valuación'};

<script>
/* ===== Caleva Suite · Indicadores de Seguimiento (Fase 4) ===== */
(function(){ 'use strict';
  if(typeof Store==='undefined'||typeof Auth==='undefined')return;
  function u(n){ return 'USD '+Number(n||0).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function pend(e){ return /Vencida|cobrar|Facturada|Generada|HES/i.test(e||'') && !/Cobrada/i.test(e||''); }
  function build(){
    var F=(Store.data&&Store.data.facturas)||[], P=(Store.data&&Store.data.pedidos)||[], V=(Store.data&&Store.data.valuaciones)||[];
    var m=function(n){ try{ if(typeof money==='function')return money(n);}catch(e){} return u(n); };
    function esPC(f){ try{ if(typeof esPorCobrar==='function')return esPorCobrar(f);}catch(e){} var s=(f.status||'').toLowerCase(); return s!=='pagada'&&s!=='anulada'&&(+f.porCobrar||0)>0.01; }
    var now=Date.now(), base=0,cob=0,amort=0,pc=0,venc=0, bk={vig:0,d30:0,d60:0,d90:0,mas:0};
    F.forEach(function(f){ base+=(+f.base||0); cob+=cobradoDe(f); amort+=(+f.amortizado||0);
      if(esPC(f)){ var pcf=(+f.porCobrar||0); pc+=pcf; var mora=(f._mora!=null)?f._mora:(f.fVenc?Math.floor((now-Date.parse(f.fVenc))/86400000):0); if(mora>0)venc+=pcf;
        var k=mora<=0?'vig':mora<=30?'d30':mora<=60?'d60':mora<=90?'d90':'mas'; bk[k]+=pcf; } });
    var kpi=function(v,l){return '<div class="ikpi"><div class="v">'+v+'</div><div class="l">'+l+'</div></div>';};
    var head=kpi(m(base),'Facturado (base)')+kpi(m(cob),'Cobrado')+kpi(m(pc),'Por cobrar')+kpi(m(venc),'Vencido')+kpi(m(amort),'Del cual, amortizado')+kpi((base?Math.round(cob/base*100):0)+'%','% cobrado');
    function ar(l,v,red){return '<div class="irow"><span class="il"'+(red?' style="color:#C0201E"':'')+'>'+l+'</span><b'+(red?' style="color:#C0201E"':'')+'>'+m(v)+'</b></div>';}
    var aging=ar('Vigente (al día)',bk.vig)+ar('1–30 días',bk.d30)+ar('31–60 días',bk.d60)+ar('61–90 días',bk.d90)+ar('90+ días',bk.mas,true);
    var facByNum={}, hesToFac={}; F.forEach(function(f){ if(f.factura!=null)facByNum[String(f.factura)]=f; (f.lineas||[]).forEach(function(ln){ if(ln.hes!=null&&String(ln.hes)!=='')hesToFac[String(ln.hes)]=f; }); });
    function facOf(v){ if(v.fact&&facByNum[String(v.fact)])return facByNum[String(v.fact)]; if(v.hes&&hesToFac[String(v.hes)])return hesToFac[String(v.hes)]; return null; }
    function derivEtapa(v){ var f=facOf(v); if(!f)return '1. Generada (sin HES)'; if((f.status||'').toLowerCase()==='pagada'||(+f.porCobrar||0)<=0.01)return '4. Cobrada'; var mo=(f._mora!=null)?f._mora:(f.fVenc?Math.floor((now-Date.parse(f.fVenc))/86400000):0); return mo>0?'3. Vencida (por cobrar)':'2. Facturada (por cobrar)'; }
    var ORD={'1. Generada (sin HES)':1,'2. Facturada (por cobrar)':2,'3. Vencida (por cobrar)':3,'4. Cobrada':4};
    var etapas={}; V.forEach(function(v){ var e=derivEtapa(v); if(!etapas[e])etapas[e]={n:0,mo:0}; etapas[e].n++; etapas[e].mo+=(+v.montoUSD||0); });
    var pipe=Object.keys(etapas).sort(function(a,b){return (ORD[a]||9)-(ORD[b]||9);}).map(function(e){ var x=etapas[e]; var col=/Cobrada/i.test(e)?'#1d7c59':(/Vencida/i.test(e)?'#C0201E':(/Facturada/i.test(e)?'#ea860c':'#1E5AA8'));
      return '<div class="irow"><span class="idot" style="background:'+col+'"></span><span class="il">'+esc(e)+'</span><span class="in">'+x.n+'</span><b>'+m(x.mo)+'</b></div>'; }).join('');
    var byPed={}; F.forEach(function(f){ var pd=String(f.pedido||'—'); if(!byPed[pd])byPed[pd]={cob:0,pc:0}; byPed[pd].cob+=cobradoDe(f); if(esPC(f))byPed[pd].pc+=(+f.porCobrar||0); });
    var pk=Object.keys(byPed).sort(); var pedRows=pk.map(function(pd){ var x=byPed[pd]; var pm=P.filter(function(pp){return String(pp.pedido)===pd;})[0]||{}; var ant=(+pm.anticipo||0);
      var av=(pm.avance!=null)?Math.round(pm.avance*100)+'%':((+pm.monto>0)?Math.round(((+pm.facturado||0)/pm.monto)*100)+'%':'—');
      return '<tr><td>'+esc(pd)+'</td><td style="text-align:right">'+m(+pm.monto||0)+'</td><td style="text-align:right">'+m(+pm.facturado||0)+'</td><td style="text-align:right">'+m(x.cob)+'</td><td style="text-align:right'+(x.pc>0.01?';color:#C0201E':'')+'">'+m(x.pc)+'</td><td style="text-align:right">'+(ant>0?m(ant):'—')+'</td><td style="text-align:center">'+av+'</td></tr>'; }).join('')||'<tr><td colspan=7 style="color:#5B6B7A;padding:10px">Sin datos.</td></tr>';
    function itbl(list,extra){ return '<table class="itbl"><thead><tr><th>Val</th><th>Pedido</th><th>Estación</th><th>HES</th><th>Fecha</th><th style="text-align:right">Monto</th>'+(extra?'<th>Factura</th>':'')+'</tr></thead><tbody>'+list.map(function(v){ var f=extra?hesToFac[String(v.hes)]:null; return '<tr><td>'+esc(v.val||'')+'</td><td>'+esc(v.pedido||'')+'</td><td>'+esc(v.estacion||'')+'</td><td>'+esc(v.hes||'')+'</td><td>'+esc(v.fecha||'')+'</td><td style="text-align:right">'+m(+v.montoUSD||0)+'</td>'+(extra?'<td><b>'+esc(f?f.factura:'')+'</b></td>':'')+'</tr>';}).join('')+'</tbody></table>'; }
    var sinFactRaw=V.filter(function(v){ return v.hes && !v.fact; });
    var paraDepurar=sinFactRaw.filter(function(v){ return !!hesToFac[String(v.hes)]; });
    var sinFactReal=sinFactRaw.filter(function(v){ return !hesToFac[String(v.hes)]; });
    var depurCard = paraDepurar.length? ('<div class="icard" style="border-color:#C0201E;background:#FBEBEA;margin-bottom:14px"><div class="ihd" style="color:#A5231A;display:flex;align-items:center;gap:10px">Facturadas pero sin nº de factura en la valuación ('+paraDepurar.length+') <button onclick="window.__segDepurarHES()" style="margin-left:auto;background:#C0201E;color:#fff;border:0;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer">Depurar: vincular por HES y guardar</button></div>'+itbl(paraDepurar,true)+'</div>') : '';
    var revCard = sinFactReal.length? ('<div class="icard" style="border-color:#ea860c;background:#fef5ea;margin-bottom:14px"><div class="ihd" style="color:#a05c08">Valuaciones con HES realmente sin factura ('+sinFactReal.length+')</div>'+itbl(sinFactReal,false)+'</div>') : '';
    return depurCard+revCard+'<div class="ikpis">'+head+'</div>'
      +'<div class="icols"><div class="icard"><div class="ihd">Aging por cobrar (por mora)</div>'+aging+'</div>'
      +'<div class="icard"><div class="ihd">Valuaciones por etapa (operativo)</div>'+pipe+'</div></div>'
      +'<div class="icard"><div class="ihd">Por pedido (facturas)</div><table class="itbl"><thead><tr><th>Pedido</th><th style="text-align:right">Monto</th><th style="text-align:right">Facturado</th><th style="text-align:right">Cobrado</th><th style="text-align:right">Por cobrar</th><th style="text-align:right">Anticipo</th><th style="text-align:center">Avance</th></tr></thead><tbody>'+pedRows+'</tbody></table></div>'
      +'<p style="font-size:11px;color:#5B6B7A;margin-top:8px">Cifras financieras calculadas desde las facturas (base; cobrado = pagos + amortizado; por cobrar = base − pagos − amortización de anticipo), igual que el Resumen por pedido. El pipeline por etapa es una vista operativa de las valuaciones (montoUSD).</p>';
  }
  window.__segDepurarHES=function(){
    var F=(Store.data&&Store.data.facturas)||[], V=(Store.data&&Store.data.valuaciones)||[];
    var h2f={}; F.forEach(function(f){ (f.lineas||[]).forEach(function(ln){ if(ln.hes!=null&&String(ln.hes)!=='')h2f[String(ln.hes)]=f; }); });
    var n=0; V.forEach(function(v){ if(v.hes && !v.fact){ var f=h2f[String(v.hes)]; if(f){ v.fact=f.factura; n++; } } });
    if(!n){ alert('No hay valuaciones facturadas pendientes de vincular.'); return; }
    if(!confirm('Se vincularán '+n+' valuaciones a su factura (por HES) y se guardará en la nube. ¿Continuar?'))return;
    try{ if(typeof Store!=='undefined'&&typeof Store.save==='function')Store.save(); }catch(e){}
    alert(n+' valuaciones vinculadas a su factura y guardadas.');
    try{ document.getElementById('segIndBody').innerHTML=build(); }catch(e){}
  };
  function open(){ var ov=document.getElementById('segIndOv'); if(!ov){ ov=document.createElement('div'); ov.id='segIndOv'; ov.style.cssText='position:fixed;inset:0;background:rgba(12,24,36,.5);z-index:600;display:flex;align-items:flex-start;justify-content:center;padding:26px;overflow:auto';
      ov.innerHTML='<div style="background:#fff;max-width:1000px;width:100%;border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)"><div style="display:flex;align-items:center;gap:10px;padding:14px 18px;background:linear-gradient(120deg,#001E3D,#002E5B);color:#fff"><b style="flex:1;font-size:15px">Indicadores · Seguimiento</b><button id="segIndX" style="background:rgba(255,255,255,.15);border:0;color:#fff;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px">×</button></div><div id="segIndBody" style="padding:16px 18px;max-height:76vh;overflow:auto"></div></div>';

<script>
/* ===== Caleva Suite · AUDITORÍA UNIVERSAL — registra TODO cambio (Seguimiento) =====
   Compara el estado anterior con el nuevo en cada guardado y registra el diff
   (campo, antes -> despues) en el log append-only + hash (app_audit). ===== */
(function(){ 'use strict';
  if(typeof Store==='undefined'||typeof Store.save!=='function')return;
  function clone(o){ try{return JSON.parse(JSON.stringify(o));}catch(e){return null;} }
  function A(action,entity,before,after){ try{ fetch(Store.rest()+'rpc/app_audit_write',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},Store.headers()),body:JSON.stringify({p_app:'seguimiento',p_action:action,p_entity:entity||null,p_entity_id:null,p_before:before||null,p_after:after||{}})}); }catch(e){} }
  var KF=['id','factura','pedido','no','cedula','hes','val','code','codigo','nombre'];
  function keyOf(o){ if(o&&typeof o==='object'&&!Array.isArray(o)){ for(var i=0;i<KF.length;i++){ var v=o[KF[i]]; if(v!=null&&v!=='')return KF[i]+'='+v; } } return null; }
  function sh(v){ if(v==null)return ''; if(typeof v==='object')return JSON.stringify(v).slice(0,140); return String(v).slice(0,140); }
  function shF(v){ try{ if(v!=null&&typeof v==='object'){ var s=JSON.stringify(v); return (s.length>4000)?(s.slice(0,4000)+'…'):JSON.parse(s); } return v; }catch(e){ return sh(v); } }
  function diff(a,b,p,out){ if(out.length>=120)return; if(a===b)return;
    if(Array.isArray(a)||Array.isArray(b)){ a=a||[]; b=b||[];
      var keyed=(a[0]&&keyOf(a[0]))||(b[0]&&keyOf(b[0]));
      if(keyed){ var am={},bm={}; a.forEach(function(x){var k=keyOf(x);if(k)am[k]=x;}); b.forEach(function(x){var k=keyOf(x);if(k)bm[k]=x;});
        Object.keys(bm).forEach(function(k){ if(!(k in am))out.push({p:p+'['+k+']',op:'+',b:sh(bm[k]),fb:shF(bm[k])}); else diff(am[k],bm[k],p+'['+k+']',out); });
        Object.keys(am).forEach(function(k){ if(!(k in bm))out.push({p:p+'['+k+']',op:'-',a:sh(am[k]),fa:shF(am[k])}); });
      } else { var n=Math.max(a.length,b.length); for(var i=0;i<n&&out.length<120;i++)diff(a[i],b[i],p+'['+i+']',out); }
    } else if(a&&b&&typeof a==='object'&&typeof b==='object'){ var ks={}; Object.keys(a).forEach(function(k){ks[k]=1;}); Object.keys(b).forEach(function(k){ks[k]=1;}); Object.keys(ks).forEach(function(k){ if(k.charAt(0)==='_')return; /* transitorios: _m, _mora... los recalcula la fecha, no el usuario */ if(out.length<120)diff(a[k],b[k],p?p+'.'+k:k,out); }); }
    else { if(JSON.stringify(a)!==JSON.stringify(b))out.push({p:p,op:'~',a:sh(a),b:sh(b),fa:shF(a),fb:shF(b)}); }
  }
  function label(ch){ var p=ch.map(function(c){return c.p;}).join(' ');
    if(ch.some(function(c){return /^facturas\[/.test(c.p)&&c.op==='+';}))return 'Factura generada';
    if(ch.some(function(c){return /^facturas\[/.test(c.p)&&c.op==='-';}))return 'Factura eliminada';
    if(/facturas\[[^\]]*\]\.(pagos|porCobrar|fPago|status|islr)/.test(p))return 'Pago / cobranza';
    if(/valuaciones\[[^\]]*\]\.hes/.test(p))return 'HES asignada';
    if(/valuaciones\[[^\]]*\]\.fact/.test(p))return 'Vinculacion factura-valuacion';
    if(ch.some(function(c){return /^valuaciones\[/.test(c.p)&&c.op==='+';}))return 'Valuacion agregada';
    if(ch.some(function(c){return /^valuaciones\[/.test(c.p)&&c.op==='-';}))return 'Valuacion eliminada';
    if(/^pedidos/.test(p))return 'Cambio en pedidos';
    if(ch.length>60)return 'Sincronizacion / recalculo';
    return 'Cambio'; }
  var prev=null, ready=false;
  function snap(){ prev=clone(Store.data); ready=!!prev; }
  var iv=setInterval(function(){ if(Store.data&&(Store.data.facturas||Store.data.valuaciones||Store.data.pedidos)){ snap(); clearInterval(iv); } },600);
  var _s=Store.save;
  Store.save=function(){ try{
      if(!ready){ snap(); }
      else { var out=[]; diff(prev,Store.data,'',out); if(out.length){ var bef={},aft={}; out.forEach(function(c){ if('fa' in c)bef[c.p]=c.fa; if('fb' in c)aft[c.p]=c.fb; }); var disp=out.slice(0,120).map(function(c){return {p:c.p,op:c.op,a:c.a,b:c.b};}); A(label(out),(out[0]&&String(out[0].p).split(/[.[]/)[0])||'',{values:bef},{n:out.length,changes:disp,values:aft}); prev=clone(Store.data); } }
    }catch(e){} return _s.apply(this,arguments); };
})();
</script>
