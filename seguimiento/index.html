  function match(rec, used){ var cand=pending().filter(function(o){ return String((typeof pedNum==='function'?pedNum(o.v.pedido):o.v.pedido))===String(rec.pedido) && !used[o.i]; });
    if(!cand.length)return null; var best=null,bs=-1; cand.forEach(function(o){ var pp=(typeof pedidoPorNum==='function')?pedidoPorNum(o.v.pedido):null; var s=sim(rec.desc,(o.v.desc||'')+' '+(o.v.estacion||'')+' '+(pp&&pp.desc||'')); if(s>bs){bs=s;best=o;} }); return {o:best,score:bs}; }
  function toDate(f){ if(!f)return today(); f=String(f); if(/^\d{4}-\d{2}-\d{2}/.test(f))return f.slice(0,10); var m=/(\d{2})[\/\-](\d{2})[\/\-](\d{4})/.exec(f); if(m)return m[3]+'-'+m[2]+'-'+m[1]; var d=new Date(f); if(!isNaN(d)){ var z=function(n){return (n<10?'0':'')+n;}; return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); } return today(); }
  var _hesRes=[];
  function existingHesSet(){ var s={}; try{ (Store.data.facturas||[]).forEach(function(f){ (f.lineas||[]).forEach(function(l){ var hh=String(l.hes||'').trim(); if(hh)s[hh]=(f.factura||true); }); }); (Store.data.valuaciones||[]).forEach(function(v){ var hh=String(v.hes||'').trim(); if(hh&&!s[hh])s[hh]=true; }); }catch(e){} return s; }
  function analyze(recs){ var used={}, exist=existingHesSet(), res=[];
    recs.forEach(function(r){ var dup=!!exist[String(r.hes).trim()]; var mt=dup?null:match(r,used); var o=mt&&mt.o; if(o)used[o.i]=1;
      res.push({rec:r, idx:o?o.i:null, est:o?o.v.estacion:'', val:o?o.v.val:'', score:mt?mt.score:-1, dup:dup, ref:dup?exist[String(r.hes).trim()]:null}); });
    return res; }
  function applySelected(){ var res=_hesRes||[], chosen={}; Array.prototype.forEach.call(document.querySelectorAll('.hesChk'),function(cb){ if(cb.checked)chosen[cb.getAttribute('data-i')]=1; });
    var selPed=document.getElementById('hesPed'); if(selPed)selPed.value=''; if(typeof Hes!=='undefined'&&Hes.render)Hes.render();
    var n=0; res.forEach(function(x,i){ if(!chosen[i]||x.idx==null||x.dup)return; var tr=document.querySelector('#tab-hes tr[data-idx="'+x.idx+'"]'); if(!tr)return; var hh=tr.querySelector('.hHes'),f=tr.querySelector('.hFecha'),d=tr.querySelector('.hDesc'); if(hh)hh.value=x.rec.hes; if(f)f.value=toDate(x.rec.fecha); if(d&&x.rec.desc)d.value=x.rec.desc; tr.style.background='#e6fbf3'; n++; });
    var out=document.getElementById('hesSyncOut'); if(out){ var nt=document.createElement('div'); nt.style.cssText='margin-top:8px;font-size:12px;color:#0a8f5b;font-weight:700'; nt.textContent=n+' HES aplicadas a la tabla. Revisa y pulsa Guardar HES.'; out.appendChild(nt); } }
  function renderResults(res){ _hesRes=res; var out=document.getElementById('hesSyncOut'); if(!out)return;
    var nApp=res.filter(function(x){return x.idx!=null&&!x.dup;}).length, nDup=res.filter(function(x){return x.dup;}).length;
    var rows=res.map(function(x,i){ var estado, chk='';
      if(x.dup) estado='<span style="color:#a86f00">ya registrada'+(typeof x.ref==='string'?(' (fact '+esc(x.ref)+')'):'')+'</span>';
      else if(x.idx!=null){ var conf=x.score>=0.5?'alta':(x.score>0?'media':'baja'); estado='✓ '+esc(x.est||'')+' / '+esc(x.val||'')+' <span style="color:#7688ac">('+conf+')</span>'; chk='<input type="checkbox" class="hesChk" data-i="'+i+'"'+(x.score>0?' checked':'')+'>'; }
      else estado='<span style="color:#e11d48">sin coincidencia</span>';
      return '<tr><td style="text-align:center">'+chk+'</td><td>'+esc(x.rec.hes)+'</td><td>'+esc(x.rec.pedido)+'</td><td style="font-size:11px">'+esc(x.rec.desc)+'</td><td>'+estado+'</td></tr>'; }).join('');
    out.innerHTML='<div style="font-size:12.5px;color:#10171E;font-weight:700;margin-bottom:6px">'+res.length+' HES leidas · '+nApp+' aplicables · '+nDup+' ya registradas</div>'
      +'<table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr style="color:#41527a;text-align:left"><th style="padding:5px 7px;text-align:center"><input type="checkbox" id="hesChkAll" checked></th><th>HES</th><th>Pedido</th><th>Descripcion</th><th>Valuacion / estado</th></tr></thead><tbody>'+rows+'</tbody></table>'
      +'<div style="margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button id="hesApplySel" style="background:#0a8f5b;color:#fff;border:0;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer">Aplicar seleccionadas a la tabla</button><span style="font-size:11px;color:#6b7794">Marca cuales asignar; luego revisa la tabla y pulsa Guardar HES.</span></div>';
    var all=document.getElementById('hesChkAll'); if(all)all.onchange=function(){ var c=this.checked; Array.prototype.forEach.call(document.querySelectorAll('.hesChk'),function(cb){cb.checked=c;}); };
    var ap=document.getElementById('hesApplySel'); if(ap)ap.onclick=applySelected; }
    function fetchFromGmail(){ var out=document.getElementById('hesSyncOut'); var days=parseInt((document.getElementById('hesGmDays')||{}).value,10)||2; if(days<1)days=1; if(days>60)days=60;
    var btn=document.getElementById('hesGmGo'); var ot=btn.textContent; btn.disabled=true; btn.textContent='Consultando…'; out.innerHTML='<div style="font-size:12.5px;color:#516089">Consultando Gmail (últimos '+days+' días)…</div>';
    var url=SB.url.replace(/\/+$/,'')+'/functions/v1/hes-imap';
    var ctrl=(typeof AbortController!=='undefined')?new AbortController():null; var toId=setTimeout(function(){ if(ctrl)ctrl.abort(); },45000);
    fetch(url,{method:'POST',headers:{'apikey':SB.key,'Authorization':'Bearer '+((typeof Auth!=='undefined'&&Auth.token())||SB.key),'Content-Type':'application/json'},body:JSON.stringify({days:days}),signal:ctrl?ctrl.signal:undefined})
      .then(function(r){ clearTimeout(toId); return r.text().then(function(t){var d=null;try{d=t?JSON.parse(t):null;}catch(e){} if(!r.ok)throw Error((d&&d.error)||('HTTP '+r.status)); return d;});})
      .then(function(d){ var msgs=(d&&d.messages)||[]; if(!msgs.length){ out.innerHTML='<div style="font-size:12.5px;color:#516089">No se encontraron correos de HES del remitente en los últimos '+days+' días.</div>'; return; }
        var recs=[],full=''; msgs.forEach(function(mm){ var t=mm.text||''; full+=t+'\n\n'; var rs=parseEmails(t); rs.forEach(function(rec){ if(mm.date)rec.fecha=mm.date; }); recs=recs.concat(rs); });
        var ta=document.getElementById('hesSyncTxt'); if(ta)ta.value=full;
        renderResults(analyze(recs)); })
      .catch(function(e){ clearTimeout(toId); var m=e&&(e.name==='AbortError')?'La consulta tardó demasiado.':((e&&e.message)||''); if(/404|not found|failed to fetch/i.test(m))m='Falta desplegar la Edge Function hes-imap o configurar IMAP_USER/IMAP_PASS en Supabase.'; out.innerHTML='<div style="color:#e11d48;font-size:12.5px">Error: '+esc(m)+'</div>'; })
      .then(function(){ clearTimeout(toId); btn.disabled=false; btn.textContent=ot; }); }
  function openSync(){ var ov=document.getElementById('hesSyncOv'); if(!ov){ ov=document.createElement('div'); ov.id='hesSyncOv'; ov.style.cssText='position:fixed;inset:0;background:rgba(0,30,61,.5);z-index:600;display:flex;align-items:flex-start;justify-content:center;padding:26px;overflow:auto';
      ov.innerHTML='<div role="dialog" aria-label="Sincronizar HES por correo" style="background:#fff;max-width:820px;width:100%;border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)"><div style="display:flex;align-items:center;gap:10px;padding:14px 18px;background:linear-gradient(120deg,#001E3D,#002E5B);color:#fff"><b style="flex:1;font-size:15px">Sincronizar HES desde correo</b><button id="hesSyncX" aria-label="Cerrar" style="background:rgba(255,255,255,.15);border:0;color:#fff;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px">×</button></div><div style="padding:16px 18px">'
        +'<div style="border:1px solid #e6ecf7;border-radius:10px;padding:12px;margin-bottom:12px"><div style="font-weight:700;color:#10171E;font-size:13px;margin-bottom:8px">Traer del correo de respaldo (Gmail)</div><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><label style="font-size:12.5px;color:#516089">Revisar los últimos <input id="hesGmDays" type="number" min="1" max="30" value="2" style="width:64px;border:1px solid #d5deee;border-radius:8px;padding:7px 8px;font-size:13px;margin:0 4px"> días</label><span style="flex:1"></span><button id="hesGmGo" style="background:#1E5AA8;color:#fff;border:0;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer">Traer y cruzar</button></div><div style="font-size:10.5px;color:#6b7794;margin-top:6px">Lee la bandeja de Gmail (IMAP) los correos de no_reply@telefonica.com.ve de los últimos días. La cuenta de respaldo se configura una sola vez en el servidor; aquí no se pide contraseña.</div></div>'
        +'<div style="text-align:center;color:#94a3b8;font-size:11px;margin:4px 0 8px">— o pega el/los correos manualmente —</div>'
        +'<textarea id="hesSyncTxt" placeholder="Pega el/los correos aquí…" style="width:100%;height:130px;border:1px solid #d5deee;border-radius:9px;padding:10px;font-size:12.5px;font-family:inherit;box-sizing:border-box"></textarea><div style="display:flex;gap:10px;margin-top:10px"><button id="hesSyncGo" style="background:#64748b;color:#fff;border:0;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer">Procesar texto pegado</button></div><div id="hesSyncOut" style="margin-top:12px"></div></div></div>';
      document.body.appendChild(ov); ov.addEventListener('click',function(e){if(e.target===ov)ov.remove();}); document.getElementById('hesSyncX').onclick=function(){ov.remove();};
      var _gg=document.getElementById('hesGmGo'); if(_gg)_gg.onclick=fetchFromGmail;
      document.getElementById('hesSyncGo').onclick=function(){ var txt=(document.getElementById('hesSyncTxt')||{}).value||''; var recs=parseEmails(txt); var out=document.getElementById('hesSyncOut'); if(!recs.length){ out.innerHTML='<div style="color:#e11d48;font-size:12.5px">No se detectó ningún HES en el texto.</div>'; return; } renderResults(analyze(recs)); };
    }
    var t=document.getElementById('hesSyncTxt'); if(t)t.value=''; var o=document.getElementById('hesSyncOut'); if(o)o.innerHTML=''; }
  window.__hesSyncOpen=openSync;
  function injectBtn(){ var tab=document.getElementById('tab-hes'); if(!tab)return; var tb=tab.querySelector('.toolbar'); if(!tb||tb.querySelector('.hesSyncBtn'))return; var b=document.createElement('button'); b.className='btn gr hesSyncBtn'; b.type='button'; b.innerHTML='✉ Sincronizar HES por correo'; b.onclick=openSync; tb.insertBefore(b, tb.firstChild); }
  var tries=0; var iv=setInterval(function(){ tries++; if(tries>90){clearInterval(iv);} var tab=document.getElementById('tab-hes'); if(tab){ injectBtn(); if(!tab.__hesObs){ tab.__hesObs=new MutationObserver(function(){ injectBtn(); }); tab.__hesObs.observe(tab,{childList:true,subtree:true}); } } },1200);
})();

<script>
/* ===== Caleva Suite · Reporte de facturación mensual (impuesto municipal) ===== */
(function(){ 'use strict';
  if(typeof Store==='undefined')return;
  var MES=['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function m(n){ try{ if(typeof money==='function')return money(n); }catch(e){} return 'USD '+Number(n||0).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function years(){ var F=(Store.data&&Store.data.facturas)||[],ys={}; F.forEach(function(f){ var y=+f.anio||(f.fecha?+String(f.fecha).slice(0,4):0); if(y)ys[y]=1; }); return Object.keys(ys).sort().reverse(); }
  function group(yearFilter){ var F=(Store.data&&Store.data.facturas)||[],g={};
    F.forEach(function(f){ if((f.status||'').toLowerCase()==='anulada')return;
      var y=+f.anio||(f.fecha?+String(f.fecha).slice(0,4):0), mo=+f.mes||(f.fecha?+String(f.fecha).slice(5,7):0); if(!y||!mo)return;
      if(yearFilter&&String(y)!==String(yearFilter))return;
      var k=y+'-'+(mo<10?'0':'')+mo; if(!g[k])g[k]={y:y,mo:mo,items:[]}; g[k].items.push(f); });
    return Object.keys(g).sort().map(function(k){ var o=g[k]; o.items.sort(function(a,b){ return String(a.fecha||'').localeCompare(String(b.fecha||''))||String(a.factura||'').localeCompare(String(b.factura||'')); }); o.tot={n:o.items.length,base:0,iva:0,total:0,cob:0,bs:0,sinTasa:0}; o.items.forEach(function(f){ o.tot.base+=+f.base||0; o.tot.iva+=+f.iva||0; o.tot.total+=+f.total||0; o.tot.cob+=+f.pagos||0; var t=+f.tasa||0; if(t>0)o.tot.bs+=(+f.base||0)*t; else o.tot.sinTasa++; }); return o; }); }
  function headRow(al){ var TH=function(t,a,w){ return '<th style="background:#002E5B;color:#fff;padding:6px 8px;border:1px solid #2c3f70;font-weight:bold'+(a?';text-align:'+a:'')+(w?';width:'+w+'px':'')+'">'+t+'</th>'; }; return '<tr>'+TH('N° Factura','left',76)+TH('Fecha','left',96)+TH('Pedido','left',108)+TH('Base','right',132)+TH('Base Bs','right',170)+TH('IVA','right',116)+TH('Total','right',132)+TH('Cobrado','right',132)+(al>0?TH('Impuesto '+al+'% Bs','right',122):'')+'</tr>'; }
  function buildBody(months, al, mode){ var cols=al>0?9:8; var GT={n:0,base:0,iva:0,total:0,cob:0,bs:0,sinTasa:0}, out='';
    function td(t,a){ return '<td style="border:1px solid #eef2f8;padding:4px 7px;white-space:nowrap'+(a?';text-align:'+a:'')+'">'+t+'</td>'; }
    function num(v){ if(mode==='excel')return '<td style="mso-number-format:\'#,##0.00\';border:1px solid #dfe6f2;text-align:right;padding:4px 7px">'+Number(v||0).toFixed(2)+'</td>'; return '<td style="border:1px solid #eef2f8;padding:4px 7px;text-align:right">'+m(v)+'</td>'; }
    /* Bs a la tasa BCV del dia de CADA factura (f.tasa), la misma con la que
       se imprimio: neto x tasa = BsD. Nunca la tasa de hoy: entre 2024 y 2026
       va de 35 a 737 Bs/USD y convertir todo el historico a la de hoy lo
       falsearia. Al exportar no se pierde el dato: Base Bs / Base la devuelve.
       `k` es el factor sobre la base: 1 para la base, al/100 para el impuesto. */
    function bsF(v){ return 'Bs '+Number(v||0).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2}); }
    function bsCel(f,k,conTasa){ var t=+f.tasa||0;
      if(!(t>0))return mode==='excel'
        ? '<td style="border:1px solid #dfe6f2;text-align:center;padding:4px 7px">sin tasa</td>'
        : '<td style="border:1px solid #eef2f8;padding:4px 7px;text-align:center;color:#c0392b" title="Esta factura no tiene tasa BCV registrada: no puede convertirse">sin tasa</td>';
      var v=(+f.base||0)*(k||0)*t;
      if(mode==='excel')return '<td style="mso-number-format:\'#,##0.00\';border:1px solid #dfe6f2;text-align:right;padding:4px 7px">'+v.toFixed(2)+'</td>';
      return '<td style="border:1px solid #eef2f8;padding:4px 7px;text-align:right;white-space:nowrap">'+bsF(v)+(conTasa?('<div style="font-size:9px;color:#8794b0;font-weight:400">@ '+Number(t).toLocaleString('es-VE',{minimumFractionDigits:4,maximumFractionDigits:4})+'</div>'):'')+'</td>'; }
    /* En subtotales no se anota tasa: cada mes mezcla varias. */
    function bsNum(v){ if(mode==='excel')return '<td style="mso-number-format:\'#,##0.00\';border:1px solid #dfe6f2;text-align:right;padding:4px 7px">'+Number(v||0).toFixed(2)+'</td>';
      return '<td style="border:1px solid #eef2f8;padding:4px 7px;text-align:right;white-space:nowrap">'+bsF(v)+'</td>'; }
    /* La etiqueta ocupa las tres columnas de texto: si no, «TOTAL GENERAL
       (110 facturas)» estira la primera columna y ahoga a las cifras. */
    function rot(t){ return '<td colspan="3" style="border:1px solid #eef2f8;padding:4px 7px">'+t+'</td>'; }
    months.forEach(function(o){ out+='<tr><td colspan="'+cols+'" style="background:#002E5B;color:#fff;font-weight:bold;padding:5px 8px">'+MES[o.mo]+' '+o.y+' — '+o.tot.n+' factura(s)</td></tr>';
      o.items.forEach(function(f){ var pn=(typeof pedNum==='function'?pedNum(f.pedido):f.pedido)||''; out+='<tr>'+td(esc(f.factura||''))+td(esc(f.fecha||''))+td(esc(pn))+num(f.base)+bsCel(f,1,true)+num(f.iva)+num(f.total)+num(f.pagos)+(al>0?bsCel(f,al/100,false):'')+'</tr>'; });
      out+='<tr style="font-weight:bold;background:#eef2fb">'+rot('Subtotal '+MES[o.mo])+num(o.tot.base)+bsNum(o.tot.bs)+num(o.tot.iva)+num(o.tot.total)+num(o.tot.cob)+(al>0?bsNum(o.tot.bs*al/100):'')+'</tr>';
      GT.n+=o.tot.n;GT.bs+=o.tot.bs;GT.sinTasa+=o.tot.sinTasa;GT.base+=o.tot.base;GT.iva+=o.tot.iva;GT.total+=o.tot.total;GT.cob+=o.tot.cob; });
    if(!months.length) return '<tr><td colspan="'+cols+'" style="padding:12px;color:#7688ac">Sin facturas en el período.</td></tr>';
    if(GT.sinTasa)out+='<tr><td colspan="'+cols+'" style="padding:6px 9px;font-size:10.5px;color:#c0392b;background:#fff5f5">'+GT.sinTasa+' factura(s) sin tasa BCV registrada: no suman en las columnas en Bs. Fija su tasa en la factura para incluirlas.</td></tr>';
    out+='<tr style="font-weight:800;background:#dfe7f7">'+rot('TOTAL GENERAL ('+GT.n+' facturas)')+num(GT.base)+bsNum(GT.bs)+num(GT.iva)+num(GT.total)+num(GT.cob)+(al>0?bsNum(GT.bs*al/100):'')+'</tr>';
    return out; }
  function curYf(){ return (document.getElementById('facRepYear')||{}).value||''; }
  function curAl(){ return parseFloat((document.getElementById('facRepAlic')||{}).value)||0; }

<script>
/* ===== Caleva Suite · AUDITORÍA UNIVERSAL — registra TODO cambio (Seguimiento) =====
   Compara el estado anterior con el nuevo en cada guardado y registra el diff
   (campo, antes -> despues) en el log append-only + hash (app_audit). ===== */
(function(){ 'use strict';
  if(typeof Store==='undefined'||typeof Store.save!=='function')return;
  function clone(o){ try{return JSON.parse(JSON.stringify(o));}catch(e){return null;} }
  function A(action,entity,before,after){ try{ fetch(Store.rest()+'rpc/app_audit_write',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},Store.headers()),body:JSON.stringify({p_app:'seguimiento',p_action:action,p_entity:entity||null,p_entity_id:null,p_before:before||null,p_after:after||{}})}); }catch(e){} }
  var KF=['id','factura','pedido','no','cedula','hes','val','code','codigo','nombre'];
  function keyOf(o){ if(o&&typeof o==='object'&&!Array.isArray(o)){ for(var i=0;i<KF.length;i++){ var v=o[KF[i]]; if(v!=null&&v!=='')return KF[i]+'='+v; } } return null; }
  function sh(v){ if(v==null)return ''; if(typeof v==='object')return JSON.stringify(v).slice(0,140); return String(v).slice(0,140); }
  function shF(v){ try{ if(v!=null&&typeof v==='object'){ var s=JSON.stringify(v); return (s.length>4000)?(s.slice(0,4000)+'…'):JSON.parse(s); } return v; }catch(e){ return sh(v); } }
  function diff(a,b,p,out){ if(out.length>=120)return; if(a===b)return;
    if(Array.isArray(a)||Array.isArray(b)){ a=a||[]; b=b||[];
      var keyed=(a[0]&&keyOf(a[0]))||(b[0]&&keyOf(b[0]));
      if(keyed){ var am={},bm={}; a.forEach(function(x){var k=keyOf(x);if(k)am[k]=x;}); b.forEach(function(x){var k=keyOf(x);if(k)bm[k]=x;});
        Object.keys(bm).forEach(function(k){ if(!(k in am))out.push({p:p+'['+k+']',op:'+',b:sh(bm[k]),fb:shF(bm[k])}); else diff(am[k],bm[k],p+'['+k+']',out); });
        Object.keys(am).forEach(function(k){ if(!(k in bm))out.push({p:p+'['+k+']',op:'-',a:sh(am[k]),fa:shF(am[k])}); });
      } else { var n=Math.max(a.length,b.length); for(var i=0;i<n&&out.length<120;i++)diff(a[i],b[i],p+'['+i+']',out); }
    } else if(a&&b&&typeof a==='object'&&typeof b==='object'){ var ks={}; Object.keys(a).forEach(function(k){ks[k]=1;}); Object.keys(b).forEach(function(k){ks[k]=1;}); Object.keys(ks).forEach(function(k){ if(k.charAt(0)==='_')return; /* transitorios: _m, _mora... los recalcula la fecha, no el usuario */ if(out.length<120)diff(a[k],b[k],p?p+'.'+k:k,out); }); }
    else { if(JSON.stringify(a)!==JSON.stringify(b))out.push({p:p,op:'~',a:sh(a),b:sh(b),fa:shF(a),fb:shF(b)}); }
  }
  function label(ch){ var p=ch.map(function(c){return c.p;}).join(' ');
    if(ch.some(function(c){return /^facturas\[/.test(c.p)&&c.op==='+';}))return 'Factura generada';
    if(ch.some(function(c){return /^facturas\[/.test(c.p)&&c.op==='-';}))return 'Factura eliminada';
    if(/facturas\[[^\]]*\]\.(pagos|porCobrar|fPago|status|islr)/.test(p))return 'Pago / cobranza';
    if(/valuaciones\[[^\]]*\]\.hes/.test(p))return 'HES asignada';
    if(/valuaciones\[[^\]]*\]\.fact/.test(p))return 'Vinculacion factura-valuacion';
    if(ch.some(function(c){return /^valuaciones\[/.test(c.p)&&c.op==='+';}))return 'Valuacion agregada';
    if(ch.some(function(c){return /^valuaciones\[/.test(c.p)&&c.op==='-';}))return 'Valuacion eliminada';
    if(/^pedidos/.test(p))return 'Cambio en pedidos';
    if(ch.length>60)return 'Sincronizacion / recalculo';
    return 'Cambio'; }
  var prev=null, ready=false;
  function snap(){ prev=clone(Store.data); ready=!!prev; }
  var iv=setInterval(function(){ if(Store.data&&(Store.data.facturas||Store.data.valuaciones||Store.data.pedidos)){ snap(); clearInterval(iv); } },600);
  var _s=Store.save;
  Store.save=function(){ try{
      if(!ready){ snap(); }
      else { var out=[]; diff(prev,Store.data,'',out); if(out.length){ var bef={},aft={}; out.forEach(function(c){ if('fa' in c)bef[c.p]=c.fa; if('fb' in c)aft[c.p]=c.fb; }); var disp=out.slice(0,120).map(function(c){return {p:c.p,op:c.op,a:c.a,b:c.b};}); A(label(out),(out[0]&&String(out[0].p).split(/[.[]/)[0])||'',{values:bef},{n:out.length,changes:disp,values:aft}); prev=clone(Store.data); } }
    }catch(e){} return _s.apply(this,arguments); };
})();
</script>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   VENTANAS DE CONSULTA · movibles y redimensionables
   Todas comparten el mismo patrón: un overlay a pantalla completa cuyo
   primer hijo es el panel, y el primer hijo del panel es su cabecera.
   Por eso el gestor es genérico y no hay que parchear cada ventana.
   Se equipan solas al abrirse, incluidas las que el JS crea al vuelo.
   ═══════════════════════════════════════════════════════════════════════ */
var Ventanas = (function () {
  'use strict';
  var SEL = '#modalBg,.fac-overlay,#segAuditOv,#segIndOv,#segBkOv,#facRepOv,#hesSyncOv,#segCompOv';
  var MINW = 380, MINH = 200, VISIBLE = 140;
  var act = null;

  function panelDe(ov) {
    if (ov.id === 'modalBg') return ov.querySelector('.modal');
    if (ov.classList && ov.classList.contains('fac-overlay')) return ov.querySelector('.fac-editor');
    return ov.firstElementChild;
  }
  function cabeceraDe(p) { return p.querySelector(':scope > .mh') || p.firstElementChild; }

  function equipar(ov) {
    var p = panelDe(ov); if (!p) return;
    var cab = cabeceraDe(p); if (!cab) return;
    if (p.dataset.vent === '1') return;
    p.dataset.vent = '1';
    p.classList.add('vent');

    /* Los overlays creados por JS traen alto fijo en el cuerpo (max-height:70vh):
       sin esto, agrandar la ventana solo añadiría hueco vacío debajo. */
    if (!p.classList.contains('modal') && !p.classList.contains('fac-editor')) {
      p.style.display = 'flex';
      p.style.flexDirection = 'column';
      p.style.maxHeight = '86vh';
      var cuerpo = cab.nextElementSibling;
      if (cuerpo) {
        cuerpo.style.flex = '1 1 auto';
        cuerpo.style.minHeight = '0';
        cuerpo.style.maxHeight = 'none';
        cuerpo.style.overflow = 'auto';
      }
    }
    p.style.resize = 'both';
    p.style.overflow = 'auto';
    p.style.minWidth = MINW + 'px';
    p.style.minHeight = MINH + 'px';
    p.style.maxWidth = 'none';

    cab.classList.add('vent-cab');
    cab.title = 'Arrastra para mover · esquina inferior derecha para redimensionar';
    cab.addEventListener('pointerdown', iniciar);
    reset(p);
  }

  /* Al abrirse vuelve siempre a su sitio y tamaño: así nunca aparece fuera
     de pantalla ni con un tamaño raro heredado de una consulta anterior. */
  function reset(p) {
    p.style.transform = '';
    p.style.width = '';
    p.style.height = '';
    delete p.dataset.dx; delete p.dataset.dy;
  }

  function iniciar(e) {
    if (e.button !== 0) return;
    if (e.target.closest('button,a,input,select,textarea,.x')) return;  // no secuestrar la ✕
    var cab = e.currentTarget, p = cab.closest('[data-vent="1"]');
    if (!p) return;
    var r = p.getBoundingClientRect();
    var dx = +(p.dataset.dx || 0), dy = +(p.dataset.dy || 0);
    act = { p: p, dx: dx, dy: dy, x0: e.clientX, y0: e.clientY,
            bx: r.left - dx, by: r.top - dy, w: r.width, h: r.height };
    try { cab.setPointerCapture(e.pointerId); } catch (err) {}
    document.body.classList.add('vent-moviendo');
    e.preventDefault();
  }

  function mover(e) {
    if (!act) return;
    var dx = act.dx + (e.clientX - act.x0);
    var dy = act.dy + (e.clientY - act.y0);
    /* La cabecera nunca puede salirse del todo: la ventana siempre se recupera. */
    var minX = -(act.bx + act.w - VISIBLE);
    var maxX = window.innerWidth - act.bx - VISIBLE;
    var minY = -act.by;
    var maxY = window.innerHeight - act.by - 40;
    dx = Math.max(minX, Math.min(maxX, dx));
    dy = Math.max(minY, Math.min(maxY, dy));
    act.p.style.transform = 'translate(' + Math.round(dx) + 'px,' + Math.round(dy) + 'px)';
    act.p.dataset.dx = Math.round(dx);
    act.p.dataset.dy = Math.round(dy);
  }

  function soltar() {
    if (!act) return;
    act = null;
    document.body.classList.remove('vent-moviendo');
  }

  document.addEventListener('pointermove', mover);
  document.addEventListener('pointerup', soltar);
  document.addEventListener('pointercancel', soltar);

  /* OJO: revisar() se dispara con CUALQUIER mutación, así que no puede
     reposicionar sin más — si lo hiciera, borraría la traslación en pleno
     arrastre (la propia clase del body que marca «moviendo» la dispara).
     Sólo se recoloca en la transición cerrada -> abierta. */
  function revisar() {
    if (act) return;
    document.querySelectorAll(SEL).forEach(function (ov) {
      if (ov.id === 'loginBg') return;
      var visible = ov.classList.contains('on') || getComputedStyle(ov).display !== 'none';
      if (visible) {
        equipar(ov);
        if (ov.dataset.ventAbierta !== '1') {
          ov.dataset.ventAbierta = '1';
          var pa = panelDe(ov); if (pa) reset(pa);
        }
      } else if (ov.dataset.ventAbierta === '1') {
        ov.dataset.ventAbierta = '0';
      }
    });
  }

  /* Los overlays se crean y se abren en caliente: hay que vigilarlos. */
  var mo = new MutationObserver(function () { revisar(); });
  mo.observe(document.body, { childList: true, subtree: false,
                              attributes: true, attributeFilter: ['class', 'style'] });
  var mb = document.getElementById('modalBg');
  if (mb) new MutationObserver(revisar).observe(mb, { attributes: true, attributeFilter: ['class'] });
  var fo = document.querySelector('.fac-overlay');
  if (fo) new MutationObserver(revisar).observe(fo, { attributes: true, attributeFilter: ['class'] });

  revisar();
  return { revisar: revisar, equipar: equipar };
})();

</script>
<script>
/* ═══════════════════════════════════════════════════════════════════════
   LISTADOS · total al pie + selección con total a la vista
   Genérico a propósito: detecta las columnas de dinero por el nombre de la
   cabecera, así que vale para cualquier listado presente o futuro sin tocar
   el render de cada pestaña.
     · Todo listado termina en una fila TOTAL (respeta el filtro activo).
     · Se pueden marcar filas sueltas y el total de lo marcado queda fijo abajo.
   Los índices de columna son SIEMPRE lógicos (ignorando la casilla que
   insertamos), porque si no se desplazan en cuanto se equipa la tabla.
   ═══════════════════════════════════════════════════════════════════════ */
var Seleccion = (function () {
  'use strict';

  /* «N° Factura» y «Facturas» NO son dinero; «Facturado» sí. Por eso los
     términos van completos y no como raíces sueltas. */
  var DINERO = /(^|\s)(base|total|monto|importe|saldo|cobrado|facturado|disponible|anticipo|amortizado|iva)(\s|$)|por\s+cobrar/i;
  var TABLAS = ['tF', 'tVal', 'tVen', 'tPen', 'tCob', 'tPed'];
  var sel = {};            // idTabla -> { clave: true }
  var barra = null;
  var mo = null;
  var mutando = false;     // evita que nuestros propios cambios nos reactiven

  function num(txt) {                       // formato de la casa: «$1,234.56»
    var n = parseFloat(String(txt).replace(/[^\d.,-]/g, '').replace(/,/g, ''));
    return isFinite(n) ? n : null;
  }
  function fmt(n) {
    return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function celdas(tr) {                     // celdas reales, sin la casilla
    return [].slice.call(tr.cells).filter(function (c) { return !c.classList.contains('sel-col'); });
  }
  function filas(tabla) {
    var tb = tabla.tBodies[0];
    return tb ? [].slice.call(tb.rows).filter(function (r) {
      return !r.classList.contains('tfoot-row') && r.cells.length > 1;
    }) : [];
  }
  function clave(tr) {
    return celdas(tr).map(function (c) { return c.textContent.trim(); }).join('|');
  }

  /* Columna de dinero: cabecera que suena a importe Y con celdas numéricas. */
  function columnasDinero(tabla) {
    if (!tabla.tHead || !tabla.tHead.rows.length) return [];
    var ths = celdas(tabla.tHead.rows[0]);
    var fs = filas(tabla), out = [];
    ths.forEach(function (th, i) {
      if (!DINERO.test(th.textContent)) return;
      var ok = 0;
      fs.forEach(function (r) { var c = celdas(r)[i]; if (c && num(c.textContent) !== null) ok++; });
      if (!fs.length || ok >= Math.max(1, fs.length * 0.6)) out.push({ i: i, t: th.textContent.trim() });
    });
    return out;
  }

  /* ── 1 · fila TOTAL al final ──────────────────────────────────────────── */
  function totalizar(tabla, cols) {
    var vieja = tabla.querySelector('tr.sel-total');
    var propio = tabla.querySelector('.tfoot-row:not(.sel-total)');
    if (!cols.length || propio) {                    // el módulo ya pone el suyo
      if (vieja) vieja.parentNode.removeChild(vieja);
      return;
    }
    var fs = filas(tabla);
    if (!fs.length) { if (vieja) vieja.parentNode.removeChild(vieja); return; }

    var nLog = celdas(tabla.tHead.rows[0]).length;
    var suma = {};
    cols.forEach(function (c) {
      suma[c.i] = fs.reduce(function (a, r) {
        var cel = celdas(r)[c.i];
        return a + (cel ? (num(cel.textContent) || 0) : 0);
      }, 0);
    });

    /* Idempotente a proposito: si el total no ha cambiado no se toca el DOM.
       Reconstruirlo cada pasada mutaba el arbol, el observador lo recogia al
       bajar la guarda y se reprogramaba solo: un bucle de 80 ms sin fin. */
    var firma = fs.length + ':' + cols.map(function (c) { return c.i + '=' + suma[c.i].toFixed(2); }).join(',');
    if (vieja && vieja.dataset.firma === firma) return;
    if (vieja) vieja.parentNode.removeChild(vieja);

    var tr = document.createElement('tr');
    tr.className = 'tfoot-row sel-total';
    tr.dataset.firma = firma;
    if (tabla.querySelector('th.sel-col')) {
      var vacia = document.createElement('td'); vacia.className = 'sel-col'; tr.appendChild(vacia);
    }
    for (var i = 0; i < nLog; i++) {
      var td = document.createElement('td');
      if (i in suma) { td.textContent = fmt(suma[i]); td.className = 'num'; }
      else if (i === 0) { td.textContent = 'TOTAL · ' + fs.length + ' reg.'; td.className = 'sel-total-lbl'; }
      tr.appendChild(td);
    }
    (tabla.tFoot || tabla.appendChild(document.createElement('tfoot'))).appendChild(tr);
  }

  /* ── 2 · columna de selección ─────────────────────────────────────────── */
  function equipar(tabla, cols) {
    if (!cols.length) return;
    var id = tabla.id;
    sel[id] = sel[id] || {};

    if (!tabla.querySelector('th.sel-col')) {
      var th = document.createElement('th');
      th.className = 'sel-col';
      th.innerHTML = '<input type="checkbox" title="Marcar todo lo visible">';
      tabla.tHead.rows[0].insertBefore(th, tabla.tHead.rows[0].firstChild);
      th.firstChild.addEventListener('change', function (e) {
        filas(tabla).forEach(function (r) { sel[id][clave(r)] = e.target.checked; });
        pintar(tabla, cols);
      });
    }
    filas(tabla).forEach(function (r) {
      if (r.querySelector('td.sel-col')) return;
      var td = document.createElement('td');
      td.className = 'sel-col';
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = !!sel[id][clave(r)];
      cb.addEventListener('change', function () { sel[id][clave(r)] = cb.checked; pintar(tabla, cols); });
      td.appendChild(cb);
      td.addEventListener('click', function (e) { if (e.target !== cb) cb.click(); });
      r.insertBefore(td, r.firstChild);
    });
  }

  /* ── 3 · filas marcadas y barra global ───────────────────────────────── */
  /* OJO: la barra es UNA sola para toda la app, pero `revisar()` recorre las
     seis tablas. Si cada `pintar` decidiera sobre ella, la última tabla sin
     nada marcado la apagaría — que es justo lo que pasaba. Por eso pintar()
     sólo toca su tabla y la barra la decide `actualizarBarra()` mirando todas. */
  function pintar(tabla, cols) {
    var id = tabla.id, fs = filas(tabla);
    var marcadas = fs.filter(function (r) { return sel[id][clave(r)]; });
    fs.forEach(function (r) {
      var on = !!sel[id][clave(r)];
      r.classList.toggle('sel-on', on);
      var cb = r.querySelector('td.sel-col input');
      if (cb) cb.checked = on;
    });
    var th = tabla.querySelector('th.sel-col input');
    if (th) {
      th.checked = marcadas.length > 0 && marcadas.length === fs.length;
      th.indeterminate = marcadas.length > 0 && marcadas.length < fs.length;
    }
    actualizarBarra();
  }

  function visible(el) { return !!(el.offsetParent || el.getClientRects().length); }

  function actualizarBarra() {
    if (!barra) { barra = document.createElement('div'); barra.id = 'selBarra'; document.body.appendChild(barra); }
    var elegida = null;
    for (var k = 0; k < TABLAS.length; k++) {
      var t = document.getElementById(TABLAS[k]);
      if (!t || !t.tHead || !t.tBodies.length || !visible(t)) continue;
      var m = filas(t).filter(function (r) { return (sel[t.id] || {})[clave(r)]; });
      if (m.length) { elegida = { t: t, m: m, cols: columnasDinero(t) }; break; }
    }
    if (!elegida) { barra.classList.remove('on'); barra.innerHTML = ''; return; }

    var fs = filas(elegida.t);
    var partes = elegida.cols.map(function (c) {
      var s2 = elegida.m.reduce(function (a, r) {
        var cel = celdas(r)[c.i];
        return a + (cel ? (num(cel.textContent) || 0) : 0);
      }, 0);
      return '<span class="sb-i"><b>' + fmt(s2) + '</b><i>' + c.t + '</i></span>';
    }).join('');
    var html = '<span class="sb-n">' + elegida.m.length + ' de ' + fs.length +
      ' seleccionada' + (elegida.m.length === 1 ? '' : 's') + '</span>' + partes +
      '<button class="sb-x" type="button">Limpiar</button>';
    if (barra.innerHTML !== html) barra.innerHTML = html;
    barra.querySelector('.sb-x').onclick = function () {
      sel[elegida.t.id] = {}; pintar(elegida.t, elegida.cols);
    };
    barra.classList.add('on');
  }

  function revisar() {
    if (mutando) return;
    mutando = true;
    try {
      TABLAS.forEach(function (id) {
        var t = document.getElementById(id);
        if (!t || !t.tHead || !t.tBodies.length) return;
        var cols = columnasDinero(t);
        equipar(t, cols);          // primero la casilla…
        totalizar(t, cols);        // …y luego el total, que ya la contempla
        pintar(t, cols);
      });
    } finally {
      // descartar lo que hemos mutado nosotros: si no, el observador lo
      // entrega despues de bajar la guarda y se reprograma en bucle
      if (mo) mo.takeRecords();
      mutando = false;
    }
  }

  var pendiente = null;
  function programar() { clearTimeout(pendiente); pendiente = setTimeout(revisar, 80); }
  var raiz = document.querySelector('.wrap') || document.body;
  var mo = new MutationObserver(function () { if (!mutando) programar(); });
  mo.observe(raiz, { childList: true, subtree: true });
  programar();

  return { revisar: revisar, limpiar: function () { sel = {}; programar(); } };
})();

</script>
<script>
/* ═══════════════════════════════════════════════════════════════════════
   COMPLETAR VALUACIONES FALTANTES
   Hay HES ya facturadas que no tienen valuacion cargada. La factura si sabe
   el HES, el pedido, la descripcion y el monto; lo unico que no sabe es la
   ESTACION y el numero de valuacion, porque la linea de factura no los lleva.
   Por eso esto no crea nada solo: presenta lo que falta, deja completar esos
   dos campos y crea unicamente lo que se marque.
   La fecha por defecto es la de la factura — una valuacion nunca es posterior
   a su factura, asi que es la cota mas prudente y queda editable.
   ═══════════════════════════════════════════════════════════════════════ */
var Completar = (function () {
  'use strict';

  var estado = {};   // hes -> { estacion, val, fecha, marcado }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function money(n) {
    return '$' + (+n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  /* Las lineas facturadas sin valuacion detras, con su factura. */
  function faltantes() {
    var vs = {};
    ((Store.data && Store.data.valuaciones) || []).forEach(function (v) {
      var h = String(v.hes == null ? '' : v.hes).trim();
      if (h) vs[h] = 1;
    });
    var out = [];
    ((Store.data && Store.data.facturas) || []).forEach(function (f) {
      if (String(f.status || '').toLowerCase() === 'anulada') return;
      (f.lineas || []).forEach(function (l) {
        var h = String(l.hes == null ? '' : l.hes).trim();
        if (!h || vs[h]) return;
        out.push({
          hes: h, factura: String(f.factura || ''), fecha: f.fecha || '',
          pedido: (typeof pedNum === 'function' ? pedNum(f.pedido) : f.pedido) || '',
          desc: l.desc || f.descPedido || '', base: +l.base || 0,
          status: f.status || ''
        });
      });
    });
    return out.sort(function (a, b) {
      return String(a.fecha).localeCompare(String(b.fecha)) ||
             String(a.factura).localeCompare(String(b.factura));
    });
  }

  function fila(hes) {
    if (!estado[hes]) estado[hes] = { estacion: '', val: '', fecha: '', marcado: false };
    return estado[hes];
  }

  function visibles() {
    var q = (document.getElementById('cmpBuscar') || {}).value || '';
    var soloAnio = (document.getElementById('cmpAnio') || {}).checked;
    var a = (typeof anioSel === 'function') ? anioSel() : '';
    q = q.toLowerCase();
    return faltantes().filter(function (r) {
      if (soloAnio && a && String(r.fecha).slice(0, 4) !== a) return false;
      if (!q) return true;
      return (r.factura + ' ' + r.pedido + ' ' + r.hes + ' ' + r.desc).toLowerCase().indexOf(q) >= 0;
    });
  }

  /* No hay de donde deducir la estacion: 115 de las 118 lineas pertenecen a
     pedidos que nunca tuvieron valuacion, y la linea de factura no la lleva.
     Lo unico honesto es escribirla — y poder repetirla de golpe. */
  function aplicarEstacion() {
    var v = (document.getElementById('cmpEstTodas') || {}).value || '';
    v = v.trim();
    if (!v) { toast('Escribe la estación que quieres aplicar'); return; }
    var rs = visibles().filter(function (r) { return fila(r.hes).marcado; });
    if (!rs.length) { toast('Marca antes las filas'); return; }
    rs.forEach(function (r) { fila(r.hes).estacion = v; });
    pintar();
    toast(rs.length + ' fila(s) con estación «' + v + '»');
  }

  function pintar() {
    var cuerpo = document.getElementById('cmpBody');
    if (!cuerpo) return;
    var rs = visibles();
    var dl = '<datalist id="cmpEstDL">' + (Store.data.estaciones || []).map(function (e) {
      return '<option value="' + esc(e) + '">';
    }).join('') + '</datalist>';

    var trs = rs.map(function (r) {
      var e = fila(r.hes);
      return '<tr data-hes="' + esc(r.hes) + '"' + (e.marcado ? ' class="cmp-on"' : '') + '>' +
        '<td class="center"><input type="checkbox" class="cmpChk"' + (e.marcado ? ' checked' : '') + '></td>' +
        '<td class="mono center">' + esc(r.factura) + '</td>' +
        '<td class="center">' + esc(r.fecha) + '</td>' +
        '<td class="mono">' + esc(r.pedido) + '</td>' +
        '<td class="mono">' + esc(r.hes) + '</td>' +
        '<td style="font-size:11.5px">' + esc(String(r.desc).slice(0, 70)) + '</td>' +
        '<td class="num">' + money(r.base) + '</td>' +
        '<td><input class="cmpEst" list="cmpEstDL" value="' + esc(e.estacion) + '" placeholder="estación"></td>' +
        '<td><input class="cmpVal" value="' + esc(e.val) + '" placeholder="V-1" style="width:70px"></td>' +
        '</tr>';
    }).join('');

    cuerpo.innerHTML = dl + (rs.length ?
      '<table class="cmpTbl"><thead><tr><th style="width:30px"></th><th>Factura</th>' +
      '<th>Fecha</th><th>Pedido</th><th>HES</th><th>Descripción</th><th class="num">Monto</th>' +
      '<th style="width:190px">Estación</th><th>Val</th></tr></thead><tbody>' + trs + '</tbody></table>' :
      '<p style="padding:18px;color:var(--mut)">No queda ninguna línea facturada sin valuación con este filtro.</p>');

    actualizarPie();
  }

  function actualizarPie() {
    var rs = visibles();
    var marc = rs.filter(function (r) { return fila(r.hes).marcado; });
    var suma = marc.reduce(function (a, r) { return a + r.base; }, 0);
    var pie = document.getElementById('cmpPie');
    if (pie) {
      pie.innerHTML = '<b>' + marc.length + '</b> de ' + rs.length + ' marcada(s)' +
        (marc.length ? ' · <b>' + money(suma) + '</b>' : '');
    }
    var btn = document.getElementById('cmpCrear');
    if (btn) { btn.disabled = !marc.length; btn.textContent = 'Crear ' + marc.length + ' valuación(es)'; }
  }

  function crear() {
    var rs = visibles().filter(function (r) { return fila(r.hes).marcado; });
    if (!rs.length) return;
    var sinEst = rs.filter(function (r) { return !fila(r.hes).estacion.trim(); }).length;
    var suma = rs.reduce(function (a, r) { return a + r.base; }, 0);
    var msg = 'Se crearán ' + rs.length + ' valuación(es) por ' + money(suma) +
      ', ya vinculadas a su factura por HES.';
    if (sinEst) msg += '\n\nOJO: ' + sinEst + ' quedan SIN estación y no aparecerán en la Matriz ' +
      'de Valuaciones (sí en el resto). Puedes ponerles la estación ahora.';
    msg += '\n\n¿Continuar?';
    if (!confirm(msg)) return;

    var facs = {};
    ((Store.data && Store.data.facturas) || []).forEach(function (f) {
      facs[String(f.factura || '')] = f;
    });
    rs.forEach(function (r) {
      var e = fila(r.hes), f = facs[r.factura] || {};
      var pagada = String(f.status || '').toLowerCase() === 'pagada';
      Store.data.valuaciones.push({
        fecha: e.fecha || r.fecha,
        estacion: e.estacion.trim(),
        pedido: r.pedido,
        val: e.val.trim(),
        montoUSD: r.base,
        hes: r.hes,
        fact: r.factura,
        desc: r.desc,
        fechaHes: '',
        etapa: pagada ? '5. Cobrada' : '3. Facturada (por cobrar)',
        origen: 'app'
      });
      delete estado[r.hes];
    });
    try { Store.save(); } catch (err) {}
    toast(rs.length + ' valuación(es) creadas y guardadas');
    pintar();
    try { if (typeof repintaAnio === 'function') repintaAnio(); } catch (err) {}
    try { UI.render(); } catch (err) {}
    var b = document.getElementById('cmpFaltan');
    if (b) b.textContent = faltantes().length;
  }

  function abrir() {
    if (!(Auth.esAdmin && Auth.esAdmin())) { toast('Solo un administrador'); return; }
    var ov = document.getElementById('segCompOv');
    if (!ov) {
      ov = document.createElement('div');
      ov.id = 'segCompOv';
      ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,30,61,.5);z-index:600;' +
        'display:flex;align-items:flex-start;justify-content:center;padding:26px;overflow:auto';
      ov.innerHTML =
        '<div role="dialog" aria-label="Completar valuaciones faltantes" style="background:#fff;' +
        'max-width:1180px;width:100%;border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)">' +
        '<div style="display:flex;align-items:center;gap:10px;padding:14px 18px;' +
        'background:linear-gradient(120deg,#001E3D,#002E5B);color:#fff">' +
        '<b style="flex:1;font-size:15px">Completar valuaciones faltantes</b>' +
        '<button id="cmpX" aria-label="Cerrar" style="background:rgba(255,255,255,.15);border:0;' +
        'color:#fff;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px">×</button></div>' +
        '<div style="padding:14px 18px">' +
        '<p style="font-size:12.5px;color:var(--mut);margin:0 0 12px">Estas líneas ya están ' +
        '<b>facturadas</b> pero no tienen valuación cargada. La factura aporta HES, pedido, ' +
        'descripción y monto; falta la <b>estación</b> y el <b>número de valuación</b>, que la ' +
        'línea de factura no lleva. La fecha por defecto es la de la factura.</p>' +
        '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px">' +
        '<input id="cmpBuscar" placeholder="Buscar factura, pedido, HES o descripción…" style="min-width:260px">' +
        '<label style="font-size:12px;color:var(--mut);display:flex;align-items:center;gap:5px">' +
        '<input type="checkbox" id="cmpAnio"> solo el año seleccionado</label>' +
        '<button class="btn gr" id="cmpTodo">Marcar todo lo visible</button>' +
        '<span style="display:flex;gap:6px;align-items:center">' +
        '<input id="cmpEstTodas" list="cmpEstDL" placeholder="estación…" style="width:170px">' +
        '<button class="btn o" id="cmpAplicar">→ a las marcadas</button></span>' +
        '</div>' +
        '<div id="cmpBody" style="max-height:56vh;overflow:auto"></div>' +
        '<div style="display:flex;align-items:center;gap:12px;margin-top:12px;padding-top:12px;' +
        'border-top:1px solid var(--rule)">' +
        '<span id="cmpPie" style="font-size:12.5px;color:var(--mut)"></span>' +
        '<span style="flex:1"></span>' +
        '<button class="btn r" id="cmpCancel">Cancelar</button>' +
        '<button class="btn g" id="cmpCrear">Crear</button></div>' +
        '</div></div>';
      document.body.appendChild(ov);

      if (!document.getElementById('cmpCss')) {
        var st = document.createElement('style');
        st.id = 'cmpCss';
        st.textContent = '#segCompOv .cmpTbl{width:100%;border-collapse:collapse;font-size:12px}' +
          '#segCompOv .cmpTbl th{position:sticky;top:0;background:var(--bg);color:var(--mut);' +
          'text-align:left;padding:7px 8px;font-size:10.5px;text-transform:uppercase;' +
          'letter-spacing:.06em;border-bottom:1px solid var(--rule);z-index:1}' +
          '#segCompOv .cmpTbl td{padding:4px 8px;border-bottom:1px solid var(--hair)}' +
          '#segCompOv .cmpTbl tbody tr:hover td{background:var(--hair)}' +
          '#segCompOv .cmpTbl tr.cmp-on td{background:#eef4fb}' +
          '#segCompOv .cmpTbl input{width:100%;border:1px solid var(--bd);border-radius:6px;' +
          'padding:4px 7px;font:inherit;font-size:12px}' +
          '#segCompOv .cmpTbl .num{text-align:right;white-space:nowrap}' +
          '#segCompOv .cmpTbl .center{text-align:center}' +
          '#segCompOv .cmpTbl .mono{font-variant-numeric:tabular-nums}';
        document.head.appendChild(st);
      }

      ov.addEventListener('click', function (e) { if (e.target === ov) ov.remove(); });
      document.getElementById('cmpX').onclick = function () { ov.remove(); };
      document.getElementById('cmpCancel').onclick = function () { ov.remove(); };
      document.getElementById('cmpBuscar').oninput = pintar;
      document.getElementById('cmpAnio').onchange = pintar;
      document.getElementById('cmpAplicar').onclick = aplicarEstacion;
      document.getElementById('cmpCrear').onclick = crear;
      document.getElementById('cmpTodo').onclick = function () {
        var rs = visibles();
        var todos = rs.every(function (r) { return fila(r.hes).marcado; });
        rs.forEach(function (r) { fila(r.hes).marcado = !todos; });
        pintar();
      };
      /* Un solo oyente para toda la tabla: se repinta entera a cada cambio y
         enganchar fila a fila dejaria oyentes muertos en cada pasada. */
      document.getElementById('cmpBody').addEventListener('input', function (e) {
        var tr = e.target.closest('tr[data-hes]');
        if (!tr) return;
        var f = fila(tr.dataset.hes);
        if (e.target.classList.contains('cmpEst')) f.estacion = e.target.value;
        else if (e.target.classList.contains('cmpVal')) f.val = e.target.value;
      });
      /* Marcar NO repinta la tabla: repintarla perderia el foco y la posicion
         del scroll, y ademas se comia los clics seguidos porque el segundo
         llegaba a una fila ya sustituida. Solo se actualiza el pie. */
      document.getElementById('cmpBody').addEventListener('change', function (e) {
        var tr = e.target.closest('tr[data-hes]');
        if (!tr || !e.target.classList.contains('cmpChk')) return;
        fila(tr.dataset.hes).marcado = e.target.checked;
        tr.classList.toggle('cmp-on', e.target.checked);
        actualizarPie();
      });
    }
    pintar();
  }

  return { abrir: abrir, faltantes: faltantes };
})();
window.__segCompletar = Completar.abrir;

</script>
