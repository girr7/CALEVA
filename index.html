<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caleva · Sistema de Seguimiento</title>
<style>
:root{--navy:#1a2e4a;--navy2:#2c4a6e;--blue:#2e6da4;--green:#27ae60;--red:#c0392b;--orange:#e67e22;--purple:#8e44ad;--cyan:#4fc3f7;--bg:#eef1f5;--bd:#c5d8ec;--ink:#1a2533;--mut:#7a90a8}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:13px}
.top-header{background:linear-gradient(135deg,var(--navy),var(--blue));padding:16px 30px;color:#fff;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;box-shadow:0 2px 12px rgba(26,46,74,.25)}
.top-header h1{font-size:19px;font-weight:700}
.top-header p{font-size:11px;opacity:.82;margin-top:3px}
.brandbox{display:flex;align-items:center;gap:14px}
.brand-logo{height:46px;background:#fff;padding:5px 10px;border-radius:8px;display:block}
.header-badges{display:flex;gap:9px;flex-wrap:wrap}
.header-badge{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);border-radius:10px;padding:8px 15px;text-align:center;white-space:nowrap}
.header-badge .val{font-size:17px;font-weight:700}
.header-badge .lbl{font-size:9px;opacity:.85;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.header-badge.rojo{background:rgba(192,57,43,.28);border-color:rgba(192,57,43,.5)}
.header-badge.verde{background:rgba(39,174,96,.25);border-color:rgba(39,174,96,.5)}
.tabs{display:flex;background:var(--navy);padding:0 30px;gap:2px;overflow-x:auto;position:sticky;top:0;z-index:50}
.tab{padding:12px 20px;cursor:pointer;color:#aac4e0;font-size:12px;font-weight:600;border-bottom:3px solid transparent;transition:.18s;user-select:none;white-space:nowrap}
.tab:hover{color:#fff;background:rgba(255,255,255,.05)}
.tab.active{color:#fff;border-bottom-color:var(--cyan)}
.tab.soon{opacity:.5;cursor:default}
.tab.soon:hover{background:none;color:#aac4e0}
.wrap{padding:20px 30px;max-width:1500px;margin:0 auto}
.panel{display:none}.panel.active{display:block}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar select,.toolbar input{padding:7px 11px;border:1px solid var(--bd);border-radius:7px;font-size:12px;background:#fff}
.btn{padding:7px 14px;border:none;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;color:#fff;background:var(--blue)}
.btn:hover{filter:brightness(1.08)}
.btn.g{background:var(--green)}.btn.o{background:var(--orange)}.btn.gr{background:#5a7089}.btn.r{background:var(--red)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:#fff;border-radius:10px;padding:14px 16px;border-left:4px solid var(--navy);box-shadow:0 1px 5px rgba(26,46,74,.08)}
.kpi.red{border-left-color:var(--red)}.kpi.green{border-left-color:var(--green)}.kpi.orange{border-left-color:var(--orange)}.kpi.navy{border-left-color:var(--navy)}.kpi.purple{border-left-color:var(--purple)}.kpi.blue{border-left-color:var(--blue)}
.kpi-lbl{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.kpi-val{font-size:22px;font-weight:700;margin-top:5px}
.kpi-sub{font-size:10.5px;color:var(--mut);margin-top:3px}
.card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 6px rgba(26,46,74,.08);margin-bottom:20px}
.section-hdr{background:var(--navy);color:#fff;padding:11px 16px;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.section-hdr-right{font-size:11px;opacity:.78;font-weight:400}
.section-body{padding:14px 16px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#eef3f8;color:var(--navy2);font-size:10px;font-weight:700;padding:8px 9px;text-align:left;text-transform:uppercase;border-bottom:2px solid var(--bd);white-space:nowrap;cursor:pointer}
th:hover{background:#dce9f5}
td{padding:7px 9px;border-bottom:1px solid var(--bg)}
tr:hover td{background:#f6fafd}
.mono{font-family:Consolas,monospace;font-size:11px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.center{text-align:center}
.tfoot-row td{background:#eef3f8;font-weight:700;color:var(--navy);border-top:2px solid var(--bd)}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700}
.pill.ok{background:#eafaf1;color:var(--green)}
.pill.pend{background:#fef3e2;color:var(--orange)}
.pill.venc{background:#fdecea;color:var(--red)}
.bars{display:flex;align-items:flex-end;gap:6px;height:170px;padding:10px 4px 0}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.bar-stack{width:100%;max-width:46px;display:flex;flex-direction:column;justify-content:flex-end;flex:1}
.bar-seg{width:100%}
.bar-lbl{font-size:9.5px;color:var(--mut);white-space:nowrap}
.bar-val{font-size:9px;color:var(--navy2);font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:10.5px;color:var(--navy2);margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.foot{text-align:center;color:var(--mut);font-size:10.5px;padding:16px}
.empty{padding:26px;text-align:center;color:var(--mut);font-style:italic}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.tab.proc{color:#ffd98a}.tab.proc.active{color:#fff;border-bottom-color:#f1c40f}
.tabsep{width:1px;background:rgba(255,255,255,.18);margin:8px 6px}
.form{background:#fff;border-radius:10px;padding:18px;box-shadow:0 1px 6px rgba(26,46,74,.08);margin-bottom:20px}
.form h3{font-size:14px;color:var(--navy);margin-bottom:14px}
.frow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:10px;color:var(--mut);text-transform:uppercase;font-weight:600;letter-spacing:.3px}
.fld input,.fld select{padding:8px 11px;border:1px solid var(--bd);border-radius:7px;font-size:13px;background:#fff;min-width:130px}
.fld input:focus,.fld select:focus{outline:2px solid var(--cyan);border-color:var(--cyan)}
.fld .wide{min-width:280px}
.itemtbl{width:100%;border-collapse:collapse;margin:8px 0 4px}
.itemtbl th{background:#eef3f8;font-size:9.5px;padding:6px 8px}
.itemtbl td{padding:4px 6px;border-bottom:1px solid var(--bg)}
.itemtbl input{width:100%;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;font-size:12px}
.chk{width:17px;height:17px;cursor:pointer;accent-color:var(--green)}
.hint{font-size:11px;color:var(--mut);margin-top:4px}
.badge2{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700}
.badge2.b1{background:#fdecea;color:var(--red)}.badge2.b2{background:#fef3e2;color:var(--orange)}.badge2.b3{background:#eafaf1;color:var(--green)}
.info-pedido{background:#eef3f8;border-radius:8px;padding:10px 14px;font-size:12px;color:var(--navy2);display:flex;gap:22px;flex-wrap:wrap;margin-bottom:12px}
.info-pedido b{color:var(--navy)}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(26,46,74,.55);z-index:200;align-items:flex-start;justify-content:center;overflow-y:auto;padding:18px 0}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:12px;width:min(520px,94vw);box-shadow:0 10px 40px rgba(0,0,0,.3);overflow:hidden;max-height:92vh;display:flex;flex-direction:column;margin:auto}
.modal .mh{background:var(--navy);color:#fff;padding:13px 18px;font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;flex:0 0 auto}
.modal .mh .x{cursor:pointer;opacity:.8}.modal .mh .x:hover{opacity:1}
.modal .mb{padding:18px;overflow-y:auto;flex:1 1 auto}
.pay-btn{padding:4px 10px;border:none;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;background:var(--green);color:#fff}
.flink{cursor:pointer;color:var(--blue);font-weight:700;text-decoration:underline}
.flink:hover{color:var(--navy)}
.mtx{border-collapse:collapse;font-size:11px}
.mtx th{background:var(--navy);color:#fff;padding:7px 9px;font-size:10px;text-transform:none;position:sticky;top:0}
.mtx td{padding:5px 7px;border:1px solid #e3ebf3;text-align:center}
.mtx td.est{text-align:left;font-weight:700;white-space:nowrap;background:#f6fafd}
.mcell{color:#fff;font-weight:700;border-radius:0}
.m1{background:var(--red)}.m2{background:var(--orange)}.m3{background:var(--green)}.m0{background:#f4f7fa;color:transparent}
.mtx tr:hover td.est{background:#dbe7f4}
.mtx tr:hover td.m1{background:#a5281c}.mtx tr:hover td.m2{background:#cf6a12}.mtx tr:hover td.m3{background:#1e8a4c}
.mtx tr:hover td.m0{background:#e9eef4}
.mtx td.mcell{transition:filter .1s}.mtx td.mcell:hover{filter:brightness(1.12);outline:2px solid var(--navy);outline-offset:-2px}
.section-body{-webkit-overflow-scrolling:touch}
html{-webkit-text-size-adjust:100%}
@media print{
  @page{margin:12mm}
  .tabs,.toolbar,.foot,.modal-bg,.toast,.pay-btn,.btn,#cloudWrap{display:none!important}
  .top-header{box-shadow:none;background:#1a2e4a!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .panel{display:none!important}
  .panel.active{display:block!important}
  body{background:#fff}
  .wrap{padding:0;max-width:100%}
  .card,.kpi{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  .section-hdr,.mcell,.pill,.badge2,th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table{font-size:10px}
  /* impresión de la FACTURA: solo se ve la hoja de factura */
  body.printing-fac>*:not(#facturaPrint){display:none!important}
  body.printing-fac #facturaPrint{position:static!important;left:0!important;width:100%!important}
  body.printing-fac .fac-overlay{display:none!important}
}
@page fac{size:letter portrait;margin:1.2cm}
@media(max-width:640px){
  .top-header{padding:11px 14px;gap:10px}
  .top-header h1{font-size:15px}.top-header p{font-size:10px}
  .header-badges{gap:6px;width:100%}
  .header-badge{padding:6px 10px;flex:1;min-width:0}
  .header-badge .val{font-size:14px}.header-badge .lbl{font-size:8px}
  .tabs{padding:0 8px}
  .tab{padding:11px 13px;font-size:11.5px}
  .tabsep{display:none}
  .wrap{padding:12px 10px}
  .toolbar{gap:7px}
  .toolbar input,.toolbar select{font-size:12.5px;padding:8px 9px;flex:1;min-width:120px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(45%,1fr));gap:9px}
  .kpi{padding:11px 12px}.kpi-val{font-size:18px}
  .grid2{grid-template-columns:1fr}
  table{font-size:11.5px}
  th,td{padding:7px 7px}
  .section-hdr{font-size:12px;padding:10px 12px}
  .section-body{padding:11px 9px}
  .btn{padding:9px 13px;font-size:12.5px}
  .form{padding:14px 12px}
  .frow{flex-direction:column;align-items:stretch;gap:10px}
  .fld{width:100%}
  .fld input,.fld select,.fld .wide{min-width:0;width:100%;box-sizing:border-box}
  .modal{width:95vw}
  .info-pedido{gap:12px;font-size:11.5px}
  .pay-btn{padding:6px 11px}
}
.mleg{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--navy2);margin:4px 0 10px}
.mleg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 22px;border-radius:9px;font-size:13px;z-index:300;box-shadow:0 6px 24px rgba(0,0,0,.3);opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
/* --- Editor de factura imprimible --- */
.fac-overlay{display:none;position:fixed;inset:0;background:rgba(26,46,74,.6);z-index:250;overflow:auto;padding:18px}
.fac-overlay.on{display:block}
.fac-editor{background:#fff;max-width:900px;margin:0 auto;border-radius:10px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.fac-editor .mh{background:var(--navy);color:#fff;padding:12px 18px;font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.fac-editor .mb{padding:16px 18px}
.fac-editrow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
.fac-editrow .fld input{min-width:110px}
.fac-itbl{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0}
.fac-itbl th{background:#eef3f8;color:var(--navy2);font-size:10px;padding:6px 6px;border-bottom:2px solid var(--bd)}
.fac-itbl td{padding:3px 4px;border-bottom:1px solid var(--bg)}
.fac-itbl input{width:100%;padding:5px 6px;border:1px solid var(--bd);border-radius:5px;font-size:12px;text-align:right}
.fac-itbl input.txt{text-align:left}
.fac-tot-edit{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:8px}
.fac-tot-edit .fld{width:150px}
/* --- Hoja de factura para impresión (copia exacta del formato Caleva) --- */
#facturaPrint{position:fixed;left:-99999px;top:0;width:216mm;font-family:Tahoma,Arial,sans-serif;color:#000;background:#fff}
#facturaPrint table{border-collapse:collapse;table-layout:fixed;width:202mm;margin-left:6mm}
#facturaPrint td{font-size:8pt;padding:0 2px;vertical-align:middle;overflow:hidden;line-height:1.05;border:0;background:#fff}
#facturaPrint tr:hover td{background:#fff}
#facturaPrint .fx-c{text-align:center}
#facturaPrint .fx-r{text-align:right}
#facturaPrint .fx-l{text-align:left}
#facturaPrint .fx-b{font-weight:bold}
#facturaPrint .fx-title{font-size:20pt;text-align:center}
#facturaPrint .fx-big{font-size:10pt}
#facturaPrint .fx-cli{font-size:11pt}
</style>
</head>

  rest:function(){var u=(SB.url||'').replace(/\/+$/,'').replace(/\/rest\/v1$/,'');return u+'/rest/v1/';},
  headers:function(){return {'apikey':SB.key,'Authorization':'Bearer '+SB.key,'Content-Type':'application/json'};},
  saveLocal:function(){try{localStorage.setItem(KEY,JSON.stringify(this.data));}catch(e){}},
  load:function(){
    var self=this;
    var raw=null;try{raw=localStorage.getItem(KEY);}catch(e){}
    if(raw){try{self.data=JSON.parse(raw);}catch(e){}}
    if(!self.data)self.data=self.seed();
    if(!self.cloud())return Promise.resolve();
    self.setCloud('sync');
    return fetch(self.rest()+SB.table+'?id=eq.1&select=data,version',{headers:self.headers()})
      .then(function(r){return r.ok?r.json():[];})
      .then(function(rows){
        if(rows&&rows.length&&rows[0].data&&rows[0].data.facturas){self.data=rows[0].data;self.version=rows[0].version||0;self.saveLocal();self.setCloud('ok');}
        else{return self.push();}   /* nube vacía: sube los datos actuales */
      })
      .catch(function(){self.setCloud('off');});
  },
  save:function(){this.saveLocal();if(this.cloud())this.pushDebounced();},
  pushDebounced:function(){var self=this;clearTimeout(self._t);self._t=setTimeout(function(){self.push();},700);},
  push:function(){
    var self=this;if(!self.cloud())return Promise.resolve();
    self.version=(self.version||0)+1;self.setCloud('sync');
    var body=JSON.stringify({id:1,data:self.data,version:self.version,updated_at:new Date().toISOString()});
    var hdr=self.headers();hdr['Prefer']='resolution=merge-duplicates,return=minimal';
    return fetch(self.rest()+SB.table+'?on_conflict=id',{method:'POST',headers:hdr,body:body})
      .then(function(r){self.setCloud(r.ok?'ok':'err');})
      .catch(function(){self.setCloud('off');});
  },
  reload:function(){
    var self=this;if(!self.cloud()){toast('No hay nube configurada');return;}
    self.setCloud('sync');
    fetch(self.rest()+SB.table+'?id=eq.1&select=data,version',{headers:self.headers()})
      .then(function(r){return r.json();})
      .then(function(rows){if(rows&&rows.length&&rows[0].data&&rows[0].data.facturas){self.data=rows[0].data;self.version=rows[0].version||0;self.saveLocal();self.setCloud('ok');UI.boot2();toast('Datos recargados de la nube');}else{self.setCloud('ok');toast('La nube está vacía; se subirán tus datos al guardar');self.push();}})
      .catch(function(){self.setCloud('off');toast('Sin conexión a la nube');});
  },
  lastSync:0,
  setCloud:function(st){
    var d=document.getElementById('cloudDot'),t=document.getElementById('cloudTxt');if(!d)return;
    if(st==='ok')this.lastSync=Date.now();
    var m={sync:['#f1c40f','sincronizando…'],ok:['#27ae60','en la nube'],err:['#c0392b','error nube'],off:['#95a5a6','sin conexión'],local:['#95a5a6','solo local']};
    var v=m[st]||m.local;d.style.background=v[0];
    if(t)t.textContent=(st==='ok')?this.syncTxt():v[1];
  },
  syncTxt:function(){
    if(!this.lastSync)return 'en la nube';
    var s=Math.floor((Date.now()-this.lastSync)/1000);
    if(s<60)return 'nube · recién';
    var mnt=Math.floor(s/60);if(mnt<60)return 'nube · hace '+mnt+' min';
    return 'nube · hace '+Math.floor(mnt/60)+' h';
  },
  updateSyncLabel:function(){var t=document.getElementById('cloudTxt');if(t&&this.lastSync&&this.cloud())t.textContent=this.syncTxt();},
  exportar:function(){
    var nm='caleva_respaldo_'+new Date().toISOString().slice(0,10)+'.json';
    saveFile(nm,JSON.stringify(this.data,null,1),'application/json').then(ok=>{if(ok)toast('Respaldo JSON guardado');});
  },
  importar:function(inp){
    var f=inp.files[0];if(!f)return;var r=new FileReader();var self=this;
    r.onload=function(){try{self.data=JSON.parse(r.result);self.save();UI.boot2();alert('Datos importados correctamente.');}catch(e){alert('Archivo inválido.');}};
    r.readAsText(f);inp.value='';
  },
  reset:function(){if(confirm('¿Volver a los datos originales? Se perderán los cambios locales no exportados.')){this.data=this.seed();this.save();UI.boot2();}}
};

/* ============ UTILIDADES ============ */
/* Cada 'factura' agrupa sus lineas HES (una factura = un No.Factura).
   Clasificacion validada contra DATOS por la columna STATUS (igual que la hoja ANALISIS). */
function esCobrada(f){return f.status==='Pagada';}
function esPorCobrar(f){return f.status!=='Pagada';}
function esParcial(f){return esPorCobrar(f) && (+f.pagos||0)>0.01;}
function money(n){n=+n||0;return '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function money0(n){n=+n||0;return '$'+n.toLocaleString('en-US',{maximumFractionDigits:0});}
function pct(n){return (Math.round((+n||0)*1000)/10)+'%';}
function fdate(s){if(!s)return '';var p=s.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s;}
function hoy(){return new Date();}
function diasEntre(iso){if(!iso)return null;var d=new Date(iso+'T00:00:00');return Math.floor((hoy()-d)/86400000);}
var MESES=['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

  dash:function(F){
    var n=F.length, pag=F.filter(esCobrada).length, pen=F.filter(esPorCobrar).length;
    var nHes=F.reduce((a,f)=>a+(f.nHes||0),0);
    var base=F.reduce((a,f)=>a+f.base,0), iva=F.reduce((a,f)=>a+f.iva,0), tot=F.reduce((a,f)=>a+f.total,0);
    var cob=F.reduce((a,f)=>a+f.pagos,0), pc=F.reduce((a,f)=>a+f.porCobrar,0);
    var k=[
      kpi('navy','Facturas',n,pag+' pagadas · '+pen+' pendientes · '+nHes+' HES'),
      kpi('blue','Base imponible',money0(base),'IVA '+money0(iva)),
      kpi('navy','Total facturado',money0(tot),'con IVA'),
      kpi('green','Cobrado',money0(cob),base>0?pct(cob/base)+' de la base':''),
      kpi('red','Por cobrar',money0(pc),pen+' facturas'),
      kpi('purple','% Cobranza',base>0?pct(cob/base):'0%','avance de recaudo')
    ].join('');
    // resumen por año
    var byY={};F.forEach(f=>{var y=f.anio;(byY[y]=byY[y]||{n:0,base:0,iva:0,tot:0,cob:0,pc:0});byY[y].n++;byY[y].base+=f.base;byY[y].iva+=f.iva;byY[y].tot+=f.total;byY[y].cob+=f.pagos;byY[y].pc+=f.porCobrar;});
    var ys=Object.keys(byY).sort();
    var rowsY=ys.map(y=>{var o=byY[y];var est=o.pc<1?'<span class="pill ok">Al día</span>':'<span class="pill pend">'+money0(o.pc)+'</span>';
      return '<tr><td><b>'+y+'</b></td><td class="num">'+o.n+'</td><td class="num">'+money(o.base)+'</td><td class="num">'+money(o.iva)+'</td><td class="num">'+money(o.tot)+'</td><td class="num">'+money(o.cob)+'</td><td class="num">'+money(o.pc)+'</td><td class="center">'+est+'</td></tr>';}).join('');
    var tblY='<div class="card"><div class="section-hdr">Resumen por año<span class="section-hdr-right">'+n+' facturas</span></div><div class="section-body"><table id="tY"><thead><tr>'+
      th('Año','tY',0)+th('Facturas','tY',1,1)+th('Base','tY',2,1)+th('IVA','tY',3,1)+th('Total','tY',4,1)+th('Cobrado','tY',5,1)+th('Por cobrar','tY',6,1)+'<th class="center">Estado</th></tr></thead><tbody>'+
      (rowsY||'<tr><td colspan="8" class="empty">Sin datos</td></tr>')+'</tbody></table></div></div>';
    // tendencia mensual (del año seleccionado, o el más reciente si "todos")
    var chart=this.tendencia(F);
    // alerta: vencidas y próximas a vencer (<=7 días)
    var P=F.filter(esPorCobrar);P.forEach(f=>f._m=diasEntre(f.fVenc));
    var venc=P.filter(f=>f._m!=null&&f._m>0), prox=P.filter(f=>f._m!=null&&f._m<=0&&f._m>=-7);
    var mV=venc.reduce((a,f)=>a+f.porCobrar,0), mP=prox.reduce((a,f)=>a+f.porCobrar,0);
    var alerta='';
    if(venc.length||prox.length){
      alerta='<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px">';
      if(venc.length)alerta+='<div onclick="UI.setFacFiltro(\'porcobrar\');UI.tab(\'facturas\',document.querySelector(\'.tab[data-tab=facturas]\'))" style="cursor:pointer;flex:1;min-width:240px;background:#fdecea;border-left:4px solid var(--red);border-radius:9px;padding:12px 16px"><div style="font-weight:700;color:var(--red);font-size:13px">⚠ '+venc.length+' factura(s) VENCIDAS</div><div style="font-size:12px;color:var(--navy2);margin-top:3px">'+money0(mV)+' por cobrar · clic para ver</div></div>';
      if(prox.length)alerta+='<div onclick="UI.setFacFiltro(\'porcobrar\');UI.tab(\'facturas\',document.querySelector(\'.tab[data-tab=facturas]\'))" style="cursor:pointer;flex:1;min-width:240px;background:#fef3e2;border-left:4px solid var(--orange);border-radius:9px;padding:12px 16px"><div style="font-weight:700;color:var(--orange);font-size:13px">⏰ '+prox.length+' factura(s) vencen en ≤7 días</div><div style="font-size:12px;color:var(--navy2);margin-top:3px">'+money0(mP)+' por cobrar · clic para ver</div></div>';
      alerta+='</div>';
    }
    document.getElementById('tab-dash').innerHTML=alerta+'<div class="kpis">'+k+'</div>'+tblY+chart;
  },
  tendencia:function(F){

/* ============ GENERADOR XLSX (JS puro, sin librerías, offline) ============ */
var Xlsx=(function(){
  var crcT=(function(){var t=[];for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
  function crc32(b){var c=0xFFFFFFFF;for(var i=0;i<b.length;i++)c=crcT[(c^b[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
  function bytes(s){return new TextEncoder().encode(s);}
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function col(n){var s='';n++;while(n>0){var m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26);}return s;}
  function sheetXml(headers,rows){
    var o='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
    var all=[headers].concat(rows);
    for(var r=0;r<all.length;r++){o+='<row r="'+(r+1)+'">';var row=all[r];
      for(var c=0;c<row.length;c++){var v=row[c];var ref=col(c)+(r+1);
        if(r>0&&typeof v==='number'&&isFinite(v))o+='<c r="'+ref+'"><v>'+v+'</v></c>';
        else o+='<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+esc(v)+'</t></is></c>';}
      o+='</row>';}
    return o+'</sheetData></worksheet>';
  }
  function zip(files){
    var chunks=[],central=[],off=0;
    function u16(n){return [n&255,(n>>8)&255];}function u32(n){return [n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];}
    files.forEach(function(f){
      var d=bytes(f.data),nm=bytes(f.name),crc=crc32(d);
      var loc=[].concat(u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(d.length),u32(d.length),u16(nm.length),u16(0));
      var h=new Uint8Array(loc.length+nm.length);h.set(loc,0);h.set(nm,loc.length);
      chunks.push(h,d);
      var cen=[].concat(u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(d.length),u32(d.length),u16(nm.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(off));
      var cb=new Uint8Array(cen.length+nm.length);cb.set(cen,0);cb.set(nm,cen.length);central.push(cb);
      off+=h.length+d.length;});
    var cs=central.reduce(function(a,c){return a+c.length;},0);
    var end=new Uint8Array([].concat(u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(cs),u32(off),u16(0)));
    var parts=chunks.concat(central,[end]);var tot=parts.reduce(function(a,p){return a+p.length;},0);
    var out=new Uint8Array(tot),pos=0;parts.forEach(function(p){out.set(p,pos);pos+=p.length;});return out;
  }
  function build(sheets){
    var f=[];
    f.push({name:'[Content_Types].xml',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+sheets.map(function(s,i){return '<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';}).join('')+'</Types>'});
    f.push({name:'_rels/.rels',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'});
    f.push({name:'xl/workbook.xml',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+sheets.map(function(s,i){return '<sheet name="'+esc(s.name)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>';}).join('')+'</sheets></workbook>'});
    f.push({name:'xl/_rels/workbook.xml.rels',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map(function(s,i){return '<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>';}).join('')+'</Relationships>'});
    sheets.forEach(function(s,i){f.push({name:'xl/worksheets/sheet'+(i+1)+'.xml',data:sheetXml(s.headers,s.rows)});});
    return zip(f);
  }
  return {build:build};
})();

/* ============ PROCESO: crear val, HES, facturar, pago ============ */
function pedNum(x){var s=String(x||'').trim();var p=s.indexOf('|');return p>0?s.slice(0,p).trim():s;}
function pedidosReales(){return (Store.data.pedidos||[]).filter(p=>/^\d+$/.test(pedNum(p.pedido)));}
function hesSet(){var s={};Store.data.facturas.forEach(f=>(f.lineas||[]).forEach(l=>{var h=String(l.hes||'').trim();if(h)s[h]=f.factura;}));return s;}
function estadoVal(v,hs){var h=String(v.hes||'').trim();if(!h)return 'Pendiente HES';return (String(v.fact||'').trim()||hs[h])?'Facturada':'Por facturar';}
function pedidoPorNum(num){return Store.data.pedidos.find(p=>pedNum(p.pedido)===pedNum(num));}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2600);}
function saveFile(name,data,mime){
  if(window.showSaveFilePicker){
    var ext=name.slice(name.lastIndexOf('.'));var acc={};acc[mime]=[ext];
    return window.showSaveFilePicker({suggestedName:name,types:[{description:name,accept:acc}]})
      .then(h=>h.createWritable()).then(w=>w.write(data).then(()=>w.close()).then(()=>true))
      .catch(e=>{if(e&&e.name==='AbortError')return false;dl();return true;});
  }
  return Promise.resolve(dl());
  function dl(){var blob=new Blob([data],{type:mime});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();return true;}
}

    if(dup)return {err:'La HES '+dup+' ya existe o está repetida.'};
    var n=0;rows.forEach(r=>{if(r.hes){var v=Store.data.valuaciones[r.idx];v.hes=r.hes;if(r.fechaHes)v.fechaHes=r.fechaHes;if(r.desc)v.desc=r.desc;v.estado='3. Con HES';n++;}});
    Store.save();return {n:n};
  },
  facturar:function(pedido,idxs,facturaNum,fecha,tasa){
    var ped=pedidoPorNum(pedido);if(!ped)return {err:'Pedido no encontrado.'};
    if(idxs.length===0)return {err:'No hay ítems seleccionados.'};
    if(idxs.length>13)return {err:'Máximo 13 HES por factura (límite de impresión).'};
    if(Store.data.facturas.some(f=>String(f.factura)===String(facturaNum)))return {err:'La factura '+facturaNum+' ya existe.'};
    var d=new Date(fecha+'T00:00:00');
    var venc=new Date(d.getTime()+ (ped.plazo||0)*86400000);
    var lineas=[],base=0,iva=0,total=0,islr=0,bi=0;
    idxs.forEach(i=>{var v=Store.data.valuaciones[i];var b=+v.montoUSD||0;var ii=Math.round(b*0.16*100)/100,is=Math.round(b*0.02*100)/100;
      base+=b;iva+=ii;total+=b+ii;islr+=is;bi+=b-is;
      lineas.push({hes:v.hes,desc:v.desc||ped.desc,base:Math.round(b*100)/100,estacion:v.estacion,val:v.val});});
    var r2=n=>Math.round(n*100)/100;
    var fobj={factura:String(facturaNum),fecha:fecha,anio:d.getFullYear(),mes:d.getMonth()+1,cliente:'Telefónica Venezolana C.A.',
      pedido:pedNum(pedido),descPedido:ped.desc,moneda:ped.moneda,tasa:+tasa||0,status:'Pendiente',
      fVenc:venc.toISOString().slice(0,10),fPago:'',base:r2(base),iva:r2(iva),total:r2(total),islr:r2(islr),baseIslr:r2(bi),
      pagos:0,porCobrar:r2(bi),lineas:lineas,nHes:lineas.length,origen:'app'};
    Store.data.facturas.push(fobj);
    idxs.forEach(i=>{Store.data.valuaciones[i].estado='4. Facturada';});
    // actualizar pedido: facturado + / disponible -
    ped.facturado=r2((+ped.facturado||0)+base);ped.disponible=r2((+ped.disponible||0)-base);if(ped.monto>0)ped.avance=r2(ped.facturado/ped.monto);
    Store.save();return {ok:fobj};
  },
  registrarPago:function(facturaNum,fecha,monto){
    var f=Store.data.facturas.find(x=>String(x.factura)===String(facturaNum));if(!f)return {err:'Factura no encontrada.'};
    var r2=n=>Math.round(n*100)/100;
    f.pagos=r2((+f.pagos||0)+(+monto||0));f.porCobrar=r2((+f.baseIslr||0)-f.pagos);f.fPago=fecha;
    if(f.porCobrar<=0.01){f.status='Pagada';f.porCobrar=0;}
    Store.save();return {ok:f};
  },
  eliminarFactura:function(fac){
    var i=Store.data.facturas.findIndex(x=>String(x.factura)===String(fac));if(i<0)return {err:'Factura no encontrada.'};
    var f=Store.data.facturas[i];var r2=n=>Math.round(n*100)/100;
    var ped=pedidoPorNum(f.pedido);
    if(ped){ped.facturado=r2((+ped.facturado||0)-f.base);ped.disponible=r2((+ped.disponible||0)+f.base);if(ped.monto>0)ped.avance=r2(ped.facturado/ped.monto);}
    var hesF={};(f.lineas||[]).forEach(l=>{var h=String(l.hes||'').trim();if(h)hesF[h]=1;});
    Store.data.valuaciones.forEach(v=>{var h=String(v.hes||'').trim();if(h&&hesF[h]){v.fact='';v.estado='3. Con HES';}});
    Store.data.facturas.splice(i,1);Store.save();return {ok:1};
  },
  editarValuacion:function(idx,c){
    var v=Store.data.valuaciones[idx];if(!v)return {err:'No encontrada.'};
    if(c.estacion!==undefined)v.estacion=c.estacion.trim();
    if(c.montoUSD!==undefined)v.montoUSD=+c.montoUSD||0;
    if(c.desc!==undefined)v.desc=c.desc;
    if(c.val!==undefined)v.val=c.val.trim();
    if(c.hes!==undefined)v.hes=c.hes.trim();
    if(c.fechaHes!==undefined)v.fechaHes=c.fechaHes;
    Store.save();return {ok:1};
  },
  eliminarValuacion:function(idx){
    var v=Store.data.valuaciones[idx];if(!v)return {err:'No encontrada.'};
    var hs=hesSet();var h=String(v.hes||'').trim();
    if(h&&(String(v.fact||'').trim()||hs[h]))return {err:'No se puede borrar: esta valuación ya está facturada. Elimine primero la factura '+(v.fact||hs[h])+'.'};
    Store.data.valuaciones.splice(idx,1);Store.save();return {ok:1};
  },
  crearPedido:function(o){
    if(!/^\d+$/.test(String(o.pedido)))return {err:'El N° de pedido debe ser numérico.'};
    if(Store.data.pedidos.some(p=>pedNum(p.pedido)===String(o.pedido)))return {err:'El pedido '+o.pedido+' ya existe.'};
    var r2=function(n){return Math.round((+n||0)*100)/100;};
    Store.data.pedidos.push({pedido:String(o.pedido),desc:o.desc||'',monto:r2(o.monto),moneda:o.moneda||'USD',plazo:+o.plazo||0,anticipo:r2(o.anticipo),facturado:0,disponible:r2(o.monto),avance:0,origen:'app'});
    Store.save();return {ok:1};
  }
};

    var al=venc.slice().sort((a,b)=>b._mora-a._mora);
    var alrows=al.map(f=>{var cl=f._mora>90?'venc':f._mora>30?'pend':'pend';
      return '<tr><td class="mono"><a class="flink" onclick="UI.verFactura(\''+f.factura+'\')">'+f.factura+'</a></td><td class="mono">'+f.pedido+'</td><td>'+(f.descPedido||'')+'</td><td class="num">'+money(f.porCobrar)+'</td><td class="center">'+fdate(f.fVenc)+'</td><td class="center"><span class="pill '+cl+'">'+f._mora+' d</span></td><td class="center"><button class="pay-btn" onclick="UI.abrirPago(\''+f.factura+'\')">Pago</button></td></tr>';}).join('');
    var talert='<div class="card"><div class="section-hdr" style="background:var(--red)">⚠ Facturas vencidas<span class="section-hdr-right">'+al.length+' vencidas · '+money0(mVenc)+'</span></div><div class="section-body"><table id="tVen"><thead><tr>'+th('Factura','tVen',0)+th('Pedido','tVen',1)+'<th>Descripción</th>'+th('Por cobrar','tVen',3,1)+'<th class="center">Vencim.</th>'+th('Mora','tVen',5,1)+'<th class="center">Acción</th></tr></thead><tbody>'+(alrows||'<tr><td colspan="7" class="empty">No hay facturas vencidas 🎉</td></tr>')+'</tbody></table></div></div>';
    return kp+'<div class="grid2">'+aging+proye+'</div>'+tped+talert;
  }
};

/* ---------- VISTA: MATRIZ DE VALUACIONES ---------- */
var Matriz={
  baseVal:function(v){return String(v||'').replace('*','').trim();},
  estadoNum:function(e){return e==='Facturada'?3:e==='Por facturar'?2:1;},
  render:function(){
    var hs=hesSet();var V=Store.data.valuaciones;
    var q=(document.getElementById('mxBuscar')?document.getElementById('mxBuscar').value:'').toLowerCase();
    // agregacion en una pasada
    var dE={},dV={},mState={},mTot={},sin=0,por=0,fac=0,uSin=0,uPor=0,uFac=0,uTot=0;
    V.forEach(v=>{
      var est=String(v.estacion||'').trim();if(!est)return;
      if(q && est.toLowerCase().indexOf(q)<0)return;
      var e=estadoVal(v,hs);var st=this.estadoNum(e);var mo=+v.montoUSD||0;
      var bv=this.baseVal(v.val);
      dE[est]=1;
      if(bv){ dV[bv]=bv; }
      uTot+=mo;
      if(st===3){fac++;uFac+=mo;}else if(st===2){por++;uPor+=mo;}else{sin++;uSin+=mo;}
      if(bv){var k=est+'|'+bv; if(st>(mState[k]||0))mState[k]=st;}
      mTot[est]=(mTot[est]||0)+mo;
    });
    var ests=Object.keys(dE).sort();
    var bases=Object.keys(dV).sort(function(a,b){var na=parseInt(String(a).replace(/[^0-9]/g,''))||0,nb=parseInt(String(b).replace(/[^0-9]/g,''))||0;return na-nb;});
    var kp='<div class="kpis">'+
      kpi('navy','Total ítems',(sin+por+fac),money0(uTot)+' USD')+
      kpi('red','Sin HES',sin,money0(uSin))+
      kpi('orange','Por facturar',por,money0(uPor))+
      kpi('green','Facturadas',fac,money0(uFac))+'</div>';
    // tabla matriz
    var head='<tr><th style="text-align:left">ESTACIÓN</th>'+bases.map(b=>'<th>'+dV[b]+'</th>').join('')+'<th>TOTAL USD</th></tr>';
    var body=ests.map(e=>{
      var tds=bases.map(b=>{var st=mState[e+'|'+b]||0;
        if(st===0)return '<td class="mcell m0">·</td>';
        var cls=st===3?'m3':st===2?'m2':'m1';
        return '<td class="mcell '+cls+'" style="cursor:pointer" title="Ver valuación" onclick="Matriz.verVal(\''+encodeURIComponent(e)+'\',\''+encodeURIComponent(b)+'\')">'+dV[b]+'</td>';}).join('');
      return '<tr><td class="est">'+e+'</td>'+tds+'<td class="num" style="font-weight:700">'+money(mTot[e]||0)+'</td></tr>';
    }).join('');
    var mtx='<div class="card"><div class="section-hdr">Matriz por estación<span class="section-hdr-right">'+ests.length+' estaciones · '+bases.length+' valuaciones</span></div><div class="section-body">'+
      '<div class="toolbar"><input id="mxBuscar" placeholder="Filtrar estación..." style="min-width:220px" oninput="Matriz.render()"></div>'+
      '<div class="mleg"><span><i style="background:var(--green)"></i>Facturada</span><span><i style="background:var(--orange)"></i>Con HES por facturar</span><span><i style="background:var(--red)"></i>Sin HES (esperando)</span></div>'+
      '<div style="overflow:auto;max-height:70vh"><table class="mtx">'+head+body+'</table></div></div></div>';
    // pendientes por facturar (no facturadas), ordenados por antiguedad
    var pend=V.map((v,i)=>({v:v,i:i,e:estadoVal(v,hs)})).filter(o=>o.e!=='Facturada'&&String(o.v.estacion||'').trim());
    pend.forEach(o=>o.d=diasEntre(o.v.fecha));
    pend.sort((a,b)=>(b.d||-1)-(a.d||-1));
    var prows=pend.map(o=>{var sit=o.e==='Por facturar'?'<span class="badge2 b2">Con HES - lista para facturar</span>':'<span class="badge2 b1">Esperando HES del cliente</span>';
      var dd=o.d==null?'—':(o.d>60?'<b style="color:var(--red)">'+o.d+'</b>':o.d);
      return '<tr><td>'+o.v.estacion+'</td><td class="center">'+o.v.val+'</td><td class="mono">'+pedNum(o.v.pedido)+'</td><td class="num">'+money(o.v.montoUSD)+'</td><td class="mono">'+(o.v.hes||'—')+'</td><td class="center">'+fdate(o.v.fecha)+'</td><td class="center">'+dd+'</td><td>'+sit+'</td></tr>';}).join('');
    var tpen='<div class="card"><div class="section-hdr">Pendientes por facturar<span class="section-hdr-right">ordenados por antigüedad · '+pend.length+' ítems</span></div><div class="section-body"><table id="tPen"><thead><tr>'+
      '<th>Estación</th><th class="center">Val</th><th>Pedido</th>'+th('Monto','tPen',3,1)+'<th>HES</th><th class="center">Fecha val</th>'+th('Días','tPen',6,1)+'<th>Situación</th></tr></thead><tbody>'+
      (prows||'<tr><td colspan="8" class="empty">No hay valuaciones pendientes por facturar. ¡Todo facturado!</td></tr>')+'</tbody></table></div></div>';
    document.getElementById('tab-matriz').innerHTML=kp+mtx+tpen;
    var mb=document.getElementById('mxBuscar');if(mb)mb.value=q;
  },
  verVal:function(estEnc,baseEnc){
    var est=decodeURIComponent(estEnc),base=decodeURIComponent(baseEnc);var hs=hesSet();
    var items=Store.data.valuaciones.filter(v=>String(v.estacion||'').trim()===est && this.baseVal(v.val)===base);
    if(!items.length)return;
    var cont=items.map(v=>{
      var e=estadoVal(v,hs);var bcl=e==='Facturada'?'b3':e==='Por facturar'?'b2':'b1';
      var facNum=String(v.fact||'').trim()||hs[String(v.hes||'').trim()]||'';
      var f=facNum?Store.data.facturas.find(x=>String(x.factura)===String(facNum)):null;
      var fbloc=f?('<div class="info-pedido" style="margin-top:8px"><span>Factura <b class="flink" onclick="UI.cerrarModal();UI.verFactura(\''+f.factura+'\')">'+f.factura+'</b></span><span>Estado <b>'+f.status+'</b></span><span>Fecha <b>'+fdate(f.fecha)+'</b></span><span>Vence <b>'+fdate(f.fVenc)+'</b></span>'+(f.fPago?'<span>Pago <b>'+fdate(f.fPago)+'</b></span>':'')+'<span>Saldo <b style="color:'+(f.porCobrar>0.01?'var(--red)':'var(--green)')+'">'+money(f.porCobrar)+'</b></span></div>'):(facNum?('<div class="hint">Factura '+facNum+' no está en el periodo activo cargado.</div>'):'');
      return '<div style="border:1px solid var(--bd);border-radius:9px;padding:12px 14px;margin-bottom:10px">'+
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><b style="font-size:13px">'+v.val+' · '+est+'</b><span class="badge2 '+bcl+'">'+e+'</span></div>'+
        '<div class="info-pedido" style="margin:0"><span>Pedido <b>'+pedNum(v.pedido)+'</b></span><span>Monto <b>'+money(v.montoUSD)+'</b></span><span>Fecha val <b>'+fdate(v.fecha)+'</b></span><span>HES <b>'+(v.hes||'—')+'</b></span>'+(v.fechaHes?'<span>Fecha HES <b>'+fdate(v.fechaHes)+'</b></span>':'')+'</div>'+
        (v.desc?'<div class="hint" style="margin-top:6px">'+v.desc+'</div>':'')+fbloc+'</div>';
    }).join('');
    document.getElementById('modalTit').textContent='Valuación '+base+' · '+est;
    document.getElementById('modalBody').innerHTML=cont+'<div class="frow" style="margin-top:4px"><button class="btn gr" onclick="UI.cerrarModal()">Cerrar</button></div>';
    document.getElementById('modalBg').classList.add('on');
  }
};
function badge(v,l,c){return '<div class="header-badge '+(c||'')+'"><div class="val">'+v+'</div><div class="lbl">'+l+'</div></div>';}
function kpi(c,l,v,s){return '<div class="kpi '+c+'"><div class="kpi-lbl">'+l+'</div><div class="kpi-val">'+v+'</div><div class="kpi-sub">'+(s||'')+'</div></div>';}
function th(t,tbl,c,n){return '<th onclick="srt(\''+tbl+'\','+c+(n?',1':'')+')">'+t+'</th>';}
function srt(t,c,n){var tb=document.getElementById(t).tBodies[0];var rs=[...tb.rows].filter(r=>!r.classList.contains('tfoot-row')&&!r.querySelector('.empty'));if(!rs.length)return;tb._d=tb._d||{};var a=!tb._d[c];tb._d={};tb._d[c]=a;
  rs.sort((x,y)=>{var p=x.cells[c].innerText.replace(/[$,%\s]/g,''),q=y.cells[c].innerText.replace(/[$,%\s]/g,'');if(n){p=parseFloat(p)||0;q=parseFloat(q)||0;return a?p-q:q-p;}return a?p.localeCompare(q):q.localeCompare(p);});
  rs.forEach(r=>tb.appendChild(r));}
UI.boot();
</script>
