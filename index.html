<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caleva Suite</title>
<style>
:root{--navy:#1a2e4a;--navy2:#2c4a6e;--blue:#2e6da4;--cyan:#4fc3f7;--bg:#eef1f5;--card:#fff;
--line:#c5d8ec;--line2:#a9c4e0;--txt:#1a2533;--txt2:#4a6280;--txt3:#7a90a8;
--ok:#27ae60;--okbg:#e8f7ee;--accbg:#e8f0f9;--bad:#c0392b;--r:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
.top{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:16px 26px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;box-shadow:0 2px 12px rgba(26,46,74,.25)}
.brand{display:flex;align-items:center;gap:13px}
.brand img{height:42px;background:#fff;padding:5px 8px;border-radius:8px;display:block}
.brand .t b{font-size:16px;font-weight:700;display:block;line-height:1.2}
.brand .t span{font-size:11px;color:#bcd3ea}
.uwrap{display:none;align-items:center;gap:9px;font-size:12px}
.uwrap.on{display:flex}
.uwrap .em{color:#dbe7f5}
.uwrap .rol{background:#fff;color:var(--navy);padding:2px 9px;border-radius:11px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}
.uwrap .rol.super{background:var(--cyan);color:var(--navy)}
.btn{padding:7px 14px;border:1px solid var(--line2);background:#fff;color:var(--txt);border-radius:8px;cursor:pointer;font-weight:600;font-size:13px}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.5);color:#fff}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
.wrap{max-width:920px;margin:0 auto;padding:30px 22px 50px}
.lead{font-size:12px;color:var(--txt2);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.app{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;transition:.15s;box-shadow:0 1px 6px rgba(26,46,74,.08)}
.app.able{cursor:pointer}
.app.able:hover{border-color:var(--blue);box-shadow:0 6px 20px rgba(26,46,74,.16);transform:translateY(-2px)}
.app.locked{opacity:.6}
.app .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.app .ic{width:44px;height:44px;border-radius:10px;background:var(--accbg);display:flex;align-items:center;justify-content:center;font-size:22px}
.badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:7px;text-transform:uppercase;letter-spacing:.3px}
.badge.admin{background:var(--okbg);color:#0f6e56}
.badge.acc{background:var(--accbg);color:#185fa5}
.badge.ro{background:#eef3f8;color:#4a6280}
.badge.no{background:#fbeceb;color:var(--bad)}
.app h3{font-size:15px;font-weight:700;margin-bottom:4px}
.app p{font-size:12px;color:var(--txt3);line-height:1.5;flex:1}
.app .go{margin-top:14px;text-align:center;font-size:13px;font-weight:700;padding:8px;border-radius:8px;background:var(--blue);color:#fff}
.app.locked .go{background:#e3e9f0;color:#9db0c4}
.app.soon{border-style:dashed;background:#f4f7fb;align-items:center;justify-content:center;text-align:center;min-height:172px}
.app.soon .ic{background:#e8eef6;font-size:20px}
.app.soon .lab{font-size:13px;font-weight:600;color:var(--txt2);margin-top:8px}
.foot{margin-top:24px;font-size:11.5px;color:var(--txt3);display:flex;align-items:center;gap:7px}
#loginBg{display:none;position:fixed;inset:0;background:linear-gradient(135deg,var(--navy),var(--blue));z-index:100;align-items:center;justify-content:center;padding:20px}
#loginBg.on{display:flex}
.lg{background:#fff;border-radius:14px;padding:30px 26px;width:min(374px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.42)}
.lg img{display:block;margin:0 auto 16px;height:46px}
.lg h2{color:var(--navy);font-size:19px;text-align:center;margin-bottom:3px}
.lg .sub{color:var(--txt2);font-size:12px;text-align:center;margin-bottom:20px}
.lg label{display:block;font-size:11px;color:var(--txt2);text-transform:uppercase;font-weight:600;margin-bottom:4px;letter-spacing:.5px}
.lg input{width:100%;padding:10px 12px;border:1px solid var(--line2);border-radius:8px;font-size:14px;margin-bottom:13px}
.lg input:focus{outline:2px solid var(--cyan);border-color:var(--cyan)}
.lg .msg{color:var(--bad);font-size:12px;min-height:16px;text-align:center;margin-bottom:6px}
.lg .hint{text-align:center;margin-top:13px;font-size:11px;color:var(--txt3)}
.spin{text-align:center;color:var(--txt3);padding:40px;font-size:13px}
</style>
</head>

    <h2>Caleva Suite</h2>
    <div class="sub">Acceso restringido a usuarios autorizados</div>
    <label>Correo</label><input id="lgEmail" type="email" autocomplete="username" placeholder="usuario@corpcaleva.com">
    <label>Contraseña</label><input id="lgPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <div id="lgMsg" class="msg"></div>
    <button class="btn p" id="lgBtn" onclick="doLogin()" style="width:100%">Entrar</button>

<script>
var SB={ url:'https://pcuxjtfptktqnztxftwa.supabase.co', key:'sb_publishable_-rPzrunPj0dxl9BpaVjf0w_fDXMgLoB' };
var KEY='caleva_session';
function rest(){return SB.url.replace(/\/+$/,'')+'/rest/v1/';}
function authBase(){return SB.url.replace(/\/+$/,'');}
function getS(){try{return JSON.parse(localStorage.getItem(KEY));}catch(e){return null;}}
function setS(s){try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){}}
function clrS(){try{localStorage.removeItem(KEY);}catch(e){}}
function tok(){var s=getS();return s&&s.access_token;}
function uid(){var s=getS();return s&&s.user&&s.user.id;}
function email(){var s=getS();return s&&s.user&&s.user.email;}
function expired(){var s=getS();if(!s||!s.access_token)return true;return ((s.expires_at||0)*1000-Date.now())<60000;}
function hdrs(){return {'apikey':SB.key,'Authorization':'Bearer '+(tok()||SB.key),'Content-Type':'application/json'};}

var APPS=[
 {key:'seguimiento',name:'Seguimiento Caleva',desc:'Valuaciones, HES y facturación de obra',icon:'📊',path:'seguimiento/'},
 {key:'nomina',name:'Nómina Caleva',desc:'Quincenas, personal, préstamos y pagos móviles',icon:'💵',path:'nomina/'}
];
var ACCESS={};

function login(em,pw){
  return fetch(authBase()+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':SB.key,'Content-Type':'application/json'},body:JSON.stringify({email:em,password:pw})})
    .then(function(r){return r.json();}).then(function(d){
      if(d&&d.access_token){if(!d.expires_at)d.expires_at=Math.floor(Date.now()/1000)+(d.expires_in||3600);setS(d);return {ok:true};}
      return {err:(d&&(d.error_description||d.msg||d.error))||'Correo o contraseña incorrectos'};
    }).catch(function(){return {err:'Sin conexión con el servidor'};});
}
function refresh(){
  var s=getS(); if(!s||!s.refresh_token)return Promise.resolve(false);
  return fetch(authBase()+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'apikey':SB.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})})
    .then(function(r){return r.json();}).then(function(d){if(d&&d.access_token){if(!d.expires_at)d.expires_at=Math.floor(Date.now()/1000)+(d.expires_in||3600);setS(d);return true;}clrS();return false;}).catch(function(){return false;});
}
function logout(){var t=tok();clrS();if(t){try{fetch(authBase()+'/auth/v1/logout',{method:'POST',headers:{'apikey':SB.key,'Authorization':'Bearer '+t}});}catch(e){}}location.reload();}

function segAccess(sa,row){
  if(sa)return {ok:true,badge:'admin',lbl:'Admin'};
  if(!row)return {ok:false,badge:'no',lbl:'Sin acceso'};
  if(row.rol==='admin')return {ok:true,badge:'admin',lbl:'Admin'};
  var ver=(row.permisos&&row.permisos.ver)||{}, edt=(row.permisos&&row.permisos.editar)||{};
  if(Object.keys(ver).length) return {ok:true,badge:(Object.keys(edt).length?'acc':'ro'),lbl:(Object.keys(edt).length?'Acceso':'Solo lectura')};
  return {ok:false,badge:'no',lbl:'Sin acceso'};
}
function nomAccess(sa,row){
  if(sa)return {ok:true,badge:'admin',lbl:'Admin'};
  var r=row&&row.rol;
  if(r==='admin')return {ok:true,badge:'admin',lbl:'Admin'};
  if(r==='nomina')return {ok:true,badge:'acc',lbl:'Acceso'};
  if(r==='gerencia')return {ok:true,badge:'ro',lbl:'Solo lectura'};
  return {ok:false,badge:'no',lbl:'Sin acceso'};
}
function resolver(cb){
  fetch(rest()+'rpc/es_suite_admin',{method:'POST',headers:hdrs(),body:'{}'})
    .then(function(r){return r.ok?r.json():false;})
    .then(function(sa){
      sa=!!sa;
      Promise.all([
        fetch(rest()+'perfiles?user_id=eq.'+encodeURIComponent(uid())+'&select=rol,permisos',{headers:hdrs()}).then(function(r){return r.ok?r.json():[];}).catch(function(){return [];}),
        fetch(rest()+'perfiles_nomina?user_id=eq.'+encodeURIComponent(uid())+'&select=rol',{headers:hdrs()}).then(function(r){return r.ok?r.json():[];}).catch(function(){return [];})
      ]).then(function(res){
        ACCESS.seguimiento=segAccess(sa,(res[0]&&res[0][0])||null);
        ACCESS.nomina=nomAccess(sa,(res[1]&&res[1][0])||null);
        cb(sa);
      });
    }).catch(function(){ACCESS.seguimiento={ok:false,badge:'no',lbl:'Sin acceso'};ACCESS.nomina={ok:false,badge:'no',lbl:'Sin acceso'};cb(false);});
}
function abrir(path,able){ if(able) location.href=path; }
function pintar(sa){
  document.getElementById('uwrap').classList.add('on');
  document.getElementById('uEmail').textContent=email()||'';
  var rp=document.getElementById('uRol'); rp.textContent=sa?'Super-admin':'Usuario'; rp.className='rol'+(sa?' super':'');
  var html=APPS.map(function(a){
    var ac=ACCESS[a.key]||{ok:false,badge:'no',lbl:'Sin acceso'};
    var cls='app '+(ac.ok?'able':'locked');
    var onclick=ac.ok?(' onclick="abrir(\''+a.path+'\','+true+')"'):'';
    return '<div class="'+cls+'"'+onclick+'>'
      +'<div class="hd"><div class="ic">'+a.icon+'</div><span class="badge '+ac.badge+'">'+ac.lbl+'</span></div>'
      +'<h3>'+a.name+'</h3><p>'+a.desc+'</p>'
      +'<div class="go">'+(ac.ok?'Abrir':'Sin acceso')+'</div></div>';
  }).join('');
  html+='<div class="app soon"><div class="ic">＋</div><div class="lab">Próximamente</div><p style="flex:none">Nuevas apps Caleva</p></div>';
  document.getElementById('grid').innerHTML=html;
}
function showLogin(){document.getElementById('loginBg').classList.add('on');var e=document.getElementById('lgEmail');if(e)e.focus();}
function hideLogin(){document.getElementById('loginBg').classList.remove('on');}
function doLogin(){
  var em=document.getElementById('lgEmail').value.trim(), pw=document.getElementById('lgPass').value;
  var msg=document.getElementById('lgMsg'), btn=document.getElementById('lgBtn');
  msg.textContent='';btn.disabled=true;btn.textContent='Entrando…';
  login(em,pw).then(function(r){
    btn.disabled=false;btn.textContent='Entrar';
    if(r.ok){hideLogin();resolver(pintar);} else msg.textContent=r.err||'No se pudo iniciar sesión';
  });
}
function boot(){
  if(!getS()||expired()){ refresh().then(function(ok){ ok?resolver(pintar):showLogin(); }); }
  else resolver(pintar);
}
boot();
</script>
</body>
