<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caleva Suite · Cuentas por Pagar</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">

<style>
/* Fuentes incrustadas mas abajo: sin peticiones externas. */
body,button,input,select,textarea,table,th,td,h1,h2,h3,h4{font-family:Barlow,"Segoe UI",system-ui,-apple-system,sans-serif!important}
/* La factura se imprime sobre papel preimpreso: su reticula esta calculada
   con estas metricas, asi que su tipografia NO se toca. Solo se
   repiten los selectores a los que llegaba la regla global: la hoja
   y el resto de sus elementos siguen heredando Tahoma. */
#facturaPrint table,#facturaPrint th,#facturaPrint td{font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif!important}</style>
<style>
:root{--navy:#1a2e4a;--navy2:#2c4a6e;--blue:#2e6da4;--green:#27ae60;--red:#c0392b;--orange:#e67e22;--purple:#8e44ad;--cyan:#4fc3f7;--bg:#eef1f5;--bd:#c5d8ec;--ink:#1a2533;--mut:#7a90a8}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Barlow,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:13px}
.top-header{background:linear-gradient(135deg,var(--navy),var(--blue));padding:16px 30px;color:#fff;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;box-shadow:0 2px 12px rgba(26,46,74,.25)}
.top-header h1{font-size:19px;font-weight:700}
.top-header p{font-size:11px;opacity:.82;margin-top:3px}
.brandbox{display:flex;align-items:center;gap:14px}
.brand-logo{height:44px;display:block}
.header-badges{display:flex;gap:9px;flex-wrap:wrap}
.header-badge{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);border-radius:10px;padding:8px 15px;text-align:center;white-space:nowrap}
.header-badge .val{font-size:17px;font-weight:700}
.header-badge .lbl{font-size:9px;opacity:.85;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.header-badge.rojo{background:rgba(192,57,43,.28);border-color:rgba(192,57,43,.5)}
.header-badge.verde{background:rgba(39,174,96,.25);border-color:rgba(39,174,96,.5)}
.tabs{display:flex;background:var(--navy);padding:0 30px;gap:2px;overflow-x:auto;position:sticky;top:0;z-index:50}
.tab{padding:12px 20px;cursor:pointer;color:#aac4e0;font-size:12px;font-weight:600;border-bottom:3px solid transparent;transition:.18s;user-select:none;white-space:nowrap}
.tab:hover{color:#fff;background:rgba(255,255,255,.05)}
.tab.active{color:#fff;border-bottom-color:var(--cyan)}
.tab.soon{opacity:.5;cursor:default}
.tab.soon:hover{background:none;color:#aac4e0}
.wrap{padding:20px 30px;max-width:1500px;margin:0 auto}
.panel{display:none}.panel.active{display:block}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar select,.toolbar input{padding:7px 11px;border:1px solid var(--bd);border-radius:7px;font-size:12px;background:#fff}
.btn{padding:7px 14px;border:none;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;color:#fff;background:var(--blue)}
.btn:hover{filter:brightness(1.08)}
.btn.g{background:var(--green)}.btn.o{background:var(--orange)}.btn.gr{background:#5a7089}.btn.r{background:var(--red)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:#fff;border-radius:10px;padding:14px 16px;border-left:4px solid var(--navy);box-shadow:0 1px 5px rgba(26,46,74,.08)}
.kpi.red{border-left-color:var(--red)}.kpi.green{border-left-color:var(--green)}.kpi.orange{border-left-color:var(--orange)}.kpi.navy{border-left-color:var(--navy)}.kpi.purple{border-left-color:var(--purple)}.kpi.blue{border-left-color:var(--blue)}
.kpi-lbl{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.kpi-val{font-size:22px;font-weight:700;margin-top:5px}
.kpi-sub{font-size:10.5px;color:var(--mut);margin-top:3px}
.card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 6px rgba(26,46,74,.08);margin-bottom:20px}
.section-hdr{background:var(--navy);color:#fff;padding:11px 16px;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.section-hdr-right{font-size:11px;opacity:.78;font-weight:400}
.section-body{padding:14px 16px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#eef3f8;color:var(--navy2);font-size:10px;font-weight:700;padding:8px 9px;text-align:left;text-transform:uppercase;border-bottom:2px solid var(--bd);white-space:nowrap;cursor:pointer}
th:hover{background:#dce9f5}
td{padding:7px 9px;border-bottom:1px solid var(--bg)}
tr:hover td{background:#f6fafd}
.mono{font-family:Consolas,monospace;font-size:11px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.center{text-align:center}
.tfoot-row td{background:#eef3f8;font-weight:700;color:var(--navy);border-top:2px solid var(--bd)}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700}
.pill.ok{background:#eafaf1;color:var(--green)}
.pill.pend{background:#fef3e2;color:var(--orange)}
.pill.venc{background:#fdecea;color:var(--red)}
.bars{display:flex;align-items:flex-end;gap:6px;height:170px;padding:10px 4px 0}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.bar-stack{width:100%;max-width:46px;display:flex;flex-direction:column;justify-content:flex-end;flex:1}
.bar-seg{width:100%}
.bar-lbl{font-size:9.5px;color:var(--mut);white-space:nowrap}
.bar-val{font-size:9px;color:var(--navy2);font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:10.5px;color:var(--navy2);margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.foot{text-align:center;color:var(--mut);font-size:10.5px;padding:16px}
.empty{padding:26px;text-align:center;color:var(--mut);font-style:italic}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.tab.proc{color:#ffd98a}.tab.proc.active{color:#fff;border-bottom-color:#f1c40f}
.tabsep{width:1px;background:rgba(255,255,255,.18);margin:8px 6px}
.form{background:#fff;border-radius:10px;padding:18px;box-shadow:0 1px 6px rgba(26,46,74,.08);margin-bottom:20px}
.form h3{font-size:14px;color:var(--navy);margin-bottom:14px}
.frow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:10px;color:var(--mut);text-transform:uppercase;font-weight:600;letter-spacing:.3px}
.fld input,.fld select{padding:8px 11px;border:1px solid var(--bd);border-radius:7px;font-size:13px;background:#fff;min-width:130px}
.fld input:focus,.fld select:focus{outline:2px solid var(--cyan);border-color:var(--cyan)}
.fld .wide{min-width:280px}
.itemtbl{width:100%;border-collapse:collapse;margin:8px 0 4px}
.itemtbl th{background:#eef3f8;font-size:9.5px;padding:6px 8px}
.itemtbl td{padding:4px 6px;border-bottom:1px solid var(--bg)}
.itemtbl input{width:100%;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;font-size:12px}
.chk{width:17px;height:17px;cursor:pointer;accent-color:var(--green)}
.hint{font-size:11px;color:var(--mut);margin-top:4px}
.badge2{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700}
.badge2.b1{background:#fdecea;color:var(--red)}.badge2.b2{background:#fef3e2;color:var(--orange)}.badge2.b3{background:#eafaf1;color:var(--green)}
.info-pedido{background:#eef3f8;border-radius:8px;padding:10px 14px;font-size:12px;color:var(--navy2);display:flex;gap:22px;flex-wrap:wrap;margin-bottom:12px}
.info-pedido b{color:var(--navy)}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(26,46,74,.55);z-index:200;align-items:flex-start;justify-content:center;overflow-y:auto;padding:18px 0}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:12px;width:min(520px,94vw);box-shadow:0 10px 40px rgba(0,0,0,.3);overflow:hidden;max-height:92vh;display:flex;flex-direction:column;margin:auto}
.modal .mh{background:var(--navy);color:#fff;padding:13px 18px;font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;flex:0 0 auto}
.modal .mh .x{cursor:pointer;opacity:.8}.modal .mh .x:hover{opacity:1}
.modal .mb{padding:18px;overflow-y:auto;flex:1 1 auto}
.pay-btn{padding:4px 10px;border:none;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;background:var(--green);color:#fff}
.flink{cursor:pointer;color:var(--blue);font-weight:700;text-decoration:underline}
.flink:hover{color:var(--navy)}
.mtx{border-collapse:collapse;font-size:11px}
.mtx th{background:var(--navy);color:#fff;padding:7px 9px;font-size:10px;text-transform:none;position:sticky;top:0}
.mtx td{padding:5px 7px;border:1px solid #e3ebf3;text-align:center}
.mtx td.est{text-align:left;font-weight:700;white-space:nowrap;background:#f6fafd}
.mcell{color:#fff;font-weight:700;border-radius:0}
.m1{background:var(--red)}.m2{background:var(--orange)}.m3{background:var(--green)}.m0{background:#f4f7fa;color:transparent}
.mtx tr:hover td.est{background:#dbe7f4}
.mtx tr:hover td.m1{background:#a5281c}.mtx tr:hover td.m2{background:#cf6a12}.mtx tr:hover td.m3{background:#1e8a4c}
.mtx tr:hover td.m0{background:#e9eef4}
.mtx td.mcell{transition:filter .1s}.mtx td.mcell:hover{filter:brightness(1.12);outline:2px solid var(--navy);outline-offset:-2px}
.section-body{-webkit-overflow-scrolling:touch}
html{-webkit-text-size-adjust:100%}
@media print{
  @page{margin:12mm}
  .tabs,.toolbar,.foot,.modal-bg,.toast,.pay-btn,.btn,#cloudWrap{display:none!important}
  .top-header{box-shadow:none;background:#1a2e4a!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .panel{display:none!important}
  .panel.active{display:block!important}
  body{background:#fff}
  .wrap{padding:0;max-width:100%}
  .card,.kpi{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  .section-hdr,.mcell,.pill,.badge2,th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table{font-size:10px}
  /* impresión de la FACTURA: solo se ve la hoja de factura */
  body.printing-fac>*:not(#facturaPrint){display:none!important}
  body.printing-fac #facturaPrint{position:static!important;left:0!important;width:100%!important}
  body.printing-fac .fac-overlay{display:none!important}
}
@page fac{size:letter portrait;margin:1.2cm}
@media(max-width:640px){
  .top-header{padding:11px 14px;gap:10px}
  .top-header h1{font-size:15px}.top-header p{font-size:10px}
  .header-badges{gap:6px;width:100%}
  .header-badge{padding:6px 10px;flex:1;min-width:0}
  .header-badge .val{font-size:14px}.header-badge .lbl{font-size:8px}
  .tabs{padding:0 8px}
  .tab{padding:11px 13px;font-size:11.5px}
  .tabsep{display:none}
  .wrap{padding:12px 10px}
  .toolbar{gap:7px}
  .toolbar input,.toolbar select{font-size:12.5px;padding:8px 9px;flex:1;min-width:120px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(45%,1fr));gap:9px}
  .kpi{padding:11px 12px}.kpi-val{font-size:18px}
  .grid2{grid-template-columns:1fr}
  table{font-size:11.5px}
  th,td{padding:7px 7px}
  .section-hdr{font-size:12px;padding:10px 12px}
  .section-body{padding:11px 9px}
  .btn{padding:9px 13px;font-size:12.5px}
  .form{padding:14px 12px}
  .frow{flex-direction:column;align-items:stretch;gap:10px}
  .fld{width:100%}
  .fld input,.fld select,.fld .wide{min-width:0;width:100%;box-sizing:border-box}
  .modal{width:95vw}
  .info-pedido{gap:12px;font-size:11.5px}
  .pay-btn{padding:6px 11px}
}
.mleg{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--navy2);margin:4px 0 10px}
.mleg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 22px;border-radius:9px;font-size:13px;z-index:300;box-shadow:0 6px 24px rgba(0,0,0,.3);opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
.login-bg{display:none;position:fixed;inset:0;background:linear-gradient(135deg,var(--navy),var(--blue));z-index:400;align-items:center;justify-content:center;padding:20px}
.login-bg.on{display:flex}
.login-card{background:#fff;border-radius:14px;padding:26px 24px;width:min(360px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.4)}
.login-card h2{color:var(--navy);font-size:18px;text-align:center;margin-bottom:16px}
.login-card .fld{display:block;margin-bottom:12px}
.login-card .fld label{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;font-weight:600;margin-bottom:4px}
.login-card .fld input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;font-size:14px}
.login-card .fld input:focus{outline:2px solid var(--cyan);border-color:var(--cyan)}
.login-msg{color:var(--red);font-size:12px;min-height:16px;margin:2px 0 8px;text-align:center}
/* ---- control de acceso por permisos (se OCULTA lo que el usuario no puede) ---- */
body:not(.can-val) .req-edit-val{display:none!important}
body:not(.can-pedidos) .req-edit-pedidos{display:none!important}
body:not(.can-facturas) .req-edit-facturas{display:none!important}
body:not(.can-hes) .req-edit-hes{display:none!important}
body:not(.can-fact) .req-edit-fact{display:none!important}
body:not(.is-admin) .req-admin{display:none!important}
/* usuarios no-admin: en la barra superior solo la tasa BCV, ocultar KPIs generales */
body:not(.is-admin) #hdrBadges{display:none!important}
/* --- Editor de factura imprimible --- */
.fac-overlay{display:none;position:fixed;inset:0;background:rgba(26,46,74,.6);z-index:250;overflow:auto;padding:18px}
.fac-overlay.on{display:block}
.fac-editor{background:#fff;max-width:900px;margin:0 auto;border-radius:10px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.fac-editor .mh{background:var(--navy);color:#fff;padding:12px 18px;font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.fac-editor .mb{padding:16px 18px}
.fac-editrow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
.fac-editrow .fld input{min-width:110px}
.fac-itbl{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0}
.fac-itbl th{background:#eef3f8;color:var(--navy2);font-size:10px;padding:6px 6px;border-bottom:2px solid var(--bd)}
.fac-itbl td{padding:3px 4px;border-bottom:1px solid var(--bg)}
.fac-itbl input{width:100%;padding:5px 6px;border:1px solid var(--bd);border-radius:5px;font-size:12px;text-align:right}
.fac-itbl input.txt{text-align:left}
.fac-tot-edit{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:8px}
.fac-tot-edit .fld{width:150px}
/* --- Hoja de factura para impresión (copia exacta del formato Caleva) --- */
#facturaPrint{position:fixed;left:-99999px;top:0;width:216mm;font-family:Tahoma,Arial,sans-serif;color:#000;background:#fff}
#facturaPrint table{border-collapse:collapse;table-layout:fixed;width:202mm;margin-left:6mm}
#facturaPrint td{font-size:8pt;padding:0 2px;vertical-align:middle;overflow:hidden;line-height:1.05;border:0;background:#fff}
#facturaPrint tr:hover td{background:#fff}
#facturaPrint .fx-c{text-align:center}
#facturaPrint .fx-r{text-align:right}
#facturaPrint .fx-l{text-align:left}
#facturaPrint .fx-b{font-weight:bold}
#facturaPrint .fx-title{font-size:20pt;text-align:center}
#facturaPrint .fx-big{font-size:10pt}
#facturaPrint .fx-cli{font-size:11pt}
</style>
<style id="ds-informe">
/* ═══════════════════════════════════════════════════════════════════════
   CALEVA · SEGUIMIENTO — capa «C · Informe»
   Sustituye a ds-fintech. Tufte + rigor editorial: la jerarquía la
   construyen reglas tipográficas y espacio, no sombras ni cápsulas.
   Paleta congelada — _redesign/brand-spec.md §3
   Es una CAPA: la hoja base sigue debajo y sirve de red de seguridad.
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  --navy:#002E5B;--navy2:#10171E;--blue:#1E5AA8;--cyan:#4A7CB5;
  --green:#0a8f5b;--red:#e11d48;--orange:#f59e0b;--purple:#7c3aed;
  --bg:#F5F6F7;--bd:#DCE3E9;--ink:#10171E;--mut:#5B6B7A;
  --rule:#D3DCE4;--hair:#edf2f6;--mut3:#8896A4;
  /* variantes legibles sobre el azul oscuro de la cabecera */
  --on-navy:#c3cfef;--green-hdr:#5ee9b5;
  /* Un rojo puro no alcanza AA sobre este azul (#ff7a6b=4.05, #ff6b6b=3.72).
     Naranja alerta: 5.09:1 en el peor tramo. Alternativas validadas:
     salmon #ffa08c (5.24) · ambar #ffc46b (6.57) · rosa #ff8ba7 (4.67)
     Para cambiarlo basta editar --red-hdr aqui. */
  --red-hdr:#ff9f5a;
}
body{background:var(--bg);color:var(--ink);
  font-family:Barlow,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums}

/* ══ CABECERA · azul Caleva ═══════════════════════════════════════════
   Fondo oscuro de marca. Todo lo que va encima usa variantes calculadas
   para mantener contraste AA: los verdes y rojos de la paleta clara
   (#0a8f5b, #e11d48) no llegan a 4.5:1 sobre este azul.               */
.top-header{background:linear-gradient(115deg,#001E3D,#002E5B 52%,#1E5AA8)!important;
  color:#fff;box-shadow:none;border-bottom:3px solid var(--cyan);
  padding:11px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top-header h1{display:none}
.brandbox{display:flex;flex-direction:column;align-items:flex-start;gap:5px;flex:0 0 auto}
.brand-logo{height:40px;display:block}
.hdr-nav{font-size:9.5px!important;letter-spacing:2.2px;text-transform:uppercase;
  color:var(--on-navy)!important;font-weight:600;margin:0!important;white-space:nowrap}
.hdr-right{display:flex;align-items:center;gap:0;flex-wrap:wrap;margin-left:auto}

/* insignias de la cabecera */
.header-badges{display:flex;gap:0;flex-wrap:wrap}
.header-badges .header-badge{background:none!important;border:none!important;
  border-left:1px solid rgba(255,255,255,.17)!important;border-radius:0!important;
  padding:0 15px!important;text-align:left!important}
.header-badges .header-badge .val{color:#fff!important;font-size:16px!important;font-weight:500!important}
.header-badges .header-badge .lbl{color:var(--on-navy)!important;opacity:1!important;
  font-size:8.5px!important;letter-spacing:1.3px;margin-top:1px!important}
.header-badge.verde .val{color:var(--green-hdr)!important}
.header-badge.rojo .val{color:var(--red-hdr)!important}

/* ══ TASA BCV ══════════════════════════════════════════════════════════
   Logo oficial del Banco Central de Venezuela (dominio público,
   Wikimedia Commons). El punto de color indica frescura; la clase la
   pone BCV.mostrar(), ya no estilos en línea.                          */
#bcvBadge{background:none!important;border:none!important;
  border-right:1px solid rgba(255,255,255,.17)!important;border-radius:0!important;
  padding:0 15px 0 0!important;margin-right:0;display:flex;align-items:center;gap:9px;
  text-align:left!important;white-space:nowrap;cursor:pointer}
#bcvBadge:hover .val{color:var(--cyan)!important}
#bcvBadge .bcv-seal{width:27px;height:27px;flex:0 0 auto;color:#fff;opacity:.95}
#bcvBadge .bcv-seal svg{width:100%;height:100%;display:block}

/* nube y usuario, dentro de la cabecera */
.hdr-cloud,.hdr-user{align-items:center;gap:8px;font-size:11px;
  color:var(--on-navy)!important;padding:0 0 0 15px;
  border-left:1px solid rgba(255,255,255,.17);white-space:nowrap}
.hdr-cloud #cloudDot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.hdr-cloud #cloudTxt{font-size:10px;letter-spacing:.3px}
.hdr-user b{color:#fff;font-weight:600;font-size:11px;max-width:190px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr-user #userRol{background:rgba(255,255,255,.16)!important;color:#fff!important;
  padding:2px 8px!important;border-radius:3px!important;font-size:9px!important;
  letter-spacing:.8px;text-transform:uppercase;font-weight:600!important}
.hdr-ico{background:rgba(255,255,255,.12);border:none;color:#fff;cursor:pointer;

  display:inline-flex;align-items:center;justify-content:center;padding:0}
.hdr-ico:hover{background:rgba(255,255,255,.26)}
.hdr-btn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);
  color:#fff;cursor:pointer;border-radius:4px;padding:5px 11px;font-family:inherit;
  font-size:11px;font-weight:600;letter-spacing:.3px}
.hdr-btn:hover{background:rgba(255,255,255,.26)}
.hdr-btn.out{background:none;border-color:rgba(255,159,90,.55);color:#ffb684}
.hdr-btn.out:hover{background:rgba(255,159,90,.18)}

/* ── pestañas: reglas, no barra oscura ── */
.tabs{background:#fff!important;border-bottom:1px solid var(--rule);padding:0 26px;gap:22px}
.tab{color:var(--mut3);background:none!important;border-bottom:2px solid transparent;
  padding:10px 0 9px;font-size:12.5px;font-weight:400;letter-spacing:.1px}
.tab:hover{color:var(--mut);background:none!important}
.tab.active,.tab.proc.active{color:var(--navy)!important;font-weight:600;
  border-bottom-color:var(--blue)!important;background:none!important}
.tab.proc{color:var(--mut3)}
.tab .tico{display:none!important}   /* el color del icono compite con la lectura */
.tabsep{border-left:1px solid var(--rule);height:16px;align-self:center;margin:0 4px}
.tab-audit{margin-left:auto;color:var(--mut)}
.tab-audit:hover{color:var(--navy)}
/* los permisos de usuarios se gestionan desde Configuración */
.tab[data-tab="usuarios"]{display:none!important}

/* ── botones: planos y sobrios ── */
.btn{background:var(--blue)!important;border-radius:4px!important;box-shadow:none!important;
  font-weight:600;font-size:12.5px;letter-spacing:.2px;padding:7px 13px}
.btn:hover{filter:brightness(1.06)}
.btn.g{background:var(--green)!important}
.btn.o{background:#fff!important;color:var(--blue)!important;border:1px solid #b9c6f5!important}
.btn.o:hover{background:#f4f6ff!important;filter:none}
.btn.r{background:var(--red)!important}
.btn.gr{background:#fff!important;color:var(--mut)!important;border:1px solid var(--rule)!important}
.btn.gr:hover{background:#f6f8fd!important;filter:none}
.pay-btn{border-radius:3px;box-shadow:none}

/* ── KPIs: columnas separadas por reglas, no tarjetas flotantes ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-bottom:18px}
.kpi{border-radius:0!important;box-shadow:none!important;background:none!important;
  border:none!important;border-right:1px solid var(--rule)!important;padding:16px 20px 14px}
.kpi:last-child{border-right:none!important}
.kpi-val{color:var(--navy)!important;font-weight:300;font-size:27px;letter-spacing:-.9px}
.kpi-lbl{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut3);font-weight:600}
.kpi-sub{font-size:11.5px;color:var(--mut3)}
.kpi-ic{display:none!important}      /* el dato es el protagonista, no su icono */
.kpi.red .kpi-val{color:var(--red)!important}
.kpi.green .kpi-val{color:var(--green)!important}
.kpi.orange .kpi-val{color:var(--orange)!important}

/* ── contenedores: hairline en vez de sombra ── */
.card{border-radius:0!important;box-shadow:none!important;border:none!important;
  border-top:1px solid var(--rule)!important;background:none!important;padding-top:2px}
.section-hdr{background:none!important;color:var(--mut)!important;
  border-bottom:1px solid var(--navy);padding:0 0 7px;margin-bottom:10px;
  font-size:11px;letter-spacing:1.8px;text-transform:uppercase;font-weight:600}
.section-hdr-right{color:var(--mut3);font-weight:500;letter-spacing:.6px;
  text-transform:none;font-size:11px}
.section-body{padding:0}
.toolbar{background:none;border-bottom:1px solid var(--rule);border-radius:0;
  box-shadow:none;padding:12px 0;margin-bottom:0}
.info-pedido{background:none;border:none;border-left:2px solid var(--blue);
  border-radius:0;padding-left:12px}

/* ── tablas: sólo filetes ── */
table{border-collapse:collapse}
/* Con «body» delante estas reglas ganan a la hoja base (0,0,2 > 0,0,1) SIN
   necesidad de !important. Importa: el documento de impresión define
   #facturaPrint td (1,0,1) con su propia retícula milimétrica —padding 0 2px,
   sin filetes— y con !important se la aplastábamos, descuadrando la factura.
   Sin !important, la impresión recupera su prioridad natural.
   Tampoco lo llevan porque las celdas de color de la matriz conservan el suyo. */
body th{background:none;color:var(--mut3);box-shadow:none;
  border-bottom:1px solid var(--rule);font-size:10px;
  letter-spacing:1.2px;text-transform:uppercase;font-weight:600;
  padding:0 10px 6px 0}
body th:hover{background:none;color:var(--mut)}
body td{border-bottom:1px solid var(--hair);font-size:12.5px;padding:6.5px 10px 6.5px 0}
body tr:hover td{background:#f6f8fd}

/* Cinturón y tirantes: el documento de impresión queda explícitamente fuera
   del alcance de la capa, pase lo que pase con la especificidad. */
#facturaPrint td{padding:0 2px;border:0;line-height:1.05;background:#fff}
#facturaPrint tr:hover td{background:#fff}
.tfoot-row td{background:none!important;color:var(--navy)!important;
  border-top:2px solid var(--navy)!important;border-bottom:none!important;font-weight:600}
.itemtbl th,.fac-itbl th{background:none!important;color:var(--mut3)!important;
  box-shadow:none!important;border-bottom:1px solid var(--rule)!important}
.num,.mono{font-variant-numeric:tabular-nums}

/* ══ MATRIZ ═══════════════════════════════════════════════════════════
   La cabecera ya era sticky en la hoja base; al quitarle el fondo se
   volvía transparente y parecía desaparecer al hacer scroll. Se le
   devuelve fondo sólido y se fija también la columna de estación.     */
.mtx th{background:#fff!important;color:var(--mut3)!important;
  border-bottom:1px solid var(--navy)!important;position:sticky;top:0;z-index:3}
.mtx td.est{font-weight:500;position:sticky;left:0;z-index:2;background:#fff!important}
.mtx th:first-child{left:0;z-index:4}
.mtx tr:hover td.est{background:#eef2fb!important}
.mtx td.mcell{color:#fff}

/* ── pills: planas ── */
.pill{border-radius:3px;font-weight:600;font-size:10.5px;letter-spacing:.2px;padding:2px 7px}
.pill.ok{background:#e6fbf3;color:var(--green)}
.pill.pend{background:#fef4e2;color:var(--orange)}
.pill.venc{background:#fdeaef;color:var(--red)}

/* ── formularios ── */
.toolbar input,.toolbar select,.fld input,.fld select{border-radius:3px;border-color:var(--rule)}
.fld label{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut3);font-weight:600}
.fld input:focus,.fld select:focus,.toolbar input:focus,.toolbar select:focus,
.login-card .fld input:focus{outline:none!important;border-color:var(--blue)!important;box-shadow:0 0 0 3px #eef1ff}
.hint{color:var(--mut3);font-size:11.5px}
.empty{font-family:'Barlow Condensed',Barlow,sans-serif;font-style:normal;letter-spacing:.3px;color:var(--mut3)}

/* ══ MODALES DE DETALLE ═══════════════════════════════════════════════
   Eran de 520 px: «V-1» se partía en dos líneas y los nombres de
   estación se envolvían. Se ensanchan, se les da control de ancho al
   usuario (tirador en la esquina) y las columnas cortas dejan de
   romperse.                                                            */
/* OJO: sin !important en width. Con el, el tirador de redimensionar —que
   escribe width en linea— no podia ganar y la ventana no se dejaba ensanchar.
   Basta el orden: esta capa va despues de la hoja base. */
.modal{border-radius:6px;width:min(940px,96vw);max-width:96vw;min-width:420px;
  resize:both;overflow:auto}
.modal .mh{background:var(--navy)!important;font-weight:600;letter-spacing:.3px;
  position:sticky;top:0;z-index:5}
.modal .mb{padding:16px 18px 18px}
.itemtbl,.fac-itbl{width:100%}
.itemtbl th,.itemtbl td{white-space:nowrap;padding:7px 16px 7px 0!important;vertical-align:middle}
.itemtbl th:last-child,.itemtbl td:last-child{padding-right:0!important}
.itemtbl td.center,.itemtbl th.center{text-align:center;white-space:nowrap;width:1%}
/* la descripción es lo único que puede envolverse, y sólo si hace falta */
.itemtbl td:nth-child(4){white-space:normal;min-width:220px;line-height:1.45}
.modal .frow{gap:8px;flex-wrap:wrap;padding-top:4px}
.modal .frow .btn{flex:0 0 auto}
/* el pie del modal distingue por rol: acción secundaria en azul suave,
   confirmación en verde, destructiva en rojo, cierre en neutro */
.modal .frow .btn.o{background:#eef1ff!important;color:var(--blue)!important;
  border:1px solid #c3cdf9!important}
.modal .frow .btn.o:hover{background:#e3e8ff!important}
.modal .frow .btn.g{background:var(--green)!important;color:#fff!important;border:none!important}
.modal .frow .btn.r{background:var(--red)!important;color:#fff!important;border:none!important}
.modal .frow .btn.gr{background:#fff!important;color:var(--mut)!important;
  border:1px solid var(--rule)!important}

/* ══ ALINEACIÓN DE CABECERAS ══════════════════════════════════════════
   El ayudante th() no marcaba las columnas numéricas, así que el título
   quedaba a la izquierda y su cifra a la derecha. Ahora emite class="num"
   y .num ya alinea a la derecha: se corrige en TODAS las tablas a la vez. */
th.num{text-align:right}
th.center{text-align:center}

/* ── columna Cobranza del resumen por año ── */
.cbz{display:inline-block;width:54px;height:6px;background:var(--hair);
  vertical-align:middle;margin-right:8px}
.cbz i{display:block;height:100%;font-style:normal}
.cbz-n{font-size:11.5px;font-weight:600;color:var(--mut)}

/* ══ DASHBOARD ════════════════════════════════════════════════════════
   Diez KPI en dos filas de cinco, y los gráficos en dos columnas: la
   tendencia mensual sola a lo ancho quedaba desparramada.              */
@media(min-width:1200px){
  .kpis{grid-template-columns:repeat(5,minmax(0,1fr))}
  .kpi:nth-child(5n){border-right:none!important}
  .kpi:nth-child(n+6){border-top:1px solid var(--rule)!important}
}
.dash-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);
  gap:0;align-items:start;margin-top:18px}
.dash-grid > .card:first-child{padding-right:28px;border-right:1px solid var(--rule)}
.dash-side{padding-left:28px;min-width:0}
.dash-side > .card:first-child{border-top:1px solid var(--rule)!important}
.bars{gap:6px;max-width:100%}
.bar-col{max-width:60px}

/* antigüedad de la cartera */
.ag-bar{display:flex;height:20px;margin-bottom:14px;background:var(--hair)}
.ag-bar i{display:block;height:100%;font-style:normal}
.ag-row{display:flex;align-items:center;gap:10px;padding:6px 0;
  border-bottom:1px solid var(--hair);font-size:12.5px}
.ag-row:last-child{border-bottom:none}
.ag-k{flex:1;display:flex;align-items:center;gap:8px;color:var(--mut)}
.ag-k i{width:9px;height:9px;flex:0 0 auto;font-style:normal}
.ag-row b{font-weight:600;color:var(--navy)}
.ag-p{width:42px;text-align:right;color:var(--mut3);font-size:11.5px}

/* concentración por cobrar */
.tp-row{display:flex;align-items:center;gap:10px;padding:6px 0;
  border-bottom:1px solid var(--hair);font-size:12.5px}
.tp-row:last-child{border-bottom:none}
.tp-k{width:104px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-bar{flex:1;height:8px;background:var(--hair);min-width:36px}
.tp-bar i{display:block;height:100%;background:var(--blue);font-style:normal}
.tp-row b{width:92px;text-align:right;font-weight:600;color:var(--navy)}

@media(max-width:1100px){
  .dash-grid{grid-template-columns:1fr}
  .dash-grid > .card:first-child{padding-right:0;border-right:none}
  .dash-side{padding-left:0}
}

/* ══ VENTANAS DE CONSULTA ═════════════════════════════════════════════
   Todas se pueden mover (arrastrando la cabecera) y redimensionar (tirador
   en la esquina inferior derecha). El comportamiento lo instala ventanas.js;
   aquí solo van las señales visuales.                                    */
.vent{resize:both;overflow:auto}
.vent-cab{cursor:move;user-select:none;-webkit-user-select:none;touch-action:none}
.vent-cab:active{cursor:grabbing}
/* mientras se arrastra, nada de selección ni de textos resaltados por error */
body.vent-moviendo{user-select:none;-webkit-user-select:none;cursor:move}
/* tirador visible: por defecto el del navegador casi no se ve sobre blanco */
.vent::-webkit-resizer{background:linear-gradient(135deg,transparent 48%,var(--rule) 48%,var(--rule) 62%,transparent 62%,transparent 72%,var(--rule) 72%,var(--rule) 86%,transparent 86%)}
.modal.vent,.fac-editor.vent{max-height:none}

/* ══ LISTADOS · total y selección ══════════════════════════════════════
   La casilla y la fila TOTAL las inyecta seleccion.js; aquí sólo su aspecto. */
th.sel-col,td.sel-col{width:1%;padding-right:10px!important;text-align:center;
  white-space:nowrap;cursor:pointer}
th.sel-col input,td.sel-col input{width:14px;height:14px;accent-color:var(--blue);
  cursor:pointer;vertical-align:middle}
tbody tr.sel-on td{background:#eef2ff!important}
tbody tr.sel-on td.sel-col{box-shadow:inset 2px 0 0 var(--blue)}
tr.sel-total td{border-top:2px solid var(--navy)!important;border-bottom:none!important;
  font-weight:600;color:var(--navy);padding-top:9px!important;background:none!important}
td.sel-total-lbl{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--mut3);font-weight:600}

/* barra de selección · abajo a la IZQUIERDA, para no chocar con
   los botones flotantes de Indicadores y Auditoría */
#selBarra{position:fixed;left:22px;bottom:16px;z-index:420;display:none;
  align-items:center;gap:0;background:var(--navy);color:#fff;border-radius:5px;
  padding:0 4px 0 14px;box-shadow:0 6px 22px rgba(0,46,91,.34);
  font-family:Barlow,-apple-system,"Segoe UI",sans-serif;max-width:calc(100vw - 300px);
  overflow-x:auto}
#selBarra.on{display:flex}
#selBarra .sb-n{font-size:11px;letter-spacing:.6px;color:#c3cfef;white-space:nowrap;
  padding:10px 16px 10px 0;border-right:1px solid rgba(255,255,255,.18)}
#selBarra .sb-i{display:flex;flex-direction:column;gap:1px;padding:8px 16px;
  border-right:1px solid rgba(255,255,255,.18);white-space:nowrap}
#selBarra .sb-i b{font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
#selBarra .sb-i i{font-style:normal;font-size:8.5px;letter-spacing:1.2px;
  text-transform:uppercase;color:#c3cfef}
#selBarra .sb-x{background:none;border:none;color:#ffb684;cursor:pointer;
  font-family:inherit;font-size:11px;font-weight:600;padding:10px 14px;letter-spacing:.4px}
#selBarra .sb-x:hover{color:#fff}
@media print{ #selBarra{display:none!important} th.sel-col,td.sel-col{display:none} }

/* ── módulo Configuración ── */
/* el filtro de año y la búsqueda no aplican aquí: sólo serían ruido */
.wrap:has(#tab-config.active) > .toolbar{display:none}
.cfg-sec{padding:2px 0 4px;max-width:720px}
.cfg-txt{font-size:13px;color:var(--mut);line-height:1.65;margin:0 0 14px;max-width:620px}
.cfg-txt b{color:var(--ink);font-weight:600}

/* ── holgura para la barra flotante de utilidades ──
   Indicadores y Auditoría son botones position:fixed inyectados por el JS con
   estilos en línea: tapaban las últimas filas de las tablas largas. */
.wrap{padding-bottom:64px}
/* apuntados por id: style.cssText se serializa con espacios
   («position: fixed»), asi que un selector de atributo sin ellos
   no coincidia nunca. */
#segAuditBtn,#segIndBtn{border-radius:4px!important;
  box-shadow:0 4px 14px rgba(0,46,91,.22)!important}

@media print{ #bcvBadge{border-right:none!important} .wrap{padding-bottom:0} }
@media(max-width:900px){
  .top-header{padding:10px 14px;gap:10px}
  .hdr-right{gap:6px}
  .hdr-user b{max-width:120px}
}

function conv(m, de, a, tasas) { if (de === a) return +m; var bs = de === 'Bs' ? +m : (+m) * (+tasas[de] || 0); return a === 'Bs' ? bs : (tasas[a] ? bs / tasas[a] : 0); }
function aUSD(m, mon_) { return mon_ === 'USD' ? +m : conv(m, mon_, 'USD', BCV.hoy); }

function provDe(id) { return DB.proveedores.find(function (p) { return p.id === id; }); }

/* ---------- cálculos por documento ---------- */
var Calc = {
  rets: function (d) { return DB.retenciones.filter(function (r) { return r.docId === d.id && r.estado !== 'anulado'; }); },
  ret: function (d, tipo) { return Calc.rets(d).filter(function (r) { return r.tipo === tipo; })[0] || null; },
  retBs: function (d) { return r2(Calc.rets(d).reduce(function (a, r) { return a + (+r.monto || 0); }, 0)); },
  /* retenciones expresadas en la moneda del documento (tasa de la factura) */
  retDoc: function (d) { var b = Calc.retBs(d); return d.moneda === 'Bs' ? b : (d.tasa ? r2(b / d.tasa) : 0); },
  neto: function (d) { return r2((+d.total || 0) - Calc.retDoc(d)); },
  /* neto FISCAL en Bs = suma exacta de sus líneas en Bs (base + IVA + exento a la tasa de la factura − retenciones);
     así cuadra al céntimo con los comprobantes y no hereda el redondeo de pasar el neto en USD a Bs */
  netoBs: function (d) { var tf = d.moneda === 'Bs' ? 1 : (+d.tasa || 0);
    if (d.tipo !== 'factura') return r2(d.total * tf);
    return r2(r2(d.base * tf) + r2(d.iva * tf) + r2((+d.exento || 0) * tf) - Calc.retBs(d)); },
  pagado: function (d) { return r2((d.pagos || []).reduce(function (a, p) { return a + (+p.montoDoc || 0); }, 0)); },
  saldo: function (d) { return r2(Calc.neto(d) - Calc.pagado(d)); },
  /* factura: IVA y ISLR resueltos (emitidos o marcados «no aplica») */
  retenida: function (d) {
    if (d.tipo !== 'factura') return true;
    return (!!Calc.ret(d, 'iva') || !!d.ivaNoAplica) && (!!Calc.ret(d, 'islr') || !!d.islrNoAplica);
  },
  estado: function (d) {
    if (d.anulado) return 'Anulado';
    if (typeof Caja !== 'undefined' && Caja.esGasto(d)) return Caja.estadoGasto(d);
    if (!Calc.retenida(d)) return 'Por retener';   /* antes que «Pagado»: una nota pagada que pasa a factura aún debe retenerse */
    if (Calc.saldo(d) <= 0.005 && Calc.pagado(d) > 0) return 'Pagado';
    if (Calc.pagado(d) > 0) return 'Parcial';
    return 'Pendiente';
  },
  vencido: function (d) { if (typeof Caja !== 'undefined' && Caja.esGasto(d)) return false; var e = Calc.estado(d); return e !== 'Pagado' && e !== 'Anulado' && d.vence && dias(d.vence) < 0; }
};

/* ═══════════════ PEDIDOS Y ET (vienen de Seguimiento) ═══════════════
   Publicada: se leen en vivo de Supabase (caleva_estado: 4 = pedidos, 2 = valuaciones y catálogo de
   estaciones, 5 = pagos/máximos si el usuario los puede ver). Draft: copia del último respaldo. */
var Seg = {
  d: { pedidos: [], et: {}, catalogo: [] },
  pn: function (x) { var s = String(x || '').trim(), i = s.indexOf('|'); return i > 0 ? s.slice(0, i).trim() : s; },
  armar: function (docs) {
    var self = this, et = {}, add = function (p, e) { p = self.pn(p); e = String(e || '').replace(/\s+/g, ' ').trim(); if (!p || !e) return; (et[p] = et[p] || {})[clave(e)] = e; };
    var peds = ((docs[4] && docs[4].pedidos) || []).filter(function (p) { return /^\d+$/.test(self.pn(p.pedido)); })
      .map(function (p) { return { pedido: self.pn(p.pedido), desc: p.desc || '', cerrado: !!(p.cerrado || (+p.avance || 0) >= 0.9995) }; })
      .sort(function (a, b) { return (+b.pedido) - (+a.pedido); });
    ((docs[2] && docs[2].valuaciones) || []).forEach(function (v) { add(v.pedido, v.estacion); });
    ((docs[5] && docs[5].pagos) || []).forEach(function (v) { add(v.pedido, v.estacion); });
    ((docs[5] && docs[5].topes) || []).forEach(function (v) { add(v.pedido, v.estacion); });
    var out = {}; Object.keys(et).forEach(function (p) { out[p] = Object.keys(et[p]).map(function (k) { return et[p][k]; }).sort(function (a, b) { return a.localeCompare(b, 'es'); }); });
    return { pedidos: peds, et: out, catalogo: ((docs[2] && docs[2].estaciones) || []).slice().sort(function (a, b) { return String(a).localeCompare(String(b), 'es'); }) };
  },
  cargar: function () {
    var self = this; try { var s = JSON.parse($('seedSeg').textContent); if (s && s.pedidos) self.d = s; } catch (e) {}
    if (!Store.cloud() || !Store.headers) return Promise.resolve();
    return fetch(Store.rest() + 'caleva_estado?id=in.(2,4,5)&select=id,data', { headers: Store.headers() })
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (rows) { var docs = {}; (rows || []).forEach(function (x) { docs[x.id] = x.data; }); if (docs[4]) self.d = self.armar(docs); })
      .catch(function () {});
  },
  desc: function (p) { var x = this.d.pedidos.find(function (y) { return y.pedido === String(p); }); return x ? x.desc : ''; },
  etiqueta: function (p) { var d = this.desc(p); return p ? p + (d ? ' · ' + d : '') : ''; },
  /* soloActivos: el formulario ofrece solo pedidos activos (no culminados, mismo criterio que Seguimiento);
     el valor actual de un documento se conserva aunque su pedido ya esté culminado */
  optPedidos: function (cur, vacio, soloActivos) {
    cur = String(cur || '');
    var usados = {}; if (!soloActivos && typeof DB !== 'undefined' && DB) DB.documentos.forEach(function (d) { if (d.pedido) usados[d.pedido] = 1; });
    var L = this.d.pedidos.filter(function (x) { return soloActivos ? (!x.cerrado || x.pedido === cur) : (!x.cerrado || usados[x.pedido] || x.pedido === cur); });
    if (cur && !L.some(function (x) { return x.pedido === cur; })) L.unshift({ pedido: cur, desc: '(no está en Seguimiento)' });
    return '<option value="">' + (vacio || '— sin pedido —') + '</option>' + L.map(function (x) { return '<option value="' + esc(x.pedido) + '"' + (x.pedido === cur ? ' selected' : '') + '>' + esc(x.pedido + '  |  ' + x.desc + (x.cerrado ? '  (culminado)' : '')) + '</option>'; }).join('');
  },
  /* ET ya usadas en Cuentas por pagar: del pedido, o de cualquier otro */
  usadas: function (ped, delPedido) {
    var m = {}; if (typeof DB === 'undefined' || !DB) return [];
    DB.documentos.concat(DB.cajas || []).forEach(function (d) { var e = String(d.et || '').trim(); if (e && (String(d.pedido || '') === String(ped || '')) === delPedido) m[clave(e)] = e; });
    return Object.keys(m).map(function (k) { return m[k]; });
  },
  optET: function (ped, cur) {
    var propias = ((ped && this.d.et[ped]) || []).slice(), ya = {}; cur = String(cur || '');
    propias.forEach(function (e) { ya[clave(e)] = 1; });
    if (ped) this.usadas(ped, true).forEach(function (e) { if (!ya[clave(e)]) { ya[clave(e)] = 1; propias.push(e); } });
    propias.sort(function (a, b) { return a.localeCompare(b, 'es'); });
    var otras = this.d.catalogo.slice();
    this.usadas(ped, false).concat(ped ? [] : this.usadas(ped, true)).forEach(function (e) { if (!otras.some(function (o) { return clave(o) === clave(e); })) otras.push(e); });
    otras = otras.filter(function (e) { return !ya[clave(e)]; }).sort(function (a, b) { return String(a).localeCompare(String(b), 'es'); });
    var opt = function (e) { return '<option value="' + esc(e) + '"' + (clave(e) === clave(cur) ? ' selected' : '') + '>' + esc(e) + '</option>'; };
    var h = '<option value="">— sin ET —</option>';
    if (cur && !propias.concat(otras).some(function (e) { return clave(e) === clave(cur); })) h += '<option value="' + esc(cur) + '" selected>' + esc(cur) + '</option>';
    if (propias.length) h += '<optgroup label="ET del pedido ' + esc(ped) + '">' + propias.map(opt).join('') + '</optgroup>';
    if (otras.length) h += '<optgroup label="' + (ped ? 'Otras ET del catálogo' : 'Catálogo de ET') + '">' + otras.map(opt).join('') + '</optgroup>';
    return h + '<option value="' + Seg.NUEVA_ET + '">＋ Nueva ET…</option>';
  },
  NUEVA_ET: '__nueva_et',
  nuevaET: function (sel) {
    var v = String(prompt('Nombre de la nueva ET:') || '').replace(/\s+/g, ' ').trim().toUpperCase();
    if (!v) { sel.value = sel._prev || ''; return; }
    var ex = [].filter.call(sel.options, function (o) { return o.value !== Seg.NUEVA_ET && clave(o.value) === clave(v); })[0];
    if (ex) { sel.value = ex.value; toast('Esa ET ya existe: quedó seleccionada'); return; }
    var o = document.createElement('option'); o.value = v; o.textContent = v;
    sel.insertBefore(o, sel.querySelector('option[value="' + Seg.NUEVA_ET + '"]')); sel.value = v;
    Seg.d.catalogo = (Seg.d.catalogo || []).concat([v]);
    /* un solo catálogo: la ET también queda en Seguimiento */
    if (Store.cloud()) Nube.rpc('cxp_agregar_et', { p_et: v }).then(function () {
      Nube.auditar({ ent: 'conf', ref: v, accion: 'ET agregada al catálogo', sujeto: v, resumen: 'Disponible también en Seguimiento', modulo: 'Configuración', fecha: new Date().toISOString(), actor: Aud.actor() }); Nube.drenar();
    }).catch(function (e) { toast('La ET queda en este documento, pero no llegó al catálogo de Seguimiento: ' + e.message); });
  }
};
document.addEventListener('focusin', function (e) { var t = e.target; if (t && t.tagName === 'SELECT' && t.value !== Seg.NUEVA_ET) t._prev = t.value; });
document.addEventListener('change', function (e) { var t = e.target; if (t && t.tagName === 'SELECT' && t.value === Seg.NUEVA_ET) Seg.nuevaET(t); else if (t && t.tagName === 'SELECT') t._prev = t.value; });

/* ═══════════════ CONCILIACIÓN CON EL ESTADO DE CUENTA DEL BANCO ═══════════════

var Banco = {

  numero: function (s) { return r2(parseFloat(String(s).replace(/\./g, '').replace(',', '.'))); },
  iso: function (s) { var m = /^(\d\d)\/(\d\d)\/(\d{4})$/.exec(s); return m ? m[3] + '-' + m[2] + '-' + m[1] : ''; },
  /* lee cuenta, período, resumen y movimientos; errores[] no vacío = no se puede usar */
  parsear: function (paginas) {

      porY.forEach(function (t) { if (yg === null || Math.abs(t.y - yg) > 3) { if (grupo.length) lineas.push(grupo); grupo = []; yg = t.y; } grupo.push(t); });
      if (grupo.length) lineas.push(grupo);

        if (nums.length !== 2) { err.push('Línea del ' + d.s + ' sin monto y saldo legibles'); return; }
        movs.push({ fecha: Banco.iso(d.s), ref: ref.join(''), desc: resto.map(function (t) { return t.s; }).join(' '), monto: Banco.numero(nums[0].s), saldo: Banco.numero(nums[1].s) });

    });

    var mC = /Cuenta\s+Corriente:\s*([\d-]+)/.exec(tx), mP = /del\s+(\d\d\/\d\d\/\d{4})\s+al\s+(\d\d\/\d\d\/\d{4})/.exec(tx), mI = /Saldo\s+Inicial\s+(-?[\d.]+,\d\d)/.exec(tx),
      mR = /Total\s+D.bitos\s+(\d+)\s+([\d.]+,\d\d)\s+Total\s+Cr.ditos\s+(\d+)\s+([\d.]+,\d\d)/.exec(tx), mF = /Saldo\s+Final\s+del\s+Per.odo\s+(-?[\d.]+,\d\d)/.exec(tx);

  /* alta / baja / cambio de cada registro, más los sub-registros (pagos, conciliaciones) */

  sub: function (A, B, clave) {

      var base = [Aud.fh(e.fecha), e.actor, e.modulo, e.accion, e.sujeto || '', e.resumen || ''];

      else e.cambios.forEach(function (c) { rows.push(base.concat([c.c, c.a, c.b])); });
    });
    Xls.bajar('CxP_auditoria', [{ name: 'AUDITORIA', headers: ['FECHA Y HORA', 'USUARIO', 'MODULO', 'ACCION', 'REGISTRO', 'RESUMEN', 'CAMPO', 'ANTES', 'DESPUES'], rows: rows }], rows.length);
  }
};
/* engancha la auditoría al guardado y a la carga */
(function () {

/* ═══════════════ NUBE (solo la app publicada) ═══════════════
   Sesión compartida con el portal. Cada registro es una fila de cxp_registros: se guarda solo lo
   que cambió, con su versión, para que dos personas no se pisen. Los comprobantes los numera el
   servidor. Lo que el servidor rechaza se revierte recargando sus datos. */
var Auth = {
  KEY: 'caleva_session', session: null,
  base: function () { return SB.url.replace(/\/+$/, ''); },
  load: function () { try { this.session = JSON.parse(localStorage.getItem(this.KEY)); } catch (e) { this.session = null; } },
  guardar: function (d) { if (!d.expires_at) d.expires_at = Math.floor(Date.now() / 1000) + (d.expires_in || 3600); this.session = d; try { localStorage.setItem(this.KEY, JSON.stringify(d)); } catch (e) {} },
  clear: function () { this.session = null; try { localStorage.removeItem(this.KEY); } catch (e) {} },
  token: function () { return this.session && this.session.access_token; },
  email: function () { return this.session && this.session.user && this.session.user.email; },
  expired: function () { return !this.token() || ((this.session.expires_at || 0) * 1000 - Date.now()) < 60000; },
  login: function (email, pass) {
    var self = this;
    return fetch(this.base() + '/auth/v1/token?grant_type=password', { method: 'POST', headers: { apikey: SB.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ email: email, password: pass }) })
      .then(function (r) { return r.json(); }).then(function (d) { if (d && d.access_token) { self.guardar(d); return { ok: true }; } return { err: (d && (d.error_description || d.msg || d.error)) || 'Correo o contraseña incorrectos' }; })
      .catch(function () { return { err: 'Sin conexión con el servidor' }; });
  },
  refresh: function () {
    var self = this; if (!this.session || !this.session.refresh_token) return Promise.resolve(false);
    return fetch(this.base() + '/auth/v1/token?grant_type=refresh_token', { method: 'POST', headers: { apikey: SB.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: this.session.refresh_token }) })
      .then(function (r) { return r.json().then(function (d) { if (d && d.access_token) { self.guardar(d); return true; } if (r.status >= 400 && r.status < 500) self.clear(); return false; }); }).catch(function () { return false; });
  },
  logout: function () { if (!confirm('¿Cerrar sesión?')) return; var t = this.token(), b = this.base(); this.clear(); if (t) { try { fetch(b + '/auth/v1/logout', { method: 'POST', headers: { apikey: SB.key, Authorization: 'Bearer ' + t } }); } catch (e) {} } location.href = '../'; }
};

var Nube = {
  COLS: ['proveedores', 'documentos', 'retenciones', 'cajas'],
  perfil: { rol: 'usuario', permisos: {} }, usuarios: [], base: {}, pend: [], audPend: [], esperan: [], corriendo: false, ult: '', filas: [], corr: {},

  /* ---------- peticiones ---------- */
  f: function (path, opt, reint) {
    opt = opt || {};
    return (Auth.expired() ? Auth.refresh() : Promise.resolve(true)).then(function () {
      if (!Auth.token()) { Nube.pedirLogin(); throw { red: true, message: 'Sesión vencida' }; }
      return fetch(Store.rest() + path, Object.assign({}, opt, { headers: Object.assign(Store.headers(), opt.headers || {}) }));
    }).then(function (r) {
      if (r.status === 401 && !reint) return Auth.refresh().then(function (ok) { if (!ok) { Nube.pedirLogin(); throw { red: true, message: 'Sesión vencida' }; } return Nube.f(path, opt, true); });
      return r;
    });
  },
  rpc: function (fn, args) {
    return Nube.f('rpc/' + fn, { method: 'POST', body: JSON.stringify(args || {}) }).then(function (r) {
      return r.text().then(function (t) { var d = null; try { d = t ? JSON.parse(t) : null; } catch (e) {}
        if (!r.ok) throw Error((d && d.message) || 'Error ' + r.status); return d; });
    });
  },

  /* ---------- carga ---------- */
  todo: function (offset, acum) {
    offset = offset || 0; acum = acum || [];
    return Nube.f('cxp_registros?select=coleccion,id,data,version,updated_at&order=coleccion,id&limit=1000&offset=' + offset).then(function (r) {
      if (!r.ok) throw Error('No se pudieron leer los datos (' + r.status + ')'); return r.json();
    }).then(function (L) { acum = acum.concat(L); return L.length === 1000 ? Nube.todo(offset + 1000, acum) : acum; });
  },
  correlativos: function () {
    return Nube.f('cxp_correlativos?select=tipo,ultimo').then(function (r) { return r.ok ? r.json() : []; }).then(function (L) { L.forEach(function (x) { Nube.corr[x.tipo] = +x.ultimo; }); });
  },
  leer: function () {
    return Promise.all([Nube.todo(), Nube.correlativos()]).then(function (res) {
      Nube.filas = res[0]; Nube.ult = '';
      Nube.filas.forEach(function (x) { if (x.updated_at > Nube.ult) Nube.ult = x.updated_at; });
      Store.load();
    });
  },
  /* lo llama Store.load: arma DB con las filas y deja la base para saber qué cambió después */
  armar: function () {
    var d = { v: 1, config: {}, proveedores: [], documentos: [], retenciones: [], cajas: [] }, verCfg = null; Nube.base = {};
    Nube.filas.forEach(function (x) {
      if (x.coleccion === 'archivos') { if (x.id === 'firma' && x.data && x.data.src) $('firmaSello').setAttribute('src', x.data.src); return; }
      if (x.coleccion === 'config') { d.config = x.data || {}; verCfg = x.version; return; }
      if (!d[x.coleccion]) return;
      d[x.coleccion].push(x.data); Nube.base[x.coleccion + '|' + x.id] = { v: x.version, s: JSON.stringify(x.data) };
    });
    d.config.corr = Object.assign({}, d.config.corr || {}, Nube.corr);
    Nube.verCfg = verCfg; Aud.cargado = false;
    return d;
  },
  /* con la configuración ya completada con sus valores por defecto: así no se reenvía sin cambios */
  fijarBaseCfg: function () { Nube.base['config|general'] = { v: Nube.verCfg, s: JSON.stringify(Nube.cfg()) }; },
  /* los correlativos viven en su tabla */
  cfg: function () { var c = JSON.parse(JSON.stringify(DB.config)); delete c.corr; delete c.usuariosDraft; delete c.comoDraft; delete c.rolDraft; return c; },

  /* ---------- guardado ---------- */
  empujar: function () {
    var ya = {};
    var ver = function (col, id, data) {
      var k = col + '|' + id, s = JSON.stringify(data), b = Nube.base[k]; ya[k] = 1;
      if (b && b.s === s) return;
      Nube.base[k] = { v: b ? b.v : null, s: s };
      Nube.encolar({ k: k, col: col, id: id, data: JSON.parse(s) });
    };
    Nube.COLS.forEach(function (col) { DB[col].forEach(function (d) { ver(col, d.id, d); }); });
    ver('config', 'general', Nube.cfg());
    Object.keys(Nube.base).forEach(function (k) {
      if (ya[k]) return; var b = Nube.base[k], x = k.split('|'); delete Nube.base[k];
      if (b.v == null) { Nube.pend = Nube.pend.filter(function (o, i) { return (Nube.corriendo && i === 0) || o.k !== k; }); return; }
      Nube.encolar({ k: k, col: x[0], id: x.slice(1).join('|'), borrar: true });
    });
    Nube.drenar();
  },
  encolar: function (op) {
    for (var i = Nube.corriendo ? 1 : 0; i < Nube.pend.length; i++) if (Nube.pend[i].k === op.k) { Nube.pend[i] = op; return; }
    Nube.pend.push(op);
  },
  drenar: function () {
    if (Nube.corriendo) return;
    var op = Nube.pend[0];
    if (!op) { Nube.pinta(); Nube.audPend.splice(0).forEach(Nube.enviarAud); Nube.esperan.splice(0).forEach(function (w) { w.ok(); }); return; }
    Nube.corriendo = true; Nube.pinta();
    Nube.enviar(op).then(function () { Nube.corriendo = false; Nube.fallos = 0; Nube.pend.shift(); Nube.drenar(); }).catch(function (e) {
      Nube.corriendo = false;
      if (e && e.red) { Nube.fallos = (Nube.fallos || 0) + 1; Nube.pinta(); clearTimeout(Nube._t); Nube._t = setTimeout(Nube.drenar, Math.min(30000, 3000 * Nube.fallos)); return; }
      Nube.rechazo(e && e.message);
    });
  },
  enviar: function (op) {
    var q = 'cxp_registros?coleccion=eq.' + encodeURIComponent(op.col) + '&id=eq.' + encodeURIComponent(op.id), rep = { Prefer: 'return=representation' }, b = Nube.base[op.k];
    var pet = op.borrar ? Nube.f(q, { method: 'DELETE', headers: rep })
      : b && b.v != null ? Nube.f(q + '&version=eq.' + b.v + '&select=version', { method: 'PATCH', headers: rep, body: JSON.stringify({ data: op.data }) })
      : Nube.f('cxp_registros?select=version', { method: 'POST', headers: rep, body: JSON.stringify({ coleccion: op.col, id: op.id, data: op.data }) });
    return pet.catch(function (e) { throw { red: true, message: e && e.message }; }).then(function (r) {
      if (r.status >= 500) throw { red: true, message: 'Error del servidor ' + r.status };
      return r.text().then(function (t) { var d = null; try { d = t ? JSON.parse(t) : null; } catch (e) {}
        if (r.status === 409) throw { message: Nube.MSG_CONFLICTO };
        if (!r.ok) throw { message: (d && d.message) || 'Error ' + r.status };
        if (!Array.isArray(d) || !d.length) throw { message: Nube.MSG_CONFLICTO };
        if (!op.borrar && Nube.base[op.k]) Nube.base[op.k].v = d[0].version;
      });
    });
  },
  MSG_CONFLICTO: 'Otro usuario cambió este registro, o su usuario no puede modificarlo.',
  /* el servidor no lo aceptó: se vuelve a sus datos */
  rechazo: function (msg) {
    Nube.pend = []; Nube.audPend = [];
    Nube.esperan.splice(0).forEach(function (w) { w.mal(Error(msg)); });
    UI.cerrarModal(); UI.cerrarModal2();
    Nube.aviso('No se guardó: ' + String(msg || 'el servidor lo rechazó').replace(/\.+$/, '') + '. Se cargaron los datos actuales; revise y repita el cambio.');
    Nube.leer().then(function () { UI.render(); }).catch(function (e) { toast(e.message); });
  },
  esperar: function () { return (Nube.pend.length || Nube.corriendo) ? new Promise(function (ok, mal) { Nube.esperan.push({ ok: ok, mal: mal }); Nube.drenar(); }) : Promise.resolve(); },
  /* la auditoría sale cuando el cambio ya quedó guardado */
  auditar: function (e) { Nube.audPend.push(e); },
  enviarAud: function (e) { Nube.rpc('app_audit_write', { p_app: 'cxp', p_action: e.accion, p_entity: e.ent, p_entity_id: e.ref, p_before: null, p_after: e }).catch(function (x) { console.error('auditoría', x); }); },
  pinta: function () {
    var b = $('cxNube'); if (!b) return; var n = Nube.pend.length;
    if (Nube.fallos && n) { b.textContent = 'Sin conexión: ' + n + ' cambio(s) por guardar. Se reintenta solo; no cierre esta página.'; b.className = 'cx-nube on err'; return; }
    b.className = 'cx-nube';
  },
  aviso: function (m) { var b = $('cxNube'); if (!b) return; b.textContent = m; b.className = 'cx-nube on err'; clearTimeout(Nube._a); Nube._a = setTimeout(Nube.pinta, 9000); },

  /* ---------- operaciones del servidor ---------- */
  emitir: function (r) {
    return Nube.esperar().then(function () { return Nube.rpc('cxp_emitir_retencion', { p_id: r.id, p_tipo: r.tipo, p_data: r }); })
      .then(function (fila) { Nube.base['retenciones|' + fila.id] = { v: 1, s: JSON.stringify(fila) }; Nube.corr[fila.tipo] = fila.seq; return fila; });
  },
  fijarCorr: function (tipo, n) { return Nube.corr[tipo] === n ? Promise.resolve() : Nube.rpc('cxp_fijar_correlativo', { p_tipo: tipo, p_ultimo: n }).then(function () { Nube.corr[tipo] = n; }); },

  /* ---------- cambios de otros usuarios ---------- */
  can: function (o) {
    if (Array.isArray(o)) return '[' + o.map(Nube.can).join(',') + ']';
    if (o && typeof o === 'object') return '{' + Object.keys(o).sort().map(function (k) { return JSON.stringify(k) + ':' + Nube.can(o[k]); }).join(',') + '}';
    return JSON.stringify(o);
  },
  ocupado: function () { var m2 = $('modal2Bg'); return Nube.pend.length || Nube.corriendo || $('modalBg').classList.contains('on') || (m2 && m2.classList.contains('on')); },
  refrescar: function () {
    if (!DB || Nube.ocupado() || !Auth.token()) return;
    Promise.all([Nube.f('cxp_registros?select=coleccion,id,data,version,updated_at&order=updated_at&limit=1000' + (Nube.ult ? '&updated_at=gt.' + encodeURIComponent(Nube.ult) : '')).then(function (r) { return r.ok ? r.json() : []; }), Nube.correlativos()]).then(function (res) {
      if (Nube.ocupado()) return;
      var cambio = false;
      res[0].forEach(function (x) {
        if (x.updated_at > Nube.ult) Nube.ult = x.updated_at;
        var k = x.coleccion + '|' + x.id, b = Nube.base[k];
        if (x.coleccion === 'config') { if (Nube.can(x.data) !== Nube.can(Nube.cfg())) { Object.assign(DB.config, x.data); cambio = true; } Nube.verCfg = x.version; Nube.fijarBaseCfg(); return; }
        if (!DB[x.coleccion] || x.coleccion === 'config') return;
        if (b && Nube.can(JSON.parse(b.s)) === Nube.can(x.data)) { b.v = x.version; return; }
        var L = DB[x.coleccion], i = L.findIndex(function (d) { return d.id === x.id; });
        if (i >= 0) L[i] = x.data; else L.push(x.data);
        Nube.base[k] = { v: x.version, s: JSON.stringify(x.data) }; cambio = true;
      });
      ['iva', 'islr'].forEach(function (t) { if (Nube.corr[t] != null) DB.config.corr[t] = Nube.corr[t]; });
      if (cambio) { Aud.init(); UI.render(); }
    }).catch(function () {});
  },

  /* ---------- comprobantes de pago en Dropbox ---------- */
  fn: function (body) {
    return (Auth.expired() ? Auth.refresh() : Promise.resolve(true)).then(function () {
      return fetch(Auth.base() + '/functions/v1/informes-dropbox', { method: 'POST', headers: Store.headers(), body: JSON.stringify(body) });
    }).catch(function () { throw Error('No se pudo contactar la función «informes-dropbox»'); }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) { if (!r.ok || d.error) throw Error(r.status === 404 ? 'Falta desplegar la función «informes-dropbox»' : (d.error || d.message || 'Error ' + r.status)); return d; });
    });
  },
  limpio: function (s, max) { s = String(s || '').replace(/[\\\/:*?"<>|\u0000-\u001f]+/g, '-').replace(/\.{2,}/g, '.').replace(/\s+/g, ' ').trim().slice(0, max || 60); return s.replace(/[. ]+$/, '') || 'sin-nombre'; },
  /* /CxP/<año-mes>/<proveedor>/<documento>/<hora>_<nombre>.<pdf|jpg|png> */
  subirComp: function (c, d, fecha) {
    var ext = (/\.(pdf|jpe?g|png)$/i.exec(c.nombre) || ['.pdf'])[0], z = uid('');
    var path = '/CxP/' + fecha.slice(0, 7) + '/' + Nube.limpio(nomDoc(d)) + '/' + Nube.limpio(TIPOS[d.tipo] + ' ' + d.numero) + '/' + z + '_' + Nube.limpio(c.nombre.replace(/\.[^.]+$/, '')) + ext;
    return Nube.fn({ accion: 'subir', path: path }).then(function (x) {
      return fetch(x.link, { method: 'POST', headers: { 'Content-Type': 'application/octet-stream' }, body: c.file }).then(function (r) {
        if (!r.ok) throw Error('Dropbox no aceptó ' + c.nombre + ' (' + r.status + ')');
        return { nombre: c.nombre, tam: c.tam, path: x.path || path };
      });
    });
  },
  verComp: function (path) {
    var w = window.open('about:blank', '_blank');
    Nube.fn({ accion: 'ver', path: path }).then(function (d) { if (w) w.location = d.link; else location.href = d.link; }).catch(function (e) { if (w) w.close(); toast(e.message); });
  },

  /* ---------- entrada ---------- */
  pedirLogin: function () { var b = $('loginBg'); if (b) { b.classList.add('on'); var e = $('lgEmail'); if (e) e.focus(); } },
  bloqueo: function (t) {
    $('tabbar').style.display = 'none'; $('userRol').style.display = 'none';
    document.querySelector('.wrap').innerHTML = '<div class="card" style="margin-top:24px"><div class="section-body"><div class="empty">' + t + '<br><br><button class="btn g" onclick="location.href=\'../\'">Volver al portal</button></div></div></div>';
  },
  arrancar: function () {
    $('userWrap').style.display = 'inline-flex'; $('userEmail').textContent = Auth.email() || ''; $('btnSalir').style.display = '';
    return Nube.rpc('cxp_mi_perfil').then(function (L) {
      var p = (L || [])[0], pm = (p && p.permisos) || {};
      if (!p || (p.rol !== 'admin' && !Object.keys(Object.assign({}, pm.ver, pm.editar)).length)) { Nube.bloqueo('Su usuario no tiene acceso a Cuentas por Pagar. Pídaselo al administrador.'); return null; }
      Nube.perfil = { email: Auth.email(), rol: p.rol, permisos: pm }; Nube.usuarios = [Nube.perfil];
      return Promise.all([p.rol === 'admin' ? Nube.rpc('cxp_usuarios') : null, Nube.rpc('cxp_personal').catch(function () { return []; }), Nube.leer()]).then(function (res) {
        if (res[0]) Nube.usuarios = res[0].map(function (u) { var m = u.email === Nube.perfil.email; return { user_id: u.user_id, email: u.email, rol: u.super_admin || m ? 'admin' : u.rol, permisos: u.permisos || {}, superAdmin: !!u.super_admin }; });
        Personal._l = res[1] || [];
        Aud.init();
        return true;
      });
    }).then(function (ok) {
      if (!ok) return;
      BCV.cargar(); Seg.cargar().then(function () { if (UI.cur) UI.render(); });
      UI.entrar();
      window.addEventListener('focus', Nube.refrescar); setInterval(Nube.refrescar, 60000);
      window.addEventListener('beforeunload', function (e) { if (Nube.pend.length) { e.preventDefault(); e.returnValue = ''; } });
    }).catch(function (e) {
      if (e && e.red) return;
      Nube.bloqueo('No se pudo abrir Cuentas por Pagar: ' + esc((e && e.message) || 'error') + (/could not find|does not exist|PGRST20/i.test((e && e.message) || '') ? '<br>Falta ejecutar los SQL 23, 24 y 25 en Supabase.' : ''));
    });
  },
  boot: function () {
    Auth.load();
    if (!Auth.token()) { Nube.pedirLogin(); return; }
    (Auth.expired() ? Auth.refresh() : Promise.resolve(true)).then(function () { if (Auth.token()) Nube.arrancar(); else Nube.pedirLogin(); });
  }
};
UI.doLogin = function () {
  var em = $('lgEmail').value.trim(), pa = $('lgPass').value, msg = $('lgMsg'), btn = $('lgBtn');
  if (!em || !pa) { msg.textContent = 'Ingrese correo y contraseña'; return; }
  btn.disabled = true; msg.textContent = '';
  Auth.login(em, pa).then(function (r) {
    btn.disabled = false;
    if (!r.ok) { msg.textContent = r.err; return; }
    $('loginBg').classList.remove('on'); $('lgPass').value = '';
    /* la sesión venció con la app abierta: se sigue donde iba */
    if (DB) Nube.drenar(); else Nube.arrancar();
  });
};
